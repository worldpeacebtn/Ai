            });
            document.getElementById('btnAddKeyframe').addEventListener('click', () => addKeyframe(currentTime));
            document.getElementById('btnPlayPause').addEventListener('click', () => {
                isPlaying = !isPlaying;
                document.getElementById('btnPlayPause').textContent = isPlaying ? '⏸️' : '▶️';
            });
            document.getElementById('btnClearKF').addEventListener('click', () => { keyframes = [];
                timelineSlider.max = 10;
                showToast('🗑️', 'KF cleared'); });

            // ═══════════════════════════════════════════
            // Camera Controls
            // ═══════════════════════════════════════════
            function updateCameraFromSpherical() {
                const sp = camSpherical,
                    si = Math.sin(sp.phi);
                camera.position.set(camTarget.x + sp.r * si * Math.sin(sp.theta), camTarget.y + sp.r * Math.cos(sp.phi),
                    camTarget.z + sp.r * si * Math.cos(sp.theta));
                camera.lookAt(camTarget);
            }

            function handleTouchStart(e) {
                e.preventDefault();
                const touches = e.touches;
                dragState.touches = Array.from(touches).map(t => ({ x: t.clientX, y: t.clientY, id: t.identifier }));
                if (touches.length === 1) {
                    if (mode === 'pose') {
                        const jid = getJointAtScreen(touches[0].clientX, touches[0].clientY);
                        if (jid) {
                            dragState.mode = 'dragJoint';
                            dragState.jointId = jid;
                            selectedJoint = jid;
                            dragState.plane = getDragPlane(joints[jid].worldPos);
                            highlightJoint(jid, true);
                            showToast('🦴', skelDef[jid].name);
                            return;
                        }
                    }
                    dragState.mode = 'rotate';
                    dragState.spherical = { ...camSpherical };
                    dragState.touches = [{ x: touches[0].clientX, y: touches[0].clientY }];
                } else if (touches.length === 2) {
                    dragState.mode = 'pinch';
                    const dx = touches[0].clientX - touches[1].clientX;
                    const dy = touches[0].clientY - touches[1].clientY;
                    dragState.startDist = Math.sqrt(dx * dx + dy * dy);
                    dragState.spherical = { ...camSpherical };
                }
            }

            function handleTouchMove(e) {
                e.preventDefault();
                const touches = e.touches;
                if (dragState.mode === 'rotate' && touches.length === 1) {
                    const dx = touches[0].clientX - dragState.touches[0].x;
                    const dy = touches[0].clientY - dragState.touches[0].y;
                    dragState.touches = [{ x: touches[0].clientX, y: touches[0].clientY }];
                    camSpherical.theta -= dx * 0.006;
                    camSpherical.phi = Math.max(0.15, Math.min(Math.PI - 0.15, dragState.spherical.phi + dy * 0.006));
                    updateCameraFromSpherical();
                } else if (dragState.mode === 'pinch' && touches.length === 2) {
                    const dx = touches[0].clientX - touches[1].clientX;
                    const dy = touches[0].clientY - touches[1].clientY;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    const scale = dragState.startDist / dist;
                    camSpherical.r = Math.max(3, Math.min(50, dragState.spherical.r * scale));
                    updateCameraFromSpherical();
                } else if (dragState.mode === 'dragJoint' && touches.length === 1) {
                    const wp = getPointOnPlane(touches[0].clientX, touches[0].clientY, dragState.plane);
                    if (wp) { moveJointToWorld(dragState.jointId, wp); if (mode === 'animate') addKeyframe(currentTime); }
                }
            }

            function handleTouchEnd(e) {
                if (dragState.mode === 'dragJoint') { highlightJoint(dragState.jointId, false);
                    dragState.jointId = null;
                    dragState.plane = null; }
                dragState.mode = 'none';
                dragState.touches = [];
            }

            function highlightJoint(id, on) {
                const mesh = jointMeshes[id];
                if (!mesh) return;
                if (on) {
                    mesh.scale.set(1.6, 1.6, 1.6);
                    mesh.material.emissiveIntensity = 2.5;
                    const sp = joints[id].worldPos.clone().project(camera);
                    jointHighlight.style.display = 'block';
                    jointHighlight.style.left = ((sp.x * 0.5 + 0.5) * container.clientWidth) + 'px';
                    jointHighlight.style.top = ((-sp.y * 0.5 + 0.5) * container.clientHeight) + 'px';
                } else {
                    mesh.scale.set(1, 1, 1);
                    mesh.material.emissiveIntensity = 0.8;
                    jointHighlight.style.display = 'none';
                }
            }

            function handleMouseDown(e) {
                if (e.button !== 0) return;
                if (mode === 'pose') {
                    const jid = getJointAtScreen(e.clientX, e.clientY);
                    if (jid) {
                        dragState.mode = 'dragJoint';
                        dragState.jointId = jid;
                        selectedJoint = jid;
                        dragState.plane = getDragPlane(joints[jid].worldPos);
                        highlightJoint(jid, true);
                        return;
                    }
                }
                dragState.mode = 'rotate';
                dragState.spherical = { ...camSpherical };
                dragState.touches = [{ x: e.clientX, y: e.clientY }];
            }

            function handleMouseMove(e) {
                if (dragState.mode === 'rotate') {
                    const dx = e.clientX - dragState.touches[0].x;
                    const dy = e.clientY - dragState.touches[0].y;
                    dragState.touches = [{ x: e.clientX, y: e.clientY }];
                    camSpherical.theta -= dx * 0.006;
                    camSpherical.phi = Math.max(0.15, Math.min(Math.PI - 0.15, dragState.spherical.phi + dy * 0.006));
                    updateCameraFromSpherical();
                } else if (dragState.mode === 'dragJoint') {
                    const wp = getPointOnPlane(e.clientX, e.clientY, dragState.plane);
                    if (wp) { moveJointToWorld(dragState.jointId, wp); if (mode === 'animate') addKeyframe(currentTime); }
                }
            }

            function handleMouseUp() {
                if (dragState.mode === 'dragJoint') { highlightJoint(dragState.jointId, false);
                    dragState.jointId = null; }
                dragState.mode = 'none';
            }

            function handleWheel(e) {
                e.preventDefault();
                camSpherical.r = Math.max(3, Math.min(50, camSpherical.r * (e.deltaY > 0 ? 1.1 : 0.9)));
                updateCameraFromSpherical();
            }

            renderer.domElement.addEventListener('touchstart', handleTouchStart, { passive: false });
            renderer.domElement.addEventListener('touchmove', handleTouchMove, { passive: false });
            renderer.domElement.addEventListener('touchend', handleTouchEnd, { passive: true });
            renderer.domElement.addEventListener('touchcancel', handleTouchEnd, { passive: true });
            renderer.domElement.addEventListener('mousedown', handleMouseDown);
            renderer.domElement.addEventListener('mousemove', handleMouseMove);
            renderer.domElement.addEventListener('mouseup', handleMouseUp);
            renderer.domElement.addEventListener('mouseleave', handleMouseUp);
            renderer.domElement.addEventListener('wheel', handleWheel, { passive: false });

            // ═══════════════════════════════════════════
            // Toast
            // ═══════════════════════════════════════════
            function showToast(icon, text) {
                toastIcon.textContent = icon;
                toastText.textContent = text;
                toast.classList.add('show');
                clearTimeout(toastTimeout);
                toastTimeout = setTimeout(() => toast.classList.remove('show'), 1800);
            }

            // ═══════════════════════════════════════════
            // Resize
            // ═══════════════════════════════════════════
            function handleResize() {
                camera.aspect = container.clientWidth / container.clientHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(container.clientWidth, container.clientHeight);
                updateJointLabels();
            }
            window.addEventListener('resize', handleResize);
            window.addEventListener('orientationchange', () => setTimeout(handleResize, 300));

            // ═══════════════════════════════════════════
            // Main Loop
            // ═══════════════════════════════════════════
            function animate() {
                animationId = requestAnimationFrame(animate);
                const now = Date.now();
                const delta = (now - lastFrameTime) / 1000;
                lastFrameTime = now;
                const time = now * 0.001;

                // Update uniforms
                scene.traverse(o => {
                    if (o.material && o.material.uniforms && o.material.uniforms.uTime) {
                        o.material.uniforms.uTime.value = time;
                        o.material.uniforms.uShimmer.value = shimmerIntensity;
                        o.material.uniforms.uFlow.value = flowSpeed;
                    }
                });

                // Rainbow mode
                if (rainbowMode && (photoParticles || textParticles)) {
                    const pts = photoParticles || textParticles;
                    const colAttr = pts.geometry.attributes.aColor;
                    const n = colAttr.count;
                    for (let i = 0; i < n; i++) {
                        const hue = (i / n + time * 0.05) % 1;
                        const c = new THREE.Color().setHSL(hue, 0.85, 0.6);
                        colAttr.setXYZ(i, c.r, c.g, c.b);
                    }
                    colAttr.needsUpdate = true;
                }

                // Audio reactive
                if (audioActive) {
                    const level = getAudioLevel();
                    const bands = getAudioBands();
                    const visMode = audioVisualMode.value;
                    const sens = audioSensitivity * bassBoost;
                    const boost = level * sens;

                    // Update audio indicator bars
                    for (let i = 0; i < audioBars.length; i++) {
                        const b = bands[i % bands.length] || 0;
                        audioBars[i].style.height = (5 + b * 35 * sens) + 'px';
                    }

                    // Apply to particles
                    const targetPts = photoParticles || textParticles || bgStars;
                    if (targetPts && targetPts.geometry.attributes.aSize) {
                        const sizes = targetPts.geometry.attributes.aSize;
                        const baseSize = particleSize;
                        for (let i = 0; i < sizes.count; i++) {
                            const orig = sizes.getX(i);
                            let scale = 1;
                            if (visMode === 'pulse') scale = 1 + boost * 0.8;
                            else if (visMode === 'burst') scale = 1 + boost * 2.5 * Math.random();
                            else if (visMode === 'wave') scale = 1 + boost * Math.sin(i * 0.3 + time * 4) * 0.7;
                            else if (visMode === 'spin') scale = 1 + boost * 0.5;
                            sizes.setX(i, baseSize * scale * (0.5 + Math.random() * 0.1));
                        }
                        sizes.needsUpdate = true;
                    }

                    // Pulse lights
                    pointLight1.intensity = 1.5 + boost * 2;
                    pointLight2.intensity = 1.2 + boost * 1.8;
                } else {
                    pointLight1.intensity = 1.8;
                    pointLight2.intensity = 1.5;
                    for (const b of audioBars) b.style.height = '3px';
                }

                // Animate text particles (blend-in effect)
                if (textParticles) {
                    const blendMode = textBlendMode.value;
                    const pos = textParticles.geometry.attributes.position;
                    const n = pos.count;
                    const tp = textPanel.querySelector('.tfslider-wrap');
                    const fs = parseInt(tp?.dataset.value || 36);
                    const canvas = document.createElement('canvas');
                    canvas.width = 400;
                    canvas.height = 120;
                    const ctx = canvas.getContext('2d');
                    ctx.fillStyle = '#fff';
                    ctx.font = 'bold ' + fs + 'px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(textInput.value || 'STARDUST', canvas.width / 2, canvas.height / 2);
                    const idata = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const data = idata.data;
                    const step = Math.max(1, Math.floor(particleDensity * 0.8));
                    const dw = 10,
                        dh = dw * canvas.height / canvas.width;
                    const cx = 0,
                        cy = 1.5,
                        cz = -0.2;
                    let idx = 0;
                    for (let y = 0; y < canvas.height && idx < n; y += step) {
                        for (let x = 0; x < canvas.width && idx < n; x += step) {
                            const di = (y * canvas.width + x) * 4;
                            const br = (data[di] + data[di + 1] + data[di + 2]) / 3;
                            if (br < 50) continue;
                            const tx = ((x / canvas.width) - 0.5) * dw + cx;
                            const ty = -((y / canvas.height) - 0.5) * dh + cy;
                            const tz = cz;
                            const ease = Math.min(1, time * 0.8);
                            let px = pos.getX(idx),
                                py = pos.getY(idx),
                                pz = pos.getZ(idx);
                            if (blendMode === 'assemble') {
                                px = px + (tx - px) * ease * 0.6;
                                py = py + (ty - py) * ease * 0.6;
                                pz = pz + (tz - pz) * ease * 0.6;
                            } else if (blendMode === 'dissolve') {
                                const d = Math.sin(time * 2 + idx * 0.05) * 0.5;
                                px = tx + d;
                                py = ty + Math.cos(time * 1.7 + idx * 0.04) * 0.4;
                                pz = tz + d * 2;
                            } else if (blendMode === 'wave') {
                                px = tx + Math.sin(time * 2.5 + y * 0.04) * 0.5;
                                py = ty + Math.cos(time * 2 + x * 0.04) * 0.5;
                                pz = tz;
                            } else {
                                const a = idx * 0.1 + time * 3;
                                const r = Math.sin(time * 2 + idx * 0.07) * 2;
                                px = tx + Math.cos(a) * r;
                                py = ty + Math.sin(a) * r * 0.8;
                                pz = tz + Math.sin(time * 3 + idx * 0.05) * 1.5;
                            }
                            pos.setXYZ(idx, px, py, pz);
                            idx++;
                        }
                    }
                    pos.needsUpdate = true;
                }

                // Animation timeline
                if (isPlaying && keyframes.length > 0) {
                    const maxT = Math.max(...keyframes.map(k => k.time));
                    currentTime += delta;
                    if (currentTime > maxT) currentTime = 0;
                    timelineSlider.value = currentTime;
                    timeDisplay.textContent = currentTime.toFixed(1) + 's';
                    const pose = getPoseAtTime(currentTime);
                    if (pose) applyPose(pose);
                }

                // Update joint labels
                updateJointLabels();

                // Update lights
                pointLight1.position.x = Math.sin(time * 0.6) * 4.5;
                pointLight1.position.z = Math.cos(time * 0.4) * 3.5;
                pointLight2.position.x = Math.cos(time * 0.5) * 4;
                pointLight2.position.z = Math.sin(time * 0.7) * 3.5;

                renderer.render(scene, camera);
            }

            // ═══════════════════════════════════════════
            // Init
            // ═══════════════════════════════════════════
            function init() {
                buildSkeleton();
                resetPose();
                camSpherical = { r: 18, theta: 0, phi: 1.1 };
                camTarget.set(0, 1, 0);
                updateCameraFromSpherical();
                initAllSliders();
                updateAllSliders();
                timelineSlider.max = 10;
                timelineSlider.value = 0;
                timeDisplay.textContent = '0.0s';
                lastFrameTime = Date.now();
                animate();
                showToast('✨', 'Stardust 3D Studio Pro');
                setTimeout(() => {
                    const saved = localStorage.getItem('stardust3d_pro');
                    if (saved) showToast('💾', 'Save found — tap 📂');
                }, 600);
            }

            setTimeout(handleResize, 100);
            init();

            // Expose some functions for debugging
            window.__stardust = {
                addKeyframe,
                saveScene,
                loadScene,
                exportHTML,
                createTextParticles,
                startMic,
                processImage,
                getAudioLevel,
                resetPose,
                rainbowMode: () => rainbowMode,
                setRainbow: v => { rainbowMode = v;
                    document.getElementById('btnRainbow').classList.toggle('active', v); },
            };

        })();
    </script>
