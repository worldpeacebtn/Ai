<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>⚡ Ai Desktop · Cyberpunk Nexus</title>
  <style>
    /* ----- RESET & BASE ----- */
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    body {
      background: #0b0b1a;
      color: #d0d0ff;
      font-family: 'Segoe UI', 'Courier New', monospace;
      height: 100vh;
      overflow: hidden;
      transition: background 0.3s, color 0.3s;
    }
    /* Themes – applied to body */
    body.theme-purple { background: #0b0b1a; color: #d0d0ff; }
    body.theme-blue   { background: #0a0a20; color: #aac0ff; }
    body.theme-green  { background: #0a1a0a; color: #aaffaa; }
    body.theme-red    { background: #1a0a0a; color: #ffaaaa; }
    body.theme-cyber  { background: #0a0a12; color: #00ffcc; }

    /* ----- TOOLBAR ----- */
    #toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.6rem;
      padding: 0.5rem 1.2rem;
      background: rgba(10, 10, 30, 0.85);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid #3a2a6a;
      position: relative;
      z-index: 1000;
      transition: background 0.3s, border-color 0.3s;
      max-height: 64px;
      overflow-x: auto;
    }
    .theme-blue #toolbar { background: rgba(10, 10, 40, 0.9); border-color: #2a4a8a; }
    .theme-green #toolbar { background: rgba(10, 30, 10, 0.9); border-color: #2a6a2a; }
    .theme-red #toolbar { background: rgba(40, 10, 10, 0.9); border-color: #8a2a2a; }
    .theme-cyber #toolbar { background: rgba(0, 20, 20, 0.9); border-color: #00aa88; }

    #toolbar h1 {
      font-size: 1.4rem;
      font-weight: 300;
      letter-spacing: 2px;
      text-shadow: 0 0 20px #7a5cff;
      color: #b8b0ff;
      margin-right: 0.8rem;
      white-space: nowrap;
    }
    #toolbar button {
      background: #1a1a3a;
      border: 1px solid #4a3a8a;
      color: #c8c0ff;
      padding: 0.3rem 1rem;
      border-radius: 30px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.8rem;
      transition: 0.2s;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }
    #toolbar button:hover {
      background: #3a2a7a;
      border-color: #9a7aff;
      box-shadow: 0 0 20px #4a3a9a66;
    }
    #toolbar input[type="text"] {
      background: #0f0f2a;
      border: 1px solid #3a2a6a;
      color: #d0d0ff;
      padding: 0.2rem 0.8rem;
      border-radius: 30px;
      font-family: inherit;
      font-size: 0.8rem;
      outline: none;
      min-width: 120px;
    }
    #toolbar input[type="text"]:focus { border-color: #9a7aff; }
    .toolbar-group {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      flex-wrap: nowrap;
    }
    .toolbar-group label { font-size: 0.7rem; color: #8a8aba; white-space: nowrap; }

    /* ----- DESKTOP ----- */
    #desktop {
      position: relative;
      width: 100%;
      height: calc(100vh - 110px); /* toolbar + taskbar */
      overflow: hidden;
      background: transparent;
    }

    /* ----- WINDOW ----- */
    .window {
      position: absolute;
      min-width: 240px;
      min-height: 180px;
      background: rgba(16, 16, 40, 0.92);
      backdrop-filter: blur(6px);
      border: 1px solid #4a3a7a;
      border-radius: 12px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.8), 0 0 30px #2a1a5a44;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: box-shadow 0.2s;
      z-index: 10;
    }
    .window:hover { box-shadow: 0 8px 50px rgba(60, 40, 160, 0.4); }
    .window.maximized {
      top: 0 !important; left: 0 !important;
      width: 100% !important; height: 100% !important;
      border-radius: 0; border: none;
    }
    .window.minimized { display: none; }

    .window-header {
      display: flex;
      align-items: center;
      background: rgba(20, 20, 60, 0.8);
      padding: 0.2rem 0.6rem;
      border-bottom: 1px solid #3a2a6a;
      cursor: grab;
      flex-shrink: 0;
      min-height: 32px;
    }
    .window-header:active { cursor: grabbing; }
    .window-title {
      flex: 1;
      font-size: 0.85rem;
      font-weight: 400;
      letter-spacing: 0.3px;
      color: #c8c0ff;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-right: 0.5rem;
    }
    .window-controls {
      display: flex;
      gap: 0.2rem;
    }
    .window-controls button {
      background: none;
      border: none;
      color: #8a7aaa;
      font-size: 0.9rem;
      cursor: pointer;
      padding: 0 0.2rem;
      transition: 0.15s;
      line-height: 1;
    }
    .window-controls button:hover { color: #d0c0ff; }
    .window-controls .btn-close:hover { color: #ff6a8a; }
    .window-controls .btn-minimize:hover { color: #ffcc66; }
    .window-controls .btn-maximize:hover { color: #66ffcc; }

    .window-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }
    .window-content iframe {
      width: 100%;
      flex: 1;
      border: none;
      background: #0a0a1a;
      min-height: 100px;
    }
    .window-notes-area {
      background: rgba(0,0,0,0.3);
      border-top: 1px solid #2a2a5a;
      padding: 0.3rem 0.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
      flex-shrink: 0;
      max-height: 140px;
      overflow-y: auto;
    }
    .window-notes-area textarea {
      background: #0a0a1a;
      border: 1px solid #3a2a6a;
      color: #c8c0ff;
      padding: 0.2rem;
      border-radius: 6px;
      resize: vertical;
      font-family: inherit;
      font-size: 0.7rem;
      min-height: 36px;
      width: 100%;
      outline: none;
    }
    .window-notes-area textarea:focus { border-color: #9a7aff; }
    .window-tags {
      display: flex;
      align-items: center;
      gap: 0.3rem;
      flex-wrap: wrap;
    }
    .window-tags input {
      background: #0a0a1a;
      border: 1px solid #3a2a6a;
      color: #d0d0ff;
      padding: 0.1rem 0.5rem;
      border-radius: 20px;
      font-size: 0.65rem;
      flex: 1;
      min-width: 50px;
      outline: none;
    }
    .window-tags input:focus { border-color: #9a7aff; }
    .window-tags .tag-label {
      font-size: 0.6rem;
      color: #8a8aba;
    }

    /* Resize handle */
    .resize-handle {
      position: absolute;
      bottom: 0;
      right: 0;
      width: 16px;
      height: 16px;
      cursor: nwse-resize;
      background: linear-gradient(135deg, transparent 50%, #4a3a7a 50%);
      border-bottom-right-radius: 12px;
      z-index: 20;
    }

    /* ----- TASKBAR ----- */
    #taskbar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 46px;
      background: rgba(10, 10, 30, 0.9);
      backdrop-filter: blur(8px);
      border-top: 1px solid #3a2a6a;
      display: flex;
      align-items: center;
      padding: 0 0.8rem;
      gap: 0.4rem;
      z-index: 2000;
      overflow-x: auto;
      flex-wrap: nowrap;
      white-space: nowrap;
    }
    #taskbar::-webkit-scrollbar { height: 3px; }
    #taskbar::-webkit-scrollbar-thumb { background: #4a3a7a; border-radius: 3px; }

    .task-item {
      background: #1a1a3a;
      border: 1px solid #4a3a7a;
      border-radius: 6px;
      padding: 0.15rem 0.6rem;
      font-size: 0.7rem;
      color: #c8c0ff;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.3rem;
      flex-shrink: 0;
      transition: 0.15s;
    }
    .task-item:hover {
      background: #3a2a6a;
      border-color: #9a7aff;
    }
    .task-item .close-task {
      color: #8a6a8a;
      font-size: 0.7rem;
      margin-left: 0.2rem;
    }
    .task-item .close-task:hover { color: #ff6a8a; }

    /* ----- APP GRID MODAL ----- */
    .app-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(6px);
      z-index: 3000;
      justify-content: center;
      align-items: center;
      padding: 1rem;
    }
    .app-modal.active { display: flex; }
    .app-modal-content {
      background: #12122a;
      border: 1px solid #5a4a9a;
      border-radius: 20px;
      padding: 1.5rem;
      max-width: 900px;
      width: 100%;
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: 0 0 60px #2a1a5a88;
    }
    .app-modal-content h2 {
      margin-bottom: 0.8rem;
      color: #b8b0ff;
      font-weight: 300;
      letter-spacing: 2px;
    }
    .app-modal-content input[type="text"] {
      width: 100%;
      padding: 0.5rem;
      background: #0a0a1a;
      border: 1px solid #3a2a6a;
      border-radius: 30px;
      color: #d0d0ff;
      font-size: 0.9rem;
      margin-bottom: 1rem;
      outline: none;
    }
    .app-modal-content input:focus { border-color: #9a7aff; }
    .app-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 0.8rem;
    }
    .app-grid-item {
      background: #1a1a3a;
      border: 1px solid #3a2a6a;
      border-radius: 12px;
      padding: 0.6rem;
      text-align: center;
      cursor: pointer;
      transition: 0.2s;
    }
    .app-grid-item:hover {
      background: #3a2a7a;
      border-color: #9a7aff;
      transform: scale(1.03);
    }
    .app-grid-item .app-name {
      font-size: 0.8rem;
      color: #c8c0ff;
      word-break: break-word;
    }
    .app-grid-item .app-desc {
      font-size: 0.65rem;
      color: #8a8aba;
      margin-top: 0.2rem;
    }
    .app-grid-item .app-badge {
      display: inline-block;
      margin-top: 0.3rem;
      font-size: 0.55rem;
      background: #2a1a5a;
      padding: 0.1rem 0.6rem;
      border-radius: 20px;
      color: #aa9aff;
    }
    .app-modal-close {
      position: sticky;
      top: 0;
      float: right;
      background: none;
      border: none;
      color: #8a7aaa;
      font-size: 2rem;
      cursor: pointer;
      padding: 0 0.5rem;
      z-index: 10;
    }
    .app-modal-close:hover { color: #ff6a8a; }

    /* scrollbar */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: #0a0a1a; }
    ::-webkit-scrollbar-thumb { background: #4a3a7a; border-radius: 4px; }

    /* responsive */
    @media (max-width: 700px) {
      #toolbar { flex-wrap: wrap; gap: 0.3rem; max-height: 100px; }
      #toolbar h1 { font-size: 1rem; }
      .window { min-width: 180px; min-height: 140px; }
    }
  </style>
</head>
<body class="theme-purple">

  <!-- TOOLBAR -->
  <div id="toolbar">
    <h1>✦ Ai · DESKTOP ✦</h1>
    <button id="openAppGridBtn">📦 Apps</button>
    <button id="openAllBtn">🚀 Open All</button>
    <button id="closeAllBtn">✖ Close All</button>
    <button id="themeToggleBtn">🎨 Theme</button>
    <div class="toolbar-group">
      <label>🔍 Tag:</label>
      <input type="text" id="filterInput" placeholder="filter by tag" />
    </div>
    <div class="toolbar-group">
      <label>📋 Sort:</label>
      <select id="sortSelect">
        <option value="name">Name</option>
        <option value="tag">Tag</option>
        <option value="date">Date added</option>
      </select>
    </div>
    <button id="exportBtn">📥 Export</button>
    <button id="importBtn">📤 Import</button>
    <input type="file" id="importFileInput" accept=".txt" style="display:none;" />
  </div>

  <!-- DESKTOP -->
  <div id="desktop"></div>

  <!-- TASKBAR -->
  <div id="taskbar"></div>

  <!-- APP GRID MODAL -->
  <div class="app-modal" id="appModal">
    <div class="app-modal-content">
      <button class="app-modal-close" id="appModalClose">✕</button>
      <h2>📦 Available Apps</h2>
      <input type="text" id="appSearchInput" placeholder="Search apps..." />
      <div class="app-grid" id="appGridContainer"></div>
    </div>
  </div>

  <script>
    (function() {
      // --------------------------------------------------------------
      // 1. APP DEFINITIONS
      // --------------------------------------------------------------
      const appList = [
        { file: 'index0',        desc: 'Legacy root – early proto' },
        { file: 'index01',       desc: 'Another early iteration' },
        { file: 'index2',        desc: 'Older experimental interface' },
        { file: 'index42',       desc: 'The answer – quirky numeric entry' },
        { file: 'CREATORBOARD',  desc: 'Digital canvas – sketch & generate' },
        { file: 'SHELLCREATOR',  desc: 'Modular shell builder' },
        { file: 'ULTRACREANODE', desc: 'High‑frequency generative core' },
        { file: 'DEEPUCOCREA',   desc: 'Deep subconscious creation' },
        { file: 'UNIWAVEEDITOR', desc: 'Universal waveform editor' },
        { file: 'MUSICSHELL0',   desc: 'Audio playground – loop, sample' },
        { file: 'MUSICSHELLGEN', desc: 'Generative music machine' },
        { file: 'COSMICSHELL0',  desc: 'Cosmic visualiser – navigate the void' },
        { file: 'SANCTUARYC',    desc: 'Calm refuge – peaceful digital space' },
        { file: 'MIRAC',         desc: 'Miracle generator – unexpected wonders' },
        { file: 'MMRYROOMS',     desc: 'Memory archive – store & revisit' },
        { file: 'MS',            desc: 'Mind state – core consciousness' },
        { file: 'MS2',           desc: 'Mind state v2 – upgraded shell' },
        { file: 'MSNXTXPLORING', desc: 'Next‑gen mind explorer' },
        { file: 'WEBAPPANIMATOR',desc: 'Web animation studio' },
        { file: 'WEBEDI',        desc: 'Lightweight web editor' },
        { file: 'WEBEDITX',      desc: 'Advanced web editor' },
        { file: 'UID',           desc: 'Identity manager' },
        { file: 'CYBERGIRLPOWA', desc: 'Empowered cyber‑aesthetic' },
        { file: 'ADVCC',         desc: 'Advanced command console' },
        { file: 'CC',            desc: 'Core command – quick terminal' },
        { file: 'COCD',          desc: 'Command & control dashboard' },
        { file: 'OBERLAYHUD',    desc: 'Heads‑up display – data overlay' },
        { file: 'UCOEDI',        desc: 'Universal editor + HUD' },
      ];

      // --------------------------------------------------------------
      // 2. STATE
      // --------------------------------------------------------------
      let windows = [];
      let nextId = 1;
      const STORAGE_KEY = 'ai_desktop_state_v2';

      // DOM refs
      const desktop = document.getElementById('desktop');
      const taskbar = document.getElementById('taskbar');
      const openAppGridBtn = document.getElementById('openAppGridBtn');
      const appModal = document.getElementById('appModal');
      const appModalClose = document.getElementById('appModalClose');
      const appSearchInput = document.getElementById('appSearchInput');
      const appGridContainer = document.getElementById('appGridContainer');
      const openAllBtn = document.getElementById('openAllBtn');
      const closeAllBtn = document.getElementById('closeAllBtn');
      const themeToggleBtn = document.getElementById('themeToggleBtn');
      const filterInput = document.getElementById('filterInput');
      const sortSelect = document.getElementById('sortSelect');
      const exportBtn = document.getElementById('exportBtn');
      const importBtn = document.getElementById('importBtn');
      const importFileInput = document.getElementById('importFileInput');

      // --------------------------------------------------------------
      // 3. HELPERS
      // --------------------------------------------------------------
      function getAppUrl(file) { return `./${file}.html`; }

      // --------------------------------------------------------------
      // 4. WINDOW CREATION & RENDERING
      // --------------------------------------------------------------
      function createWindow(file, title, x, y, w, h, notes = '', tags = '', minimized = false, maximized = false) {
        const id = nextId++;
        const win = {
          id, file, title: title || file,
          x: x || 100 + Math.random() * 120,
          y: y || 60 + Math.random() * 80,
          w: w || 520,
          h: h || 420,
          minimized, maximized,
          notes, tags,
          date: Date.now()
        };
        windows.push(win);
        renderWindow(win);
        saveState();
        updateTaskbar();
        return win;
      }

      function renderWindow(win) {
        // Remove old DOM
        const existing = document.querySelector(`.window[data-id="${win.id}"]`);
        if (existing) existing.remove();
        if (win.minimized) {
          updateTaskbar();
          return;
        }

        const div = document.createElement('div');
        div.className = 'window';
        if (win.maximized) div.classList.add('maximized');
        div.dataset.id = win.id;
        div.style.left = win.x + 'px';
        div.style.top = win.y + 'px';
        div.style.width = win.w + 'px';
        div.style.height = win.h + 'px';
        div.style.zIndex = 10 + windows.indexOf(win);

        // Header
        const header = document.createElement('div');
        header.className = 'window-header';
        header.innerHTML = `
          <span class="window-title">${win.title}</span>
          <div class="window-controls">
            <button class="btn-minimize" title="Minimize">−</button>
            <button class="btn-maximize" title="Maximize">⛶</button>
            <button class="btn-close" title="Close">✕</button>
          </div>
        `;
        div.appendChild(header);

        // Content
        const content = document.createElement('div');
        content.className = 'window-content';
        const iframe = document.createElement('iframe');
        iframe.src = getAppUrl(win.file);
        iframe.loading = 'lazy';
        content.appendChild(iframe);

        // Notes
        const notesArea = document.createElement('div');
        notesArea.className = 'window-notes-area';
        notesArea.innerHTML = `
          <div class="window-tags">
            <span class="tag-label">🏷️ Tags:</span>
            <input type="text" class="tag-input" placeholder="comma, separated" value="${win.tags}" />
          </div>
          <textarea class="note-textarea" placeholder="Write notes...">${win.notes}</textarea>
        `;
        content.appendChild(notesArea);
        div.appendChild(content);

        // Resize handle
        const resizeHandle = document.createElement('div');
        resizeHandle.className = 'resize-handle';
        div.appendChild(resizeHandle);

        desktop.appendChild(div);

        // ----- EVENTS -----

        // 4a. Drag (via header)
        let dragData = null;
        header.addEventListener('mousedown', (e) => {
          if (e.target.closest('.window-controls')) return;
          const rect = div.getBoundingClientRect();
          dragData = {
            offsetX: e.clientX - rect.left,
            offsetY: e.clientY - rect.top,
          };
          const onMove = (ev) => {
            if (!dragData) return;
            let newX = ev.clientX - dragData.offsetX;
            let newY = ev.clientY - dragData.offsetY;
            const deskRect = desktop.getBoundingClientRect();
            newX = Math.max(0, Math.min(newX, deskRect.width - div.offsetWidth));
            newY = Math.max(0, Math.min(newY, deskRect.height - div.offsetHeight));
            div.style.left = newX + 'px';
            div.style.top = newY + 'px';
            const winData = windows.find(w => w.id === win.id);
            if (winData) { winData.x = newX; winData.y = newY; saveState(); }
          };
          const onUp = () => { dragData = null; document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); };
          document.addEventListener('mousemove', onMove);
          document.addEventListener('mouseup', onUp);
        });

        // 4b. Resize (via handle)
        let resizeData = null;
        resizeHandle.addEventListener('mousedown', (e) => {
          e.stopPropagation();
          const rect = div.getBoundingClientRect();
          resizeData = {
            startX: e.clientX,
            startY: e.clientY,
            startW: rect.width,
            startH: rect.height,
          };
          const onMove = (ev) => {
            if (!resizeData) return;
            let newW = resizeData.startW + (ev.clientX - resizeData.startX);
            let newH = resizeData.startH + (ev.clientY - resizeData.startY);
            newW = Math.max(240, newW);
            newH = Math.max(180, newH);
            div.style.width = newW + 'px';
            div.style.height = newH + 'px';
            const winData = windows.find(w => w.id === win.id);
            if (winData) { winData.w = newW; winData.h = newH; saveState(); }
          };
          const onUp = () => { resizeData = null; document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); };
          document.addEventListener('mousemove', onMove);
          document.addEventListener('mouseup', onUp);
        });

        // 4c. Controls
        header.querySelector('.btn-minimize').addEventListener('click', (e) => {
          e.stopPropagation();
          win.minimized = true;
          div.remove();
          updateTaskbar();
          saveState();
        });
        header.querySelector('.btn-maximize').addEventListener('click', (e) => {
          e.stopPropagation();
          win.maximized = !win.maximized;
          div.classList.toggle('maximized');
          if (win.maximized) {
            win._prevRect = { x: win.x, y: win.y, w: win.w, h: win.h };
            div.style.left = '0'; div.style.top = '0';
            div.style.width = '100%'; div.style.height = '100%';
          } else {
            const prev = win._prevRect || { x: 100, y: 60, w: 520, h: 420 };
            win.x = prev.x; win.y = prev.y; win.w = prev.w; win.h = prev.h;
            div.style.left = win.x + 'px'; div.style.top = win.y + 'px';
            div.style.width = win.w + 'px'; div.style.height = win.h + 'px';
          }
          saveState();
        });
        header.querySelector('.btn-close').addEventListener('click', (e) => {
          e.stopPropagation();
          closeWindow(win.id);
        });

        // 4d. Notes / tags auto-save
        const noteTextarea = notesArea.querySelector('.note-textarea');
        const tagInput = notesArea.querySelector('.tag-input');
        noteTextarea.addEventListener('input', () => { win.notes = noteTextarea.value; saveState(); });
        tagInput.addEventListener('input', () => { win.tags = tagInput.value; saveState(); });

        updateTaskbar();
        saveState();
      }

      function closeWindow(id) {
        const idx = windows.findIndex(w => w.id === id);
        if (idx === -1) return;
        const win = windows[idx];
        const el = document.querySelector(`.window[data-id="${id}"]`);
        if (el) el.remove();
        windows.splice(idx, 1);
        updateTaskbar();
        saveState();
      }

      // --------------------------------------------------------------
      // 5. TASKBAR
      // --------------------------------------------------------------
      function updateTaskbar() {
        taskbar.innerHTML = '';
        windows.forEach(win => {
          const item = document.createElement('div');
          item.className = 'task-item';
          const icon = win.file.charAt(0).toUpperCase();
          item.innerHTML = `
            <span>${icon} ${win.title}</span>
            <span class="close-task" data-id="${win.id}">✕</span>
          `;
          item.addEventListener('click', (e) => {
            if (e.target.classList.contains('close-task')) return;
            if (win.minimized) {
              win.minimized = false;
              renderWindow(win);
            } else {
              const el = document.querySelector(`.window[data-id="${win.id}"]`);
              if (el) {
                const maxZ = Math.max(...Array.from(document.querySelectorAll('.window')).map(el => parseInt(el.style.zIndex) || 0));
                el.style.zIndex = maxZ + 1;
              }
            }
            updateTaskbar();
            saveState();
          });
          const closeSpan = item.querySelector('.close-task');
          closeSpan.addEventListener('click', (e) => {
            e.stopPropagation();
            closeWindow(win.id);
          });
          taskbar.appendChild(item);
        });
      }

      // --------------------------------------------------------------
      // 6. APP GRID MODAL (searchable)
      // --------------------------------------------------------------
      function openAppGrid() {
        appModal.classList.add('active');
        renderAppGrid('');
      }

      function renderAppGrid(searchTerm = '') {
        const term = searchTerm.toLowerCase().trim();
        const filtered = appList.filter(app => 
          app.file.toLowerCase().includes(term) || app.desc.toLowerCase().includes(term)
        );
        appGridContainer.innerHTML = '';
        filtered.forEach(app => {
          const div = document.createElement('div');
          div.className = 'app-grid-item';
          div.innerHTML = `
            <div class="app-name">${app.file}</div>
            <div class="app-desc">${app.desc}</div>
            <div class="app-badge">+</div>
          `;
          div.addEventListener('click', () => {
            if (windows.some(w => w.file === app.file)) {
              alert('Already open.');
              return;
            }
            createWindow(app.file, app.file, 120 + Math.random() * 100, 80 + Math.random() * 80, 520, 420);
            appModal.classList.remove('active');
          });
          appGridContainer.appendChild(div);
        });
      }

      openAppGridBtn.addEventListener('click', openAppGrid);
      appModalClose.addEventListener('click', () => appModal.classList.remove('active'));
      appModal.addEventListener('click', (e) => {
        if (e.target === appModal) appModal.classList.remove('active');
      });
      appSearchInput.addEventListener('input', (e) => {
        renderAppGrid(e.target.value);
      });

      // --------------------------------------------------------------
      // 7. OPEN / CLOSE ALL
      // --------------------------------------------------------------
      openAllBtn.addEventListener('click', () => {
        appList.forEach(app => {
          if (!windows.some(w => w.file === app.file)) {
            createWindow(app.file, app.file, 120 + Math.random() * 150, 80 + Math.random() * 100, 520, 420);
          }
        });
      });

      closeAllBtn.addEventListener('click', () => {
        windows.slice().forEach(w => closeWindow(w.id));
      });

      // --------------------------------------------------------------
      // 8. THEME TOGGLE
      // --------------------------------------------------------------
      const themes = ['theme-purple', 'theme-blue', 'theme-green', 'theme-red', 'theme-cyber'];
      let themeIndex = 0;
      themeToggleBtn.addEventListener('click', () => {
        document.body.classList.remove(...themes);
        themeIndex = (themeIndex + 1) % themes.length;
        document.body.classList.add(themes[themeIndex]);
        localStorage.setItem('ai_desktop_theme', themes[themeIndex]);
      });
      // load saved theme
      const savedTheme = localStorage.getItem('ai_desktop_theme');
      if (savedTheme && themes.includes(savedTheme)) {
        document.body.classList.remove(...themes);
        document.body.classList.add(savedTheme);
        themeIndex = themes.indexOf(savedTheme);
      }

      // --------------------------------------------------------------
      // 9. FILTER & SORT
      // --------------------------------------------------------------
      function applyFilterAndSort() {
        const filter = filterInput.value.trim().toLowerCase();
        const sort = sortSelect.value;
        const allWindows = document.querySelectorAll('.window');
        allWindows.forEach(el => {
          const id = parseInt(el.dataset.id);
          const win = windows.find(w => w.id === id);
          if (!win) return;
          let show = true;
          if (filter) {
            const tags = win.tags.split(',').map(t => t.trim().toLowerCase());
            show = tags.some(t => t.includes(filter));
          }
          el.style.display = show ? 'flex' : 'none';
        });
        // Sort by reordering windows array (and re-render all non-minimized)
        const sortVal = sortSelect.value;
        windows.sort((a, b) => {
          if (sortVal === 'name') return a.title.localeCompare(b.title);
          if (sortVal === 'tag') return a.tags.localeCompare(b.tags);
          if (sortVal === 'date') return a.date - b.date;
          return 0;
        });
        // Re-render all non-minimized
        document.querySelectorAll('.window').forEach(el => el.remove());
        windows.forEach(win => {
          if (!win.minimized) renderWindow(win);
        });
        updateTaskbar();
        saveState();
      }

      filterInput.addEventListener('input', applyFilterAndSort);
      sortSelect.addEventListener('change', applyFilterAndSort);

      // --------------------------------------------------------------
      // 10. EXPORT / IMPORT
      // --------------------------------------------------------------
      function exportNotes() {
        const data = windows.map(win => ({
          title: win.title, file: win.file, notes: win.notes, tags: win.tags, date: win.date
        }));
        const text = JSON.stringify(data, null, 2);
        const blob = new Blob([text], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'ai_desktop_export.txt';
        a.click();
        URL.revokeObjectURL(url);
      }

      exportBtn.addEventListener('click', exportNotes);

      importBtn.addEventListener('click', () => importFileInput.click());
      importFileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const data = JSON.parse(ev.target.result);
            if (!Array.isArray(data)) throw new Error('Invalid format');
            data.forEach(item => {
              const win = windows.find(w => w.file === item.file);
              if (win) {
                win.notes = item.notes || '';
                win.tags = item.tags || '';
                const el = document.querySelector(`.window[data-id="${win.id}"]`);
                if (el) {
                  const textarea = el.querySelector('.note-textarea');
                  const tagInput = el.querySelector('.tag-input');
                  if (textarea) textarea.value = win.notes;
                  if (tagInput) tagInput.value = win.tags;
                }
              }
            });
            saveState();
            alert('Notes imported!');
          } catch (err) {
            alert('Import failed: ' + err.message);
          }
        };
        reader.readAsText(file);
        importFileInput.value = '';
      });

      // --------------------------------------------------------------
      // 11. PERSISTENCE
      // --------------------------------------------------------------
      function saveState() {
        const state = windows.map(win => ({
          id: win.id, file: win.file, title: win.title,
          x: win.x, y: win.y, w: win.w, h: win.h,
          minimized: win.minimized, maximized: win.maximized,
          notes: win.notes, tags: win.tags, date: win.date
        }));
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
      }

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return false;
          const data = JSON.parse(raw);
          if (!Array.isArray(data)) return false;
          data.forEach(item => {
            const win = {
              id: item.id, file: item.file, title: item.title || item.file,
              x: item.x || 100, y: item.y || 60,
              w: item.w || 520, h: item.h || 420,
              minimized: item.minimized || false,
              maximized: item.maximized || false,
              notes: item.notes || '',
              tags: item.tags || '',
              date: item.date || Date.now()
            };
            windows.push(win);
            if (!win.minimized) renderWindow(win);
          });
          const maxId = windows.reduce((max, w) => Math.max(max, w.id), 0);
          nextId = maxId + 1;
          updateTaskbar();
          return true;
        } catch(e) { return false; }
      }

      // --------------------------------------------------------------
      // 12. INIT
      // --------------------------------------------------------------
      const loaded = loadState();
      if (!loaded) {
        // Open a few demo apps
        ['CREATORBOARD', 'MUSICSHELL0', 'COSMICSHELL0'].forEach((file, idx) => {
          createWindow(file, file, 100 + idx*50, 60 + idx*40, 480, 380);
        });
      }
      applyFilterAndSort();

      console.log('✨ Ai Desktop v2 ready!');
    })();
  </script>
</body>
</html>
