<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚡ Ai Nexus · Cyberpunk Gallery</title>
  <style>
    /* ----- RESET & BASE ----- */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0b0b1a;
      color: #d0d0ff;
      font-family: 'Segoe UI', 'Courier New', monospace;
      padding: 2rem 1rem;
      min-height: 100vh;
      background-image: radial-gradient(circle at 20% 30%, #1a1a3a 0%, #0b0b1a 80%);
    }
    h1 {
      font-size: 2.8rem;
      font-weight: 300;
      letter-spacing: 4px;
      text-align: center;
      margin-bottom: 0.2rem;
      text-shadow: 0 0 20px #7a5cff, 0 0 60px #3a1f8a;
      color: #b8b0ff;
    }
    .sub {
      text-align: center;
      font-size: 0.95rem;
      color: #7a7aaa;
      margin-bottom: 2.5rem;
      letter-spacing: 2px;
    }
    .sub a { color: #9a8aff; text-decoration: none; border-bottom: 1px dashed #4a3a8a; }

    /* ----- GRID ----- */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1.2rem;
      max-width: 1400px;
      margin: 0 auto;
    }
    .card {
      background: rgba(20, 20, 50, 0.7);
      backdrop-filter: blur(4px);
      border: 1px solid #3a2a6a;
      border-radius: 16px;
      padding: 1.2rem 0.8rem;
      text-align: center;
      cursor: pointer;
      transition: 0.25s ease;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
      position: relative;
    }
    .card:hover {
      transform: translateY(-6px) scale(1.02);
      border-color: #9a7aff;
      box-shadow: 0 0 30px #4a3a9a88;
      background: rgba(30, 30, 70, 0.8);
    }
    .card h3 {
      font-size: 1.1rem;
      font-weight: 400;
      letter-spacing: 1px;
      color: #c8c0ff;
      margin-bottom: 0.3rem;
      word-break: break-word;
    }
    .card p {
      font-size: 0.8rem;
      color: #8a8aba;
      margin-top: 0.3rem;
      line-height: 1.3;
    }
    .card .badge {
      display: inline-block;
      margin-top: 0.5rem;
      font-size: 0.65rem;
      background: #2a1a5a;
      padding: 0.2rem 0.8rem;
      border-radius: 30px;
      color: #aa9aff;
      letter-spacing: 0.5px;
      border: 1px solid #4a3a7a;
    }

    /* ----- MODAL OVERLAY ----- */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(10px);
      z-index: 999;
      justify-content: center;
      align-items: center;
      padding: 1rem;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-box {
      background: #12122a;
      border: 1px solid #5a4a9a;
      border-radius: 20px;
      width: 95%;
      max-width: 1100px;
      height: 90vh;
      max-height: 800px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 80px #2a1a5a88;
      animation: fadeIn 0.25s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.8rem 1.5rem;
      border-bottom: 1px solid #3a2a6a;
      flex-shrink: 0;
    }
    .modal-header span {
      font-size: 1.1rem;
      color: #c8c0ff;
      letter-spacing: 1px;
    }
    .modal-close {
      background: none;
      border: none;
      color: #8a7aaa;
      font-size: 2rem;
      cursor: pointer;
      padding: 0 0.5rem;
      transition: 0.2s;
    }
    .modal-close:hover {
      color: #ff6a8a;
      transform: rotate(90deg);
    }
    .modal-body {
      flex: 1;
      overflow: hidden;
      position: relative;
    }
    .modal-body iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #0a0a1a;
    }

    /* ----- FOOTER CAT ----- */
    .footer {
      text-align: center;
      margin-top: 3rem;
      font-size: 0.8rem;
      color: #5a5a7a;
      letter-spacing: 1px;
    }
    .footer pre {
      font-family: monospace;
      color: #6a6a9a;
      line-height: 1.2;
    }

    /* responsive tweaks */
    @media (max-width: 600px) {
      h1 { font-size: 2rem; }
      .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
      .modal-box { height: 95vh; max-height: none; }
    }
  </style>
</head>
<body>

  <h1>✦ Ai · NEXUS ✦</h1>
  <div class="sub">
    click any card to preview the app · no page reload
    <br><a href="https://github.com/worldpeacebtn/Ai" target="_blank">view on GitHub</a>
  </div>

  <div class="grid" id="appGrid"></div>

  <!-- MODAL -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-box">
      <div class="modal-header">
        <span id="modalTitle">App</span>
        <button class="modal-close" id="modalClose">✕</button>
      </div>
      <div class="modal-body">
        <iframe id="modalIframe" src="about:blank"></iframe>
      </div>
    </div>
  </div>

  <div class="footer">
    <pre>
      /\_/\
     ( o.o )
      > ^ <
    </pre>
    <span>✦ all apps are self‑contained HTML · cyberpunk playground ✦</span>
  </div>

  <script>
    // ------------------------------------------------------------
    // 1. DEFINE YOUR APPS HERE – add/remove as needed
    //    'file' is the name (without .html) – the link will be
    //    constructed as `./FILE.html`
    // ------------------------------------------------------------
    const apps = [
      { file: 'index0',        desc: 'Legacy root – early proto' },
      { file: 'index01',       desc: 'Another early iteration' },
      { file: 'index2',        desc: 'Older experimental interface' },
      { file: 'index42',       desc: 'The answer – quirky numeric entry' },
      { file: 'CREATORBOARD',  desc: 'Digital canvas – sketch & generate' },
      { file: 'SHELLCREATOR',  desc: 'Modular shell builder' },
      { file: 'ULTRACREANODE', desc: 'High‑frequency generative core' },
      { file: 'DEEPUCOCREA',   desc: 'Deep subconscious creation' },
      { file: 'UNIWAVEEDITOR', desc: 'Universal waveform editor' },
      { file: 'MUSICSHELL0',   desc: 'Audio playground – loop, sample' },
      { file: 'MUSICSHELLGEN', desc: 'Generative music machine' },
      { file: 'COSMICSHELL0',  desc: 'Cosmic visualiser – navigate the void' },
      { file: 'SANCTUARYC',    desc: 'Calm refuge – peaceful digital space' },
      { file: 'MIRAC',         desc: 'Miracle generator – unexpected wonders' },
      { file: 'MMRYROOMS',     desc: 'Memory archive – store & revisit' },
      { file: 'MS',            desc: 'Mind state – core consciousness' },
      { file: 'MS2',           desc: 'Mind state v2 – upgraded shell' },
      { file: 'MSNXTXPLORING', desc: 'Next‑gen mind explorer' },
      { file: 'WEBAPPANIMATOR',desc: 'Web animation studio' },
      { file: 'WEBEDI',        desc: 'Lightweight web editor' },
      { file: 'WEBEDITX',      desc: 'Advanced web editor' },
      { file: 'UID',           desc: 'Identity manager' },
      { file: 'CYBERGIRLPOWA', desc: 'Empowered cyber‑aesthetic' },
      { file: 'ADVCC',         desc: 'Advanced command console' },
      { file: 'CC',            desc: 'Core command – quick terminal' },
      { file: 'COCD',          desc: 'Command & control dashboard' },
      { file: 'OBERLAYHUD',    desc: 'Heads‑up display – data overlay' },
      { file: 'UCOEDI',        desc: 'Universal editor + HUD' },
      // sub‑folders – you can link them too, but they need the full path
      // { file: 'SHELL/index0', desc: 'Nested legacy shell' },
      // { file: 'SHELL/x42_anime_theatre/index', desc: 'Quantum anime theatre' },
    ];

    // ------------------------------------------------------------
    // 2. RENDER CARDS
    // ------------------------------------------------------------
    const grid = document.getElementById('appGrid');

    apps.forEach(app => {
      const card = document.createElement('div');
      card.className = 'card';
      // Build the URL – we assume all .html files are in the same directory as this index
      const url = `./${app.file}.html`;
      card.innerHTML = `
        <h3>${app.file}</h3>
        <p>${app.desc}</p>
        <span class="badge">▶ preview</span>
      `;
      card.addEventListener('click', () => openModal(app.file, url));
      grid.appendChild(card);
    });

    // ------------------------------------------------------------
    // 3. MODAL CONTROLS
    // ------------------------------------------------------------
    const overlay = document.getElementById('modalOverlay');
    const iframe = document.getElementById('modalIframe');
    const titleEl = document.getElementById('modalTitle');
    const closeBtn = document.getElementById('modalClose');

    function openModal(name, url) {
      titleEl.textContent = name;
      iframe.src = url;
      overlay.classList.add('active');
      document.body.style.overflow = 'hidden'; // prevent scroll
    }

    function closeModal() {
      overlay.classList.remove('active');
      iframe.src = 'about:blank'; // stop loading when closed
      document.body.style.overflow = '';
    }

    closeBtn.addEventListener('click', closeModal);
    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) closeModal();
    });
    // ESC key to close
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && overlay.classList.contains('active')) closeModal();
    });
  </script>

</body>
</html>
