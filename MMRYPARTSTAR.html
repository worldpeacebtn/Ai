<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>✨ Stardust 3D Studio Pro ✨</title>
    <style>
        :root {
            --bg: #06060d;
            --glass: rgba(18, 18, 32, 0.9);
            --glass2: rgba(30, 30, 50, 0.75);
            --border: rgba(255, 255, 255, 0.14);
            --border2: rgba(255, 255, 255, 0.06);
            --accent: #8b5cf6;
            --accent2: #06b6d4;
            --accent3: #ec4899;
            --gold: #fbbf24;
            --green: #34d399;
            --red: #f87171;
            --text: #f1f1f8;
            --text2: #a0a0c0;
            --radius: 14px;
            --radius-sm: 8px;
            --radius-xs: 5px;
            --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.6);
            --glow-purple: 0 0 18px rgba(139, 92, 246, 0.45);
            --glow-cyan: 0 0 18px rgba(6, 182, 212, 0.4);
            --glow-pink: 0 0 18px rgba(236, 72, 153, 0.4);
            --transition: 0.28s cubic-bezier(0.22, 1, 0.36, 1);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--bg);
            font-family: var(--font);
            color: var(--text);
            touch-action: none;
            position: fixed;
            inset: 0;
        }

        #scene-container {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        #scene-container canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
        }

        .ui-layer {
            position: absolute;
            z-index: 10;
            pointer-events: none;
        }
        .ui-layer>* {
            pointer-events: auto;
        }

        /* ─── Top Bar ─── */
        .top-bar {
            top: 0;
            left: 0;
            right: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 6px;
            gap: 3px;
            background: linear-gradient(180deg, rgba(6, 6, 13, 0.98) 50%, transparent);
            z-index: 20;
            flex-wrap: nowrap;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .top-bar::-webkit-scrollbar {
            display: none;
        }
        .btn-emoji {
            background: var(--glass2);
            border: 1px solid var(--border2);
            color: var(--text);
            padding: 7px 9px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 1.2rem;
            line-height: 1;
            transition: all var(--transition);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            white-space: nowrap;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
            min-height: 34px;
            min-width: 34px;
            touch-action: manipulation;
            position: relative;
            flex-shrink: 0;
        }
        .btn-emoji:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }
        .btn-emoji:active {
            transform: scale(0.9);
        }
        .btn-emoji.active {
            border-color: var(--accent);
            box-shadow: var(--glow-purple);
            background: rgba(139, 92, 246, 0.25);
        }
        .btn-emoji .badge {
            position: absolute;
            top: -3px;
            right: -3px;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--accent3);
            font-size: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 700;
            border: 1.5px solid var(--bg);
        }
        .btn-emoji .tooltip {
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(20, 20, 35, 0.95);
            color: #fff;
            font-size: 0.55rem;
            padding: 3px 7px;
            border-radius: 4px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
            letter-spacing: 0.3px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .btn-emoji:hover .tooltip {
            opacity: 1;
        }

        /* ─── Bottom Mode Bar ─── */
        .bottom-mode-bar {
            bottom: 0;
            left: 0;
            right: 0;
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 6px 4px max(6px, var(--safe-bottom));
            gap: 3px;
            background: linear-gradient(0deg, rgba(6, 6, 13, 0.98) 55%, transparent);
            z-index: 20;
            flex-wrap: nowrap;
        }
        .mode-btn-emoji {
            flex: 1;
            min-width: 44px;
            max-width: 70px;
            text-align: center;
            padding: 5px 2px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            background: transparent;
            border: 1.5px solid transparent;
            transition: all var(--transition);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1px;
            touch-action: manipulation;
        }
        .mode-btn-emoji .icon {
            font-size: 1.3rem;
            line-height: 1.1;
        }
        .mode-btn-emoji .label {
            font-size: 0.5rem;
            font-weight: 600;
            color: var(--text2);
            letter-spacing: 0.3px;
        }
        .mode-btn-emoji.active {
            border-color: var(--accent);
            background: rgba(139, 92, 246, 0.2);
            box-shadow: var(--glow-purple);
        }
        .mode-btn-emoji.active .label {
            color: var(--text);
        }

        /* ─── Floating Panels ─── */
        .panel {
            position: absolute;
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            box-shadow: var(--shadow);
            padding: 12px;
            z-index: 25;
            pointer-events: auto;
            max-height: 68vh;
            overflow-y: auto;
            transition: all var(--transition);
            max-width: 92vw;
        }
        .panel.hidden {
            opacity: 0;
            pointer-events: none;
            transform: translateY(30px) scale(0.9);
        }
        .panel-title {
            font-size: 0.75rem;
            font-weight: 700;
            margin-bottom: 10px;
            text-align: center;
            letter-spacing: 0.5px;
            color: var(--accent2);
        }
        .panel-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }
        .panel-section {
            margin-bottom: 8px;
        }
        .panel-section label {
            display: block;
            font-size: 0.6rem;
            color: var(--text2);
            margin-bottom: 3px;
            font-weight: 600;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }
        .panel-section .value-display {
            text-align: center;
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--accent2);
            margin-top: 2px;
            font-variant-numeric: tabular-nums;
        }

        /* ─── Touch-Friendly Slider ─── */
        .tfslider-wrap {
            position: relative;
            display: flex;
            align-items: center;
            gap: 4px;
            width: 100%;
        }
        .tfslider-track {
            flex: 1;
            height: 20px;
            position: relative;
            cursor: pointer;
            touch-action: none;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .tfslider-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--accent2));
            border-radius: 10px;
            transition: width 0.15s ease;
            pointer-events: none;
        }
        .tfslider-thumb {
            position: absolute;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #fff;
            border: 2.5px solid var(--accent);
            box-shadow: 0 0 10px rgba(139, 92, 246, 0.7);
            pointer-events: none;
            transition: left 0.1s ease;
        }
        .tfslider-btns {
            display: flex;
            flex-direction: column;
            gap: 2px;
            flex-shrink: 0;
        }
        .tfslider-btns button {
            width: 20px;
            height: 18px;
            border-radius: 4px;
            border: 1px solid var(--border2);
            background: var(--glass2);
            color: var(--text);
            font-size: 0.6rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            touch-action: manipulation;
        }
        .tfslider-btns button:active {
            background: var(--accent);
            color: #fff;
        }
        .tfslider-val {
            font-size: 0.6rem;
            font-weight: 700;
            color: var(--accent2);
            min-width: 30px;
            text-align: center;
            font-variant-numeric: tabular-nums;
            flex-shrink: 0;
        }

        /* ─── Keyframe Bar ─── */
        .keyframe-bar {
            position: absolute;
            bottom: 52px;
            left: 6px;
            right: 6px;
            z-index: 15;
            pointer-events: auto;
            display: flex;
            align-items: center;
            gap: 5px;
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 5px 8px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            flex-wrap: wrap;
        }
        .keyframe-bar .time-label {
            font-size: 0.55rem;
            color: var(--text2);
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            min-width: 30px;
            text-align: center;
        }

        /* ─── Audio Indicator ─── */
        .audio-indicator {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 8;
            pointer-events: none;
            display: flex;
            gap: 3px;
            align-items: flex-end;
            height: 40px;
            opacity: 0;
            transition: opacity 0.4s;
        }
        .audio-indicator.active {
            opacity: 1;
        }
        .audio-indicator .bar {
            width: 3px;
            border-radius: 2px;
            background: linear-gradient(180deg, var(--accent3), var(--accent2));
            transition: height 0.08s ease;
            min-height: 2px;
        }

        /* ─── Toast ─── */
        .toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.7);
            background: rgba(20, 20, 35, 0.95);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 14px 20px;
            z-index: 100;
            pointer-events: none;
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            text-align: center;
            font-weight: 600;
            font-size: 0.75rem;
            box-shadow: 0 0 30px rgba(139, 92, 246, 0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            max-width: 85vw;
        }
        .toast.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }
        .toast .icon {
            font-size: 1.8rem;
            display: block;
            margin-bottom: 5px;
        }

        /* ─── Photo/Media Upload ─── */
        .upload-overlay {
            position: fixed;
            inset: 0;
            z-index: 30;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        .upload-overlay.hidden {
            display: none;
        }
        .upload-card {
            background: var(--glass);
            border: 1.5px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            text-align: center;
            max-width: 320px;
            width: 90%;
            box-shadow: var(--shadow);
        }
        .upload-card .icon {
            font-size: 2.5rem;
            display: block;
            margin-bottom: 8px;
        }
        .upload-card input[type="file"] {
            display: none;
        }
        .upload-actions {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        /* ─── Misc ─── */
        .joint-highlight {
            position: absolute;
            pointer-events: none;
            border: 2px solid var(--accent3);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 20px rgba(236, 72, 153, 0.8);
            z-index: 5;
            display: none;
            animation: pulse-ring 1.5s ease-in-out infinite;
        }
        @keyframes pulse-ring {
            0%,
            100% {
                box-shadow: 0 0 15px rgba(236, 72, 153, 0.6);
                border-width: 2px;
            }
            50% {
                box-shadow: 0 0 30px rgba(236, 72, 153, 1);
                border-width: 3px;
            }
        }

        @keyframes spin-slow {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }
        .spin-slow {
            animation: spin-slow 4s linear infinite;
        }

        @media(max-width:480px) {
            .btn-emoji {
                padding: 6px 7px;
                font-size: 1rem;
                min-height: 30px;
                min-width: 30px;
            }
            .mode-btn-emoji .icon {
                font-size: 1.1rem;
            }
            .panel {
                padding: 8px;
                border-radius: 10px;
                max-height: 60vh;
                max-width: 94vw;
            }
            .panel-title {
                font-size: 0.65rem;
            }
            .keyframe-bar {
                bottom: 46px;
                padding: 4px 5px;
            }
            .tfslider-track {
                height: 16px;
            }
        }
    </style>
</head>
<body>

    <div id="scene-container"></div>
    <div id="joint-labels" style="position:absolute;inset:0;z-index:4;pointer-events:none;overflow:hidden;"></div>
    <div class="joint-highlight" id="jointHighlight"></div>

    <!-- Audio Indicator -->
    <div class="audio-indicator" id="audioIndicator">
        <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
        <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
        <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
        <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
    </div>

    <!-- Top Bar -->
    <div class="ui-layer top-bar" id="topBar">
        <button class="btn-emoji" id="btnUpload" title="Upload Media">📸<span class="tooltip">Media</span></button>
        <button class="btn-emoji" id="btnText" title="Add 3D Text">🔤<span class="tooltip">Text</span></button>
        <button class="btn-emoji" id="btnAudio" title="Audio Reactive">🎤<span class="tooltip">Audio</span></button>
        <button class="btn-emoji" id="btnSave" title="Save Scene">💾<span class="tooltip">Save</span></button>
        <button class="btn-emoji" id="btnLoad" title="Load Scene">📂<span class="tooltip">Load</span></button>
        <button class="btn-emoji" id="btnExport" title="Export HTML">🌐<span class="tooltip">Export</span></button>
        <button class="btn-emoji" id="btnSettings" title="Settings">⚙️<span class="tooltip">Settings</span></button>
    </div>

    <!-- Bottom Mode Bar -->
    <div class="ui-layer bottom-mode-bar" id="bottomBar">
        <button class="mode-btn-emoji active" data-mode="view"><span class="icon">🔄</span><span class="label">View</span></button>
        <button class="mode-btn-emoji" data-mode="pose"><span class="icon">🦴</span><span class="label">Pose</span></button>
        <button class="mode-btn-emoji" data-mode="animate"><span class="icon">🎬</span><span class="label">Anim</span></button>
        <button class="mode-btn-emoji" data-mode="particles"><span class="icon">✨</span><span class="label">Particles</span></button>
        <button class="mode-btn-emoji" data-mode="audio"><span class="icon">🔊</span><span class="label">React</span></button>
    </div>

    <!-- Keyframe Bar -->
    <div class="keyframe-bar" id="keyframeBar" style="display:none;">
        <span style="font-size:0.55rem;color:var(--text2);">⏱️</span>
        <input type="range" class="timeline-slider" id="timelineSlider" min="0" max="10" value="0" step="0.1"
        style="flex:1;min-width:60px;height:18px;-webkit-appearance:none;appearance:none;background:rgba(255,255,255,0.1);border-radius:9px;outline:none;">
        <span class="time-label" id="timeDisplay">0.0s</span>
        <button class="btn-emoji" id="btnAddKeyframe" style="font-size:0.8rem;padding:4px 6px;">🔑</button>
        <button class="btn-emoji" id="btnPlayPause" style="font-size:0.8rem;padding:4px 6px;">▶️</button>
        <button class="btn-emoji" id="btnClearKF" style="font-size:0.8rem;padding:4px 6px;">🗑️</button>
    </div>

    <!-- Settings Panel -->
    <div class="panel hidden" id="settingsPanel" style="top:45px;right:6px;left:auto;width:260px;">
        <div class="panel-title">⚙️ Settings</div>
        <div class="panel-section">
            <label>Particle Size</label>
            <div class="tfslider-wrap" data-min="0.2" data-max="8" data-step="0.1" data-value="2.5" data-suffix="">
                <div class="tfslider-track"><div class="tfslider-fill"></div><div class="tfslider-thumb"></div></div>
                <div class="tfslider-btns"><button class="tfs-minus">−</button><button class="tfs-plus">+</button></div>
                <span class="tfslider-val">2.5</span>
            </div>
        </div>
        <div class="panel-section">
            <label>Density</label>
            <div class="tfslider-wrap" data-min="1" data-max="25" data-step="1" data-value="6" data-suffix="">
                <div class="tfslider-track"><div class="tfslider-fill"></div><div class="tfslider-thumb"></div></div>
                <div class="tfslider-btns"><button class="tfs-minus">−</button><button class="tfs-plus">+</button></div>
                <span class="tfslider-val">6</span>
            </div>
        </div>
        <div class="panel-section">
            <label>Depth Spread</label>
            <div class="tfslider-wrap" data-min="0" data-max="40" data-step="0.5" data-value="8" data-suffix="">
                <div class="tfslider-track"><div class="tfslider-fill"></div><div class="tfslider-thumb"></div></div>
                <div class="tfslider-btns"><button class="tfs-minus">−</button><button class="tfs-plus">+</button></div>
                <span class="tfslider-val">8</span>
            </div>
        </div>
        <div class="panel-section">
            <label>Shimmer</label>
            <div class="tfslider-wrap" data-min="0" data-max="1" data-step="0.01" data-value="0.6" data-suffix="">
                <div class="tfslider-track"><div class="tfslider-fill"></div><div class="tfslider-thumb"></div></div>
                <div class="tfslider-btns"><button class="tfs-minus">−</button><button class="tfs-plus">+</button></div>
                <span class="tfslider-val">0.6</span>
            </div>
        </div>
        <div class="panel-section">
            <label>Flow Speed</label>
            <div class="tfslider-wrap" data-min="0" data-max="5" data-step="0.1" data-value="1.2" data-suffix="">
                <div class="tfslider-track"><div class="tfslider-fill"></div><div class="tfslider-thumb"></div></div>
                <div class="tfslider-btns"><button class="tfs-minus">−</button><button class="tfs-plus">+</button></div>
                <span class="tfslider-val">1.2</span>
            </div>
        </div>
        <div class="panel-section">
            <label>Turbulence</label>
            <div class="tfslider-wrap" data-min="0" data-max="5" data-step="0.1" data-value="0.5" data-suffix="">
                <div class="tfslider-track"><div class="tfslider-fill"></div><div class="tfslider-thumb"></div></div>
                <div class="tfslider-btns"><button class="tfs-minus">−</button><button class="tfs-plus">+</button></div>
                <span class="tfslider-val">0.5</span>
            </div>
        </div>
        <div class="panel-section">
            <label>Audio Sensitivity</label>
            <div class="tfslider-wrap" data-min="0.1" data-max="5" data-step="0.1" data-value="1.5" data-suffix="">
                <div class="tfslider-track"><div class="tfslider-fill"></div><div class="tfslider-thumb"></div></div>
                <div class="tfslider-btns"><button class="tfs-minus">−</button><button class="tfs-plus">+</button></div>
                <span class="tfslider-val">1.5</span>
            </div>
        </div>
        <div class="panel-section" style="display:flex;gap:5px;flex-wrap:wrap;justify-content:center;">
            <button class="btn-emoji" id="btnResetCam" style="font-size:0.8rem;">🎯 Reset</button>
            <button class="btn-emoji" id="btnClearParticles" style="font-size:0.8rem;color:var(--red);">🧹 Clear</button>
            <button class="btn-emoji" id="btnRainbow" style="font-size:0.8rem;">🌈 Rainbow</button>
            <button class="btn-emoji" id="btnShapeToggle" style="font-size:0.8rem;">🔵 Shape</button>
        </div>
    </div>

    <!-- Text Panel -->
    <div class="panel hidden" id="textPanel" style="top:45px;left:6px;right:auto;width:240px;">
        <div class="panel-title">🔤 3D Text</div>
        <div class="panel-section">
            <label>Text</label>
            <input type="text" id="textInput" value="STARDUST" style="width:100%;padding:6px;border-radius:5px;border:1px solid var(--border);background:var(--glass2);color:var(--text);font-size:0.7rem;outline:none;letter-spacing:1px;">
        </div>
        <div class="panel-section">
            <label>Font Size</label>
            <div class="tfslider-wrap" data-min="10" data-max="80" data-step="1" data-value="36" data-suffix="px">
                <div class="tfslider-track"><div class="tfslider-fill"></div><div class="tfslider-thumb"></div></div>
                <div class="tfslider-btns"><button class="tfs-minus">−</button><button class="tfs-plus">+</button></div>
                <span class="tfslider-val">36</span>
            </div>
        </div>
        <div class="panel-section">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js">
    </script>
    <script>
        (function() {
            'use strict';

            // ═══════════════════════════════════════════
            // DOM References
            // ═══════════════════════════════════════════
            const container = document.getElementById('scene-container');
            const jointLabelsEl = document.getElementById('joint-labels');
            const jointHighlight = document.getElementById('jointHighlight');
            const audioIndicator = document.getElementById('audioIndicator');
            const audioBars = audioIndicator.querySelectorAll('.bar');
            const topBar = document.getElementById('topBar');
            const bottomBar = document.getElementById('bottomBar');
            const keyframeBar = document.getElementById('keyframeBar');
            const settingsPanel = document.getElementById('settingsPanel');
            const textPanel = document.getElementById('textPanel');
            const audioPanel = document.getElementById('audioPanel');
            const uploadOverlay = document.getElementById('uploadOverlay');
            const toast = document.getElementById('toast');
            const toastText = document.getElementById('toastText');
            const toastIcon = document.getElementById('toastIcon');
            const timelineSlider = document.getElementById('timelineSlider');
            const timeDisplay = document.getElementById('timeDisplay');
            const textInput = document.getElementById('textInput');
            const textBlendMode = document.getElementById('textBlendMode');
            const audioVisualMode = document.getElementById('audioVisualMode');
            const photoFileInput = document.getElementById('photoFileInput');
            const videoFileInput = document.getElementById('videoFileInput');
            const audioFileInputTop = document.getElementById('audioFileInputTop');
            const audioFileInput = document.getElementById('audioFileInput');

            // ═══════════════════════════════════════════
            // State
            // ═══════════════════════════════════════════
            let mode = 'view';
            let particleSize = 2.5;
            let particleDensity = 6;
            let depthSpread = 8;
            let shimmerIntensity = 0.6;
            let flowSpeed = 1.2;
            let turbulence = 0.5;
            let audioSensitivity = 1.5;
            let bassBoost = 1.0;
            let currentTime = 0;
            let isPlaying = false;
            let keyframes = [];
            let photoParticles = null;
            let textParticles = null;
            let rainbowMode = false;
            let shapeIndex = 0;
            let selectedJoint = null;
            let audioContext = null;
            let audioAnalyser = null;
            let audioDataArray = null;
            let audioSource = null;
            let audioActive = false;
            let audioFileURL = null;
            let animationId = null;
            let lastFrameTime = 0;
            let toastTimeout = null;
            let dragState = { mode: 'none', touches: [], startDist: 0, spherical: null, jointId: null, plane: null };
            let camTarget = new THREE.Vector3(0, 1, 0);
            let camSpherical = { r: 18, theta: 0, phi: 1.1 };
            let particleShape = 'circle';

            // ═══════════════════════════════════════════
            // Three.js Setup
            // ═══════════════════════════════════════════
            const scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x06060d, 0.012);
            const camera = new THREE.PerspectiveCamera(55, container.clientWidth / container.clientHeight, 0.1, 200);
            camera.position.set(0, 1.5, 18);
            camera.lookAt(camTarget);
            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setClearColor(0x06060d, 1);
            renderer.outputEncoding = THREE.sRGBEncoding;
            container.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0x222244, 1.5);
            scene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(5, 10, 5);
            scene.add(directionalLight);
            const pointLight1 = new THREE.PointLight(0x8b5cf6, 1.8, 35);
            pointLight1.position.set(-3, 3, 3);
            scene.add(pointLight1);
            const pointLight2 = new THREE.PointLight(0x06b6d4, 1.5, 30);
            pointLight2.position.set(3, -1, 2);
            scene.add(pointLight2);

            function createGlowTexture(shape = 'circle') {
                const c = document.createElement('canvas');
                c.width = 64;
                c.height = 64;
                const ctx = c.getContext('2d');
                const g = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
                g.addColorStop(0, 'rgba(255,255,255,1)');
                g.addColorStop(0.2, 'rgba(255,255,255,0.85)');
                g.addColorStop(0.5, 'rgba(255,255,255,0.4)');
                g.addColorStop(1, 'rgba(255,255,255,0)');
                ctx.fillStyle = g;
                if (shape === 'star') {
                    ctx.clearRect(0, 0, 64, 64);
                    ctx.translate(32, 32);
                    ctx.beginPath();
                    for (let i = 0; i < 5; i++) {
                        const angle = (i * 72 - 90) * Math.PI / 180;
                        const nextAngle = ((i + 1) * 72 - 90) * Math.PI / 180;
                        const outer = 30;
                        const inner = 12;
                        const ox = Math.cos(angle) * outer;
                        const oy = Math.sin(angle) * outer;
                        const ix = Math.cos(angle + 36 * Math.PI / 180) * inner;
                        const iy = Math.sin(angle + 36 * Math.PI / 180) * inner;
                        if (i === 0) ctx.moveTo(ox, oy);
                        else ctx.lineTo(ox, oy);
                        ctx.lineTo(ix, iy);
                    }
                    ctx.closePath();
                    ctx.fillStyle = g;
                    ctx.fill();
                } else if (shape === 'diamond') {
                    ctx.clearRect(0, 0, 64, 64);
                    ctx.translate(32, 32);
                    ctx.beginPath();
                    ctx.moveTo(0, -30);
                    ctx.lineTo(25, 0);
                    ctx.lineTo(0, 30);
                    ctx.lineTo(-25, 0);
                    ctx.closePath();
                    ctx.fillStyle = g;
                    ctx.fill();
                } else if (shape === 'heart') {
                    ctx.clearRect(0, 0, 64, 64);
                    ctx.translate(32, 28);
                    ctx.beginPath();
                    ctx.moveTo(0, 15);
                    ctx.bezierCurveTo(-20, -5, -15, -25, 0, -12);
                    ctx.bezierCurveTo(15, -25, 20, -5, 0, 15);
                    ctx.closePath();
                    ctx.fillStyle = g;
                    ctx.fill();
                } else {
                    ctx.fillRect(0, 0, 64, 64);
                }
                const tex = new THREE.CanvasTexture(c);
                tex.needsUpdate = true;
                return tex;
            }
            let glowTexture = createGlowTexture('circle');

            function regenerateGlowTexture() {
                const shapes = ['circle', 'star', 'diamond', 'heart'];
                particleShape = shapes[shapeIndex % shapes.length];
                glowTexture = createGlowTexture(particleShape);
                if (photoParticles && photoParticles.material) photoParticles.material.uniforms.uTexture.value =
                glowTexture;
                if (bgStars && bgStars.material) bgStars.material.uniforms.uTexture.value = glowTexture;
                if (textParticles && textParticles.material) textParticles.material.uniforms.uTexture.value =
                    glowTexture;
            }

            const particleVS = `
            attribute float aSize; attribute vec3 aColor; attribute float aTwinkle;
            varying vec3 vColor; varying float vTwinkle;
            uniform float uTime; uniform float uShimmer; uniform float uFlow;
            void main(){
              vColor=aColor; vTwinkle=aTwinkle;
              vec3 pos=position;
              float wave=sin(pos.x*0.8+uTime*uFlow)*0.3+cos(pos.y*0.7+uTime*uFlow*1.2)*0.25;
              pos.y+=wave*0.15;
              pos.x+=sin(pos.z*0.6+uTime*uFlow*0.8)*0.12;
              vec4 mv=modelViewMatrix*vec4(pos,1.0);
              gl_PointSize=aSize*(180.0/length(mv.xyz));
              gl_Position=projectionMatrix*mv;
            }`;
            const particleFS = `
            varying vec3 vColor; varying float vTwinkle;
            uniform float uTime; uniform float uShimmer; uniform sampler2D uTexture;
            void main(){
              vec4 tc=texture2D(uTexture,gl_PointCoord);
              float d=length(gl_PointCoord-vec2(0.5));
              if(d>0.5)discard;
              float tw=0.6+0.4*sin(uTime*2.5+vTwinkle*47.0);
              float sh=0.5+0.5*sin(uTime*2.0+vTwinkle*31.0+d*17.0);
              vec3 col=vColor*(1.0+(sh-0.5)*uShimmer*2.0);
              gl_FragColor=vec4(col,tc.a*tw);
            }`;

            function makeParticleMat() {
                return new THREE.ShaderMaterial({
                    vertexShader: particleVS,
                    fragmentShader: particleFS,
                    transparent: true,
                    blending: THREE.AdditiveBlending,
                    depthWrite: false,
                    depthTest: true,
                    uniforms: { uTime: { value: 0 }, uShimmer: { value: shimmerIntensity }, uFlow: { value: flowSpeed },
                        uTexture: { value: glowTexture } }
                });
            }

            function createBgStars() {
                const g = new THREE.BufferGeometry();
                const n = 300;
                const p = new Float32Array(n * 3);
                const c = new Float32Array(n * 3);
                const s = new Float32Array(n);
                const t = new Float32Array(n);
                for (let i = 0; i < n; i++) {
                    p[i * 3] = (Math.random() - 0.5) * 45;
                    p[i * 3 + 1] = (Math.random() - 0.5) * 35;
                    p[i * 3 + 2] = (Math.random() - 0.5) * 35 - 5;
                    const col = new THREE.Color().setHSL(Math.random() * 0.25 + 0.5, 0.3, 0.4 + Math.random() * 0.5);
                    c[i * 3] = col.r;
                    c[i * 3 + 1] = col.g;
                    c[i * 3 + 2] = col.b;
                    s[i] = Math.random() * 2.2 + 0.4;
                    t[i] = Math.random() * Math.PI * 2;
                }
                g.setAttribute('position', new THREE.BufferAttribute(p, 3));
                g.setAttribute('aColor', new THREE.BufferAttribute(c, 3));
                g.setAttribute('aSize', new THREE.BufferAttribute(s, 1));
                g.setAttribute('aTwinkle', new THREE.BufferAttribute(t, 1));
                const mat = makeParticleMat();
                const stars = new THREE.Points(g, mat);
                stars.name = 'bgStars';
                scene.add(stars);
                return stars;
            }
            const bgStars = createBgStars();

            // ═══════════════════════════════════════════
            // Skeleton System
            // ═══════════════════════════════════════════
            const skelDef = {
                root: { name: 'Root', parent: null, pos: [0, 0.5, 0], color: 0xfbbf24 },
                spine: { name: 'Spine', parent: 'root', pos: [0, 0.5, 0], color: 0xf59e0b },
                chest: { name: 'Chest', parent: 'spine', pos: [0, 0.5, 0], color: 0xf97316 },
                neck: { name: 'Neck', parent: 'chest', pos: [0, 0.35, 0], color: 0xef4444 },
                head: { name: 'Head', parent: 'neck', pos: [0, 0.3, 0], color: 0xec4899 },
                lShoulder: { name: 'LShoulder', parent: 'chest', pos: [-0.45, 0.1, 0], color: 0x8b5cf6 },
                lElbow: { name: 'LElbow', parent: 'lShoulder', pos: [-0.35, -0.15, 0], color: 0x7c3aed },
                lWrist: { name: 'LWrist', parent: 'lElbow', pos: [-0.3, -0.15, 0], color: 0x6d28d9 },
                rShoulder: { name: 'RShoulder', parent: 'chest', pos: [0.45, 0.1, 0], color: 0x06b6d4 },
                rElbow: { name: 'RElbow', parent: 'rShoulder', pos: [0.35, -0.15, 0], color: 0x0891b2 },
                rWrist: { name: 'RWrist', parent: 'rElbow', pos: [0.3, -0.15, 0], color: 0x0e7490 },
                lHip: { name: 'LHip', parent: 'root', pos: [-0.25, -0.1, 0], color: 0x34d399 },
                lKnee: { name: 'LKnee', parent: 'lHip', pos: [0, -0.45, 0], color: 0x10b981 },
                lAnkle: { name: 'LAnkle', parent: 'lKnee', pos: [0, -0.4, 0], color: 0x059669 },
                rHip: { name: 'RHip', parent: 'root', pos: [0.25, -0.1, 0], color: 0xfbbf24 },
                rKnee: { name: 'RKnee', parent: 'rHip', pos: [0, -0.45, 0], color: 0xf59e0b },
                rAnkle: { name: 'RAnkle', parent: 'rKnee', pos: [0, -0.4, 0], color: 0xd97706 },
            };
            let joints = {};
            let jointMeshes = {};
            let boneLines = {};
            let jointGroup = new THREE.Group();
            scene.add(jointGroup);
            let labelDivs = {};

            function buildSkeleton() {
                while (jointGroup.children.length > 0) {
                    const c = jointGroup.children[0];
                    if (c.geometry) c.geometry.dispose();
                    if (c.material) c.material.dispose();
                    jointGroup.remove(c);
                }
                joints = {};
                jointMeshes = {};
                boneLines = {};
                labelDivs = {};
                jointLabelsEl.innerHTML = '';
                for (const [id, d] of Object.entries(skelDef)) {
                    const g = new THREE.SphereGeometry(0.08, 12, 12);
                    const m = new THREE.MeshStandardMaterial({ color: d.color, emissive: d.color,
                        emissiveIntensity: 0.8, roughness: 0.2, metalness: 0.6 });
                    const mesh = new THREE.Mesh(g, m);
                    mesh.userData.jointId = id;
                    mesh.position.set(d.pos[0], d.pos[1], d.pos[2]);
                    mesh.name = 'j_' + id;
                    jointGroup.add(mesh);
                    joints[id] = { ...d, localPos: new THREE.Vector3(d.pos[0], d.pos[1], d.pos[2]) };
                    jointMeshes[id] = mesh;
                    const div = document.createElement('div');
                    div.className = 'joint-label';
                    div.textContent = d.name;
                    div.style.cssText =
                        'position:absolute;color:#fff;font-size:0.5rem;font-weight:700;text-shadow:0 0 8px rgba(139,92,246,0.9);pointer-events:none;transform:translate(-50%,-50%);letter-spacing:0.3px;display:none;';
                    jointLabelsEl.appendChild(div);
                    labelDivs[id] = div;
                }
                for (const [id, d] of Object.entries(skelDef)) {
                    if (!d.parent) continue;
                    const lg = new THREE.BufferGeometry();
                    const lm = new THREE.LineBasicMaterial({ color: d.color, transparent: true, opacity: 0.55,
                        blending: THREE.AdditiveBlending, depthWrite: false });
                    const lp = new Float32Array(6);
                    lg.setAttribute('position', new THREE.BufferAttribute(lp, 3));
                    const line = new THREE.Line(lg, lm);
                    line.userData.boneId = id;
                    line.userData.parentId = d.parent;
                    jointGroup.add(line);
                    boneLines[id] = line;
                }
                computeWorldPositions();
                updateBoneLines();
                updateJointLabels();
            }

            function computeWorldPositions() {
                for (const id of Object.keys(skelDef)) {
                    const d = skelDef[id];
                    if (!d.parent) joints[id].worldPos = joints[id].localPos.clone();
                    else joints[id].worldPos = joints[d.parent].worldPos.clone().add(joints[id].localPos);
                    jointMeshes[id].position.copy(joints[id].worldPos);
                }
            }

            function updateBoneLines() {
                for (const id of Object.keys(boneLines)) {
                    const line = boneLines[id];
                    const pp = joints[line.userData.parentId].worldPos;
                    const cp = joints[id].worldPos;
                    const arr = line.geometry.attributes.position.array;
                    arr[0] = pp.x;
                    arr[1] = pp.y;
                    arr[2] = pp.z;
                    arr[3] = cp.x;
                    arr[4] = cp.y;
                    arr[5] = cp.z;
                    line.geometry.attributes.position.needsUpdate = true;
                }
            }

            function updateJointLabels() {
                for (const id of Object.keys(joints)) {
                    const wp = joints[id].worldPos;
                    const sp = wp.clone().project(camera);
                    const div = labelDivs[id];
                    if (sp.z > 1 || sp.z < -1) div.style.display = 'none';
                    else {
                        div.style.display = 'block';
                        div.style.left = ((sp.x * 0.5 + 0.5) * container.clientWidth) + 'px';
                        div.style.top = ((-sp.y * 0.5 + 0.5) * container.clientHeight) + 'px';
                    }
                }
            }

            function getJointAtScreen(x, y) {
                const rc = new THREE.Raycaster();
                const m = new THREE.Vector2((x / container.clientWidth) * 2 - 1, -(y / container.clientHeight) * 2 + 1);
                rc.setFromCamera(m, camera);
                const ints = rc.intersectObjects(Object.values(jointMeshes), false);
                if (ints.length > 0) return ints[0].object.userData.jointId;
                return null;
            }

            function getDragPlane(wp) {
                const cd = camera.getWorldDirection(new THREE.Vector3());
                const n = cd.clone().negate();
                return new THREE.Plane().setFromNormalAndCoplanarPoint(n, wp);
            }

            function getPointOnPlane(cx, cy, plane) {
                const rc = new THREE.Raycaster();
                const m = new THREE.Vector2((cx / container.clientWidth) * 2 - 1, -(cy / container.clientHeight) * 2 + 1);
                rc.setFromCamera(m, camera);
                const p = new THREE.Vector3();
                rc.ray.intersectPlane(plane, p);
                return p;
            }

            function moveJointToWorld(id, wp) {
                const d = skelDef[id];
                if (!d.parent) joints[id].localPos.copy(wp);
                else joints[id].localPos.copy(wp.clone().sub(joints[d.parent].worldPos));
                computeWorldPositions();
                updateBoneLines();
                updateJointLabels();
            }

            function resetPose() {
                for (const id of Object.keys(skelDef)) {
                    const d = skelDef[id];
                    joints[id].localPos.set(d.pos[0], d.pos[1], d.pos[2]);
                }
                computeWorldPositions();
                updateBoneLines();
                updateJointLabels();
            }

            // ═══════════════════════════════════════════
            // Photo/Video → Particles
            // ═══════════════════════════════════════════
            function processImage(img) {
                const canvas = document.createElement('canvas');
                const maxDim = 160;
                const s = Math.min(1, maxDim / Math.max(img.width, img.height));
                canvas.width = Math.floor(img.width * s);
                canvas.height = Math.floor(img.height * s);
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                const idata = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const data = idata.data;
                const step = Math.max(1, Math.floor(particleDensity));
                const pos = [],
                    cols = [],
                    szs = [],
                    twk = [];
                const dw = 7,
                    dh = dw * canvas.height / canvas.width;
                const cx = 0,
                    cy = 1.3,
                    cz = -0.3;
                for (let y = 0; y < canvas.height; y += step) {
                    for (let x = 0; x < canvas.width; x += step) {
                        const idx = (y * canvas.width + x) * 4;
                        const a = data[idx + 3];
                        if (a < 30) continue;
                        const r = data[idx],
                            g = data[idx + 1],
                            b = data[idx + 2];
                        const br = (r + g + b) / 3;
                        if (br < 8) continue;
                        const px = ((x / canvas.width) - 0.5) * dw + cx;
                        const py = -((y / canvas.height) - 0.5) * dh + cy;
                        const pz = cz + (Math.random() - 0.5) * depthSpread * 0.35 + (br / 255) * depthSpread * 0.2;
                        pos.push(px, py, pz);
                        cols.push(r / 255, g / 255, b / 255);
                        szs.push(particleSize * (0.6 + br / 255 * 0.9) * (0.7 + Math.random() * 0.6));
                        twk.push(Math.random() * Math.PI * 2);
                    }
                }
                if (pos.length < 10) { showToast('⚠️', 'Image too dark'); return; }
                if (photoParticles) {
                    scene.remove(photoParticles);
                    photoParticles.geometry.dispose();
                    photoParticles.material.dispose();
                }
                const g = new THREE.BufferGeometry();
                g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
                g.setAttribute('aColor', new THREE.Float32BufferAttribute(cols, 3));
                g.setAttribute('aSize', new THREE.Float32BufferAttribute(szs, 1));
                g.setAttribute('aTwinkle', new THREE.Float32BufferAttribute(twk, 1));
                const mat = makeParticleMat();
                photoParticles = new THREE.Points(g, mat);
                photoParticles.name = 'photoParticles';
                scene.add(photoParticles);
                showToast('✨', pos.length / 3 + ' particles');
            }

            function processVideoFrame(video) {
                const canvas = document.createElement('canvas');
                canvas.width = video.videoWidth || 320;
                canvas.height = video.videoHeight || 180;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const img = new Image();
                img.onload = () => processImage(img);
                img.src = canvas.toDataURL();
            }

            // ═══════════════════════════════════════════
            // 3D Text
            // ═══════════════════════════════════════════
            function createTextParticles() {
                const text = textInput.value || 'STARDUST';
                const fontSize = parseInt(document.querySelector(
                    '#textPanel .tfslider-wrap').dataset.value) || 36;
                const canvas = document.createElement('canvas');
                canvas.width = 400;
                canvas.height = 120;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#fff';
                ctx.font = 'bold ' + fontSize + 'px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(text, canvas.width / 2, canvas.height / 2);
                const idata = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const data = idata.data;
                const step = Math.max(1, Math.floor(particleDensity * 0.8));
                const pos = [],
                    cols = [],
                    szs = [],
                    twk = [];
                const dw = 10,
                    dh = dw * canvas.height / canvas.width;
                const cx = 0,
                    cy = 1.5,
                    cz = -0.2;
                const blendMode = textBlendMode.value;
                for (let y = 0; y < canvas.height; y += step) {
                    for (let x = 0; x < canvas.width; x += step) {
                        const idx = (y * canvas.width + x) * 4;
                        const br = (data[idx] + data[idx + 1] + data[idx + 2]) / 3;
                        if (br < 50) continue;
                        let px, py, pz;
                        const tx = ((x / canvas.width) - 0.5) * dw + cx;
                        const ty = -((y / canvas.height) - 0.5) * dh + cy;
                        const tz = cz + (Math.random() - 0.5) * 0.5;
                        if (blendMode === 'assemble' || blendMode === 'wave') {
                            px = (Math.random() - 0.5) * 25;
                            py = (Math.random() - 0.5) * 20;
                            pz = (Math.random() - 0.5) * 25;
                        } else if (blendMode === 'dissolve') {
                            px = tx + (Math.random() - 0.5) * 5;
                            py = ty + (Math.random() - 0.5) * 5;
                            pz = tz + (Math.random() - 0.5) * 8;
                        } else {
                            const a = Math.random() * Math.PI * 2;
                            const r = Math.random() * 8;
                            px = tx + Math.cos(a) * r;
                            py = ty + Math.sin(a) * r;
                            pz = tz + (Math.random() - 0.5) * 3;
                        }
                        pos.push(px, py, pz);
                        const hue = (x / canvas.width) * 0.8 + (y / canvas.height) * 0.3;
                        const col = new THREE.Color().setHSL(hue, 0.8, 0.6);
                        cols.push(col.r, col.g, col.b);
                        szs.push(particleSize * (0.8 + Math.random() * 0.6));
                        twk.push(Math.random() * Math.PI * 2);
                    }
                }
                if (pos.length < 10) { showToast('⚠️', 'Text too small'); return; }
                if (textParticles) {
                    scene.remove(textParticles);
                    textParticles.geometry.dispose();
                    textParticles.material.dispose();
                }
                const g = new THREE.BufferGeometry();
                g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
                g.setAttribute('aColor', new THREE.Float32BufferAttribute(cols, 3));
                g.setAttribute('aSize', new THREE.Float32BufferAttribute(szs, 1));
                g.setAttribute('aTwinkle', new THREE.Float32BufferAttribute(twk, 1));
                const mat = makeParticleMat();
                textParticles = new THREE.Points(g, mat);
                textParticles.name = 'textParticles';
                scene.add(textParticles);
                showToast('🔤', text + ' → particles');
            }

            // ═══════════════════════════════════════════
            // Audio Reactive
            // ═══════════════════════════════════════════
            function initAudio() {
                if (!audioContext) {
                    audioContext = new(window.AudioContext || window.webkitAudioContext)();
                    audioAnalyser = audioContext.createAnalyser();
                    audioAnalyser.fftSize = 128;
                    audioAnalyser.smoothingTimeConstant = 0.7;
                    audioDataArray = new Uint8Array(audioAnalyser.frequencyBinCount);
                }
            }

            function startMic() {
                initAudio();
                navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
                    if (audioSource) audioSource.disconnect();
                    audioSource = audioContext.createMediaStreamSource(stream);
                    audioSource.connect(audioAnalyser);
                    audioActive = true;
                    audioIndicator.classList.add('active');
                    showToast('🎤', 'Mic active');
                }).catch(e => showToast('⚠️', 'Mic denied'));
            }

            function loadAudioFile(file) {
                initAudio();
                const url = URL.createObjectURL(file);
                const audio = new Audio(url);
                const src = audioContext.createMediaElementSource(audio);
                src.connect(audioAnalyser);
                audioAnalyser.connect(audioContext.destination);
                audio.loop = true;
                audio.play();
                audioSource = src;
                audioActive = true;
                audioIndicator.classList.add('active');
                showToast('🎵', 'Audio loaded');
            }

            function getAudioLevel() {
                if (!audioActive || !audioAnalyser) return 0;
                audioAnalyser.getByteFrequencyData(audioDataArray);
                let sum = 0;
                for (let i = 0; i < audioDataArray.length; i++) sum += audioDataArray[i];
                return (sum / audioDataArray.length) / 255;
            }

            function getAudioBands() {
                if (!audioActive || !audioAnalyser) return [];
                audioAnalyser.getByteFrequencyData(audioDataArray);
                const bands = [];
                const n = 12;
                const per = Math.floor(audioDataArray.length / n);
                for (let i = 0; i < n; i++) {
                    let s = 0;
                    for (let j = i * per; j < (i + 1) * per; j++) s += audioDataArray[j];
                    bands.push(s / per / 255);
                }
                return bands;
            }

            // ═══════════════════════════════════════════
            // Animation System
            // ═══════════════════════════════════════════
            function capturePose() {
                const pose = {};
                for (const id of Object.keys(joints)) pose[id] = joints[id].localPos.toArray();
                return pose;
            }

            function applyPose(pose) {
                for (const id of Object.keys(pose)) {
                    if (joints[id]) joints[id].localPos.fromArray(pose[id]);
                }
                computeWorldPositions();
                updateBoneLines();
                updateJointLabels();
            }

            function addKeyframe(time) {
                const pose = capturePose();
                const existing = keyframes.find(k => Math.abs(k.time - time) < 0.05);
                if (existing) existing.poses = pose;
                else keyframes.push({ time, poses: pose });
                keyframes.sort((a, b) => a.time - b.time);
                const maxT = Math.max(...keyframes.map(k => k.time));
                timelineSlider.max = Math.max(maxT, 10);
                showToast('🔑', 'Key @' + time.toFixed(1) + 's');
            }

            function getPoseAtTime(t) {
                if (keyframes.length === 0) return null;
                if (t <= keyframes[0].time) return keyframes[0].poses;
                if (t >= keyframes[keyframes.length - 1].time) return keyframes[keyframes.length - 1].poses;
                for (let i = 0; i < keyframes.length - 1; i++) {
                    const k1 = keyframes[i],
                        k2 = keyframes[i + 1];
                    if (t >= k1.time && t <= k2.time) {
                        const tt = (t - k1.time) / (k2.time - k1.time);
                        const st = tt * tt * (3 - 2 * tt);
                        const result = {};
                        for (const id of Object.keys(k1.poses)) {
                            const p1 = k1.poses[id],
                                p2 = k2.poses[id];
                            result[id] = [p1[0] + (p2[0] - p1[0]) * st, p1[1] + (p2[1] - p1[1]) * st, p1[2] + (p2[
                                2] - p1[2]) * st];
                        }
                        return result;
                    }
                }
                return keyframes[keyframes.length - 1].poses;
            }

            // ═══════════════════════════════════════════
            // Save / Load / Export
            // ═══════════════════════════════════════════
            function saveScene() {
                const data = {
                    v: 2,
                    keyframes,
                    currentTime,
                    particleSize,
                    particleDensity,
                    depthSpread,
                    shimmerIntensity,
                    flowSpeed,
                    turbulence,
                    audioSensitivity,
                    rainbowMode,
                    shapeIndex,
                    camSpherical,
                    camTarget: camTarget.toArray(),
                    hasPhoto: !!photoParticles,
                    photoData: photoParticles ? {
                        p: Array.from(photoParticles.geometry.attributes.position.array),
                        c: Array.from(photoParticles.geometry.attributes.aColor.array),
                        s: Array.from(photoParticles.geometry.attributes.aSize.array),
                        t: Array.from(photoParticles.geometry.attributes.aTwinkle.array),
                    } : null,
                    hasText: !!textParticles,
                    textData: textParticles ? {
                        p: Array.from(textParticles.geometry.attributes.position.array),
                        c: Array.from(textParticles.geometry.attributes.aColor.array),
                        s: Array.from(textParticles.geometry.attributes.aSize.array),
                        t: Array.from(textParticles.geometry.attributes.aTwinkle.array),
                    } : null,
                };
                try { localStorage.setItem('stardust3d_pro', JSON.stringify(data));
                    showToast('💾', 'Saved!'); } catch (e) { showToast('⚠️', 'Save failed'); }
            }

            function loadScene() {
                try {
                    const s = localStorage.getItem('stardust3d_pro');
                    if (!s) { showToast('⚠️', 'No save found'); return; }
                    const d = JSON.parse(s);
                    keyframes = d.keyframes || [];
                    currentTime = d.currentTime || 0;
                    particleSize = d.particleSize || 2.5;
                    particleDensity = d.particleDensity || 6;
                    depthSpread = d.depthSpread || 8;
                    shimmerIntensity = d.shimmerIntensity || 0.6;
                    flowSpeed = d.flowSpeed || 1.2;
                    turbulence = d.turbulence || 0.5;
                    audioSensitivity = d.audioSensitivity || 1.5;
                    rainbowMode = d.rainbowMode || false;
                    shapeIndex = d.shapeIndex || 0;
                    camSpherical = d.camSpherical || { r: 18, theta: 0, phi: 1.1 };
                    camTarget.fromArray(d.camTarget || [0, 1, 0]);
                    updateCameraFromSpherical();
                    if (d.photoData) {
                        if (photoParticles) { scene.remove(photoParticles);
                            photoParticles.geometry.dispose();
                            photoParticles.material.dispose(); }
                        const g = new THREE.BufferGeometry();
                        g.setAttribute('position', new THREE.Float32BufferAttribute(d.photoData.p, 3));
                        g.setAttribute('aColor', new THREE.Float32BufferAttribute(d.photoData.c, 3));
                        g.setAttribute('aSize', new THREE.Float32BufferAttribute(d.photoData.s, 1));
                        g.setAttribute('aTwinkle', new THREE.Float32BufferAttribute(d.photoData.t, 1));
                        photoParticles = new THREE.Points(g, makeParticleMat());
                        scene.add(photoParticles);
                    }
                    if (d.textData) {
                        if (textParticles) { scene.remove(textParticles);
                            textParticles.geometry.dispose();
                            textParticles.material.dispose(); }
                        const g = new THREE.BufferGeometry();
                        g.setAttribute('position', new THREE.Float32BufferAttribute(d.textData.p, 3));
                        g.setAttribute('aColor', new THREE.Float32BufferAttribute(d.textData.c, 3));
                        g.setAttribute('aSize', new THREE.Float32BufferAttribute(d.textData.s, 1));
                        g.setAttribute('aTwinkle', new THREE.Float32BufferAttribute(d.textData.t, 1));
                        textParticles = new THREE.Points(g, makeParticleMat());
                        scene.add(textParticles);
                    }
                    const pose = getPoseAtTime(currentTime);
                    if (pose) applyPose(pose);
                    else resetPose();
                    updateAllSliders();
                    timelineSlider.max = keyframes.length > 0 ? Math.max(...keyframes.map(k => k.time), 10) : 10;
                    timelineSlider.value = currentTime;
                    timeDisplay.textContent = currentTime.toFixed(1) + 's';
                    regenerateGlowTexture();
                    showToast('📂', 'Loaded!');
                } catch (e) { showToast('⚠️', 'Load error'); }
            }

            function initTFSlider(wrap) {
                const track = wrap.querySelector('.tfslider-track');
                const fill = wrap.querySelector('.tfslider-fill');
                const thumb = wrap.querySelector('.tfslider-thumb');
                const valDisplay = wrap.querySelector('.tfslider-val');
                const min = parseFloat(wrap.dataset.min);
                const max = parseFloat(wrap.dataset.max);
                const step = parseFloat(wrap.dataset.step) || 0.01;
                let val = parseFloat(wrap.dataset.value) || min;
                const suffix = wrap.dataset.suffix || '';

                function setVal(v) {
                    v = Math.max(min, Math.min(max, v));
                    v = Math.round(v / step) * step;
                    v = Math.round(v * 100) / 100;
                    val = v;
                    wrap.dataset.value = val;
                    const pct = ((val - min) / (max - min)) * 100;
                    fill.style.width = pct + '%';
                    thumb.style.left = pct + '%';
                    valDisplay.textContent = val + suffix;
                }

                let touchStartY = 0;
                let touchStartVal = val;
                let touching = false;

                function getValFromX(clientX) {
                    const rect = track.getBoundingClientRect();
                    const pct = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
                    return min + pct * (max - min);
                }

                track.addEventListener('touchstart', e => {
                    e.preventDefault();
                    touching = true;
                    touchStartY = e.touches[0].clientY;
                    touchStartVal = val;
                    const nv = getValFromX(e.touches[0].clientX);
                    setVal(nv);
                }, { passive: false });
                track.addEventListener('touchmove', e => {
                    if (!touching) return;
                    e.preventDefault();
                    const dy = e.touches[0].clientY - touchStartY;
                    const range = max - min;
                    const sensitivity = range / 150;
                    const nv = touchStartVal - dy * sensitivity;
                    setVal(nv);
                }, { passive: false });
                track.addEventListener('touchend', () => { touching = false; });
                track.addEventListener('mousedown', e => {
                    touching = true;
                    touchStartY = e.clientY;
                    touchStartVal = val;
                    setVal(getValFromX(e.clientX));
                });
                document.addEventListener('mousemove', e => {
                    if (!touching || wrap.closest('.panel')?.classList.contains('hidden')) return;
                    const dy = e.clientY - touchStartY;
                    const range = max - min;
                    const sensitivity = range / 150;
                    setVal(touchStartVal - dy * sensitivity);
                });
                document.addEventListener('mouseup', () => { touching = false; });
                track.addEventListener('wheel', e => {
                    e.preventDefault();
                    const range = max - min;
                    const dir = e.deltaY > 0 ? -1 : 1;
                    setVal(val + dir * step * 3);
                }, { passive: false });

                wrap.querySelector('.tfs-minus').addEventListener('click', () => setVal(val - step));
                wrap.querySelector('.tfs-plus').addEventListener('click', () => setVal(val + step));

                wrap.dataset.setValue = setVal;
                wrap.dataset.getValue = () => val;
                setVal(val);
                return wrap;
            }

            function getAllSliders() {
                return document.querySelectorAll('.tfslider-wrap');
            }

            function initAllSliders() {
                getAllSliders().forEach(w => initTFSlider(w));
            }

            function updateAllSliders() {
                document.querySelectorAll('.tfslider-wrap').forEach(w => {
                    const setter = w.dataset.setValue;
                    if (setter) {
                        const valMap = {
                            0: particleSize,
                            1: particleDensity,
                            2: depthSpread,
                            3: shimmerIntensity,
                            4: flowSpeed,
                            5: turbulence,
                            6: audioSensitivity,
                            7: bassBoost,
                        };
                        // Identify by order
                        const all = Array.from(getAllSliders());
                        const idx = all.indexOf(w);
                        const vals = [particleSize, particleDensity, depthSpread, shimmerIntensity, flowSpeed,
                            turbulence, audioSensitivity, bassBoost
                        ];
                        if (idx >= 0 && idx < vals.length) setter(vals[idx]);
                    }
                });
                // Text panel slider
                const tpSlider = textPanel.querySelector('.tfslider-wrap');
                if (tpSlider && tpSlider.dataset.setValue) tpSlider.dataset.setValue(parseInt(tpSlider.dataset.value) ||
                    36);
            }

            // ═══════════════════════════════════════════
            // UI Events
            // ═══════════════════════════════════════════
            document.querySelectorAll('.mode-btn-emoji').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.mode-btn-emoji').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    mode = btn.dataset.mode;
                    keyframeBar.style.display = (mode === 'animate') ? 'flex' : 'none';
                    showToast(mode === 'view' ? '🔄' : mode === 'pose' ? '🦴' : mode === 'animate' ? '🎬' :
                        mode === 'particles' ? '✨' : '🔊', mode + ' mode');
                });
            });

            document.getElementById('btnUpload').addEventListener('click', () => uploadOverlay.classList.toggle(
            'hidden'));
            document.getElementById('btnCloseUpload').addEventListener('click', () => uploadOverlay.classList.add(
                'hidden'));
            document.getElementById('btnText').addEventListener('click', () => textPanel.classList.toggle('hidden'));
            document.getElementById('btnAudio').addEventListener('click', () => audioPanel.classList.toggle(
            'hidden'));
            document.getElementById('btnSave').addEventListener('click', saveScene);
            document.getElementById('btnLoad').addEventListener('click', loadScene);
            document.getElementById('btnExport').addEventListener('click', exportHTML);
            document.getElementById('btnSettings').addEventListener('click', () => { settingsPanel.classList.toggle(
                    'hidden');
                updateAllSliders(); });

            photoFileInput.addEventListener('change', e => {

            videoFileInput.addEventListener('change', e => {

            audioFileInput.addEventListener('change', e => {

            document.getElementById('btnMic').addEventListener('click', startMic);
            document.getElementById('btnAudioFile').addEventListener('click', () => audioFileInput.click());

            document.getElementById('btnCreateText').addEventListener('click', createTextParticles);

            document.getElementById('btnResetCam').addEventListener('click', () => {
                if (mode === 'pose' || mode === 'animate') resetPose();
                else { camTarget.set(0, 1, 0);
                    camSpherical = { r: 18, theta: 0, phi: 1.1 };

            document.getElementById('btnClearParticles').addEventListener('click', () => {
                if (photoParticles) { scene.remove(photoParticles);

                if (textParticles) { scene.remove(textParticles);

            document.getElementById('btnRainbow').addEventListener('click', () => {
                rainbowMode = !rainbowMode;
                document.getElementById('btnRainbow').classList.toggle('active', rainbowMode);
                showToast('🌈', rainbowMode ? 'Rainbow ON' : 'Rainbow OFF');
            });
            document.getElementById('btnShapeToggle').addEventListener('click', () => {
                shapeIndex = (shapeIndex + 1) % 4;
                regenerateGlowTexture();
                showToast('🔵', 'Shape: ' + particleShape);
            });

            timelineSlider.addEventListener('input', () => {
                currentTime = parseFloat(timelineSlider.value);
                timeDisplay.textContent = currentTime.toFixed(1) + 's';
                const pose = getPoseAtTime(currentTime);
