  <script>
    (function() {
      // ===== CONFIG =====
      let GITHUB_USER = 'worldpeacebtn';
      let GITHUB_REPO = 'Ai';
      const PRE_DEFINED_USERS = ['worldpeacebtn', 'DIVISIONX42'];

      const socialApps = [
        { file: 'https://www.facebook.com', desc: 'Facebook', emoji: '📘', color: '#1877f2' },
        { file: 'https://www.instagram.com', desc: 'Instagram', emoji: '📸', color: '#e1306c' },
        { file: 'https://www.tiktok.com', desc: 'TikTok', emoji: '🎵', color: '#010101' },
        { file: 'https://www.reddit.com', desc: 'Reddit', emoji: '🤖', color: '#ff4500' },
        { file: 'https://github.com/worldpeacebtn/Ai', desc: 'GitHub Repo', emoji: '🐙', color: '#24292e' },
        { file: 'browser', desc: 'Browser', emoji: '🌐', color: '#3a2a6a' }
      ];

      const tagColors = {
        '🐋': '#1e90ff',
        '✨': '#ffd700',
        '⚛️': '#9b59b6',
        '🎨': '#e91e63',
        '🎵': '#4caf50',
        '🌠': '#00bcd4',
        '🧠': '#ff5722',
        '📄': '#795548'
      };
      function getTagColor(tag) {
        return tagColors[tag] || '#7a5aff';
      }

      let appList = [];
      let isAppListLoaded = false;

      // ===== STATE =====
      let windows = [];
      let nextId = 1;
      let desktopIcons = [];
      let folders = [];
      let nextFolderId = 1;
      let favorites = [];
      let dockedApps = [];
      const STORAGE_KEY = 'ai_desktop_state_v24';
      let listView = false;
      let _isRendering = false;

      // DOM refs
      const desktop = document.getElementById('desktop');
      const taskbar = document.getElementById('taskbar');
      const dockBar = document.getElementById('dockBar');
      const socialPopup = document.getElementById('socialPopup');
      const repoPopup = document.getElementById('repoPopup');
      const socialBtn = document.getElementById('socialBtn');
      const repoBtn = document.getElementById('repoBtn');
      const readmeBtn = document.getElementById('readmeBtn');
      const openAppGridBtn = document.getElementById('openAppGridBtn');
      const newFolderBtn = document.getElementById('newFolderBtn');
      const uploadBtn = document.getElementById('uploadBtn');
      const fileUploadInput = document.getElementById('fileUploadInput');
      const openAllBtn = document.getElementById('openAllBtn');
      const closeAllBtn = document.getElementById('closeAllBtn');
      const themeToggleBtn = document.getElementById('themeToggleBtn');
      const arrangeBtn = document.getElementById('arrangeBtn');
      const viewToggleBtn = document.getElementById('viewToggleBtn');
      const favoritesToggleBtn = document.getElementById('favoritesToggleBtn');
      const favoritesPanel = document.getElementById('favoritesPanel');
      const favPanelClose = document.getElementById('favPanelClose');
      const favSearch = document.getElementById('favSearch');
      const favList = document.getElementById('favList');
      const catWidget = document.getElementById('cat-widget');
      const catSpeech = document.getElementById('catSpeech');
      const dockPreview = document.getElementById('dockPreview');
      const dockPreviewLabel = document.getElementById('dockPreviewLabel');
      const dockIframe = document.getElementById('dockIframe');
      const filterInput = document.getElementById('filterInput');
      const clearFilterBtn = document.getElementById('clearFilterBtn');
      const sortSelect = document.getElementById('sortSelect');
      const exportBtn = document.getElementById('exportBtn');
      const importBtn = document.getElementById('importBtn');
      const importFileInput = document.getElementById('importFileInput');
      const resetBtn = document.getElementById('resetBtn');

      // ===== FETCH REPO CONTENTS =====
      async function fetchRepoContents(user, repo, path = '') {
        const url = `https://api.github.com/repos/${user}/${repo}/contents${path ? '/' + path : ''}`;
        try {
          const response = await fetch(url);
          if (!response.ok) throw new Error('Failed to fetch contents');
          return await response.json();
        } catch (e) {
          console.error('Error fetching repo contents:', e);
          return [];
        }
      }

      // ===== FETCH APP LIST WITH DATE INFO =====
      async function fetchAppList(user, repo) {
        const username = user || GITHUB_USER;
        const reponame = repo || GITHUB_REPO;
        try {
          const rootData = await fetchRepoContents(username, reponame);
          const htmlFiles = [];
          for (const item of rootData) {
            if (item.type === 'file' && item.name.endsWith('.html')) {
              const fileInfo = {
                file: item.name.replace('.html', ''),
                desc: item.name.replace('.html', ''),
                url: item.url,
                sha: item.sha,
                size: item.size,
                created_at: null,
                updated_at: null,
                last_modified: null,
              };
              try {
                const detailRes = await fetch(item.url);
                if (detailRes.ok) {
                  const detail = await detailRes.json();
                  fileInfo.created_at = detail.created_at || detail.commit?.committer?.date || null;
                  fileInfo.updated_at = detail.commit?.committer?.date || null;
                  fileInfo.last_modified = detail.commit?.committer?.date || null;
                  fileInfo.size = detail.size || item.size;
                }
              } catch(e) {}
              htmlFiles.push(fileInfo);
            }
          }

          // SHELL folder
          const shellData = await fetchRepoContents(username, reponame, 'SHELL');
          if (shellData && !shellData.message) {
            for (const item of shellData) {
              if (item.type === 'file' && item.name.endsWith('.html')) {
                const fileInfo = {
                  file: 'SHELL/' + item.name.replace('.html', ''),
                  desc: 'SHELL/' + item.name.replace('.html', ''),
                  url: item.url,
                  sha: item.sha,
                  size: item.size,
                  created_at: null,
                  updated_at: null,
                  last_modified: null,
                };
                try {
                  const detailRes = await fetch(item.url);
                  if (detailRes.ok) {
                    const detail = await detailRes.json();
                    fileInfo.created_at = detail.created_at || detail.commit?.committer?.date || null;
                    fileInfo.updated_at = detail.commit?.committer?.date || null;
                    fileInfo.last_modified = detail.commit?.committer?.date || null;
                    fileInfo.size = detail.size || item.size;
                  }
                } catch(e) {}
                htmlFiles.push(fileInfo);
              }
            }
          }

          // SHELL/x42_anime_theatre
          const animeData = await fetchRepoContents(username, reponame, 'SHELL/x42_anime_theatre');
          if (animeData && !animeData.message) {
            for (const item of animeData) {
              if (item.type === 'file' && item.name.endsWith('.html')) {
                const fileInfo = {
                  file: 'SHELL/x42_anime_theatre/' + item.name.replace('.html', ''),
                  desc: 'SHELL/x42_anime_theatre/' + item.name.replace('.html', ''),
                  url: item.url,
                  sha: item.sha,
                  size: item.size,
                  created_at: null,
                  updated_at: null,
                  last_modified: null,
                };
                try {
                  const detailRes = await fetch(item.url);
                  if (detailRes.ok) {
                    const detail = await detailRes.json();
                    fileInfo.created_at = detail.created_at || detail.commit?.committer?.date || null;
                    fileInfo.updated_at = detail.commit?.committer?.date || null;
                    fileInfo.last_modified = detail.commit?.committer?.date || null;
                    fileInfo.size = detail.size || item.size;
                  }
                } catch(e) {}
                htmlFiles.push(fileInfo);
              }
            }
          }

          htmlFiles.sort((a, b) => a.file.localeCompare(b.file));
          appList = htmlFiles;
          isAppListLoaded = true;
          return htmlFiles;
        } catch (error) {
          console.error('Failed to fetch app list:', error);
          appList = [
            { file: 'index', desc: 'Main gateway' },
            { file: 'CREATORBOARD', desc: 'Digital canvas' },
            { file: 'MUSICSHELL0', desc: 'Audio playground' },
          ];
          isAppListLoaded = true;
          return appList;
        }
      }

      // ===== HELPERS =====
      function getAppUrl(file) {
        if (file.startsWith('http') || file === 'browser') return file;
        let path = file;
        if (!file.startsWith('SHELL/')) {
          path = file + '.html';
        } else {
          path = file + '.html';
        }
        return `https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/main/${path}`;
      }

      function getIconEmoji(file) {
        const social = socialApps.find(s => s.file === file);
        if (social) return social.emoji;
        const base = file.split('/').pop();
        const map = {
          'CREATORBOARD': '🎨', 'SHELLCREATOR': '🐚', 'ULTRACREANODE': '⚡',
          'DEEPUCOCREA': '🌊', 'UNIWAVEEDITOR': '🌌', 'MUSICSHELL0': '🎵',
          'MUSICSHELLGEN': '🎶', 'COSMICSHELL0': '🌠', 'SANCTUARYC': '🕊️',
          'MIRAC': '✨', 'MMRYROOMS': '🧩', 'MS': '🧠', 'MS2': '🧠',
          'MSNXTXPLORING': '🔍', 'WEBAPPANIMATOR': '🎬', 'WEBEDI': '✏️',
          'WEBEDITX': '✏️', 'UID': '🆔', 'CYBERGIRLPOWA': '👾',
          'ADVCC': '🎮', 'CC': '🎮', 'COCD': '🎮',
          'OBERLAYHUD': '📟', 'UCOEDI': '📊',
        };
        return map[base] || '📄';
      }

      function formatDate(dateStr) {
        if (!dateStr) return '';
        const d = new Date(dateStr);
        return d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
      }

      // ===== FAVORITES =====
      function toggleFavorite(iconId) {
        const idx = favorites.indexOf(iconId);
        if (idx > -1) {
          favorites.splice(idx, 1);
        } else {
          favorites.push(iconId);
        }
        saveState();
        renderDesktopIcons();
        renderFavorites();
        updateWindowStarButtons();
        updateDock();
      }
      function isFavorite(iconId) { return favorites.indexOf(iconId) > -1; }

      function updateWindowStarButtons() {
        document.querySelectorAll('.window .star-btn').forEach(btn => {
          const file = btn.dataset.file;
          const icon = desktopIcons.find(i => i.file === file);
          if (icon) {
            btn.classList.toggle('active', favorites.includes(icon.id));
          }
        });
      }

      // ===== TAGS =====
      function getTagsForIcon(iconId) {
        const icon = desktopIcons.find(i => i.id === iconId);
        if (!icon) return [];
        return icon.tags || [];
      }
      function addTagToIcon(iconId, tag) {
        const icon = desktopIcons.find(i => i.id === iconId);
        if (!icon) return;
        if (!icon.tags) icon.tags = [];
        if (!icon.tags.includes(tag)) {
          icon.tags.push(tag);
          saveState();
          renderDesktopIcons();
        }
      }
      function removeTagFromIcon(iconId, tag) {
        const icon = desktopIcons.find(i => i.id === iconId);
        if (!icon) return;
        if (icon.tags) {
          icon.tags = icon.tags.filter(t => t !== tag);
          saveState();
          renderDesktopIcons();
        }
      }

      // ===== DOCK =====
      function updateDock() {
        dockBar.innerHTML = '';
        dockedApps.forEach(id => {
          const icon = desktopIcons.find(i => i.id === id);
          if (!icon) return;
          const item = document.createElement('div');
          item.className = 'dock-item';
          const emoji = icon.type === 'app' ? getIconEmoji(icon.file) : '📄';
          item.innerHTML = `<span>${emoji}</span><span class="dock-remove" data-id="${id}">✕</span>`;
          item.addEventListener('click', (e) => {
            if (e.target.classList.contains('dock-remove')) return;
            if (icon.type === 'app') launchApp(icon.file);
            else alert('File: ' + icon.label);
          });
          item.querySelector('.dock-remove').addEventListener('click', (e) => {
            e.stopPropagation();
            const idx = dockedApps.indexOf(id);
            if (idx > -1) {
              dockedApps.splice(idx, 1);
              saveState();
              updateDock();
            }
          });
          dockBar.appendChild(item);
        });
      }

      function addToDock(iconId) {
        if (!dockedApps.includes(iconId)) {
          dockedApps.push(iconId);
          saveState();
          updateDock();
        }
      }

      // ===== TIMELINE =====
      function getTimeGroup(date) {
        const now = new Date();
        const d = new Date(date);
        const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        const yesterday = new Date(today);
        yesterday.setDate(yesterday.getDate() - 1);
        const weekAgo = new Date(today);
        weekAgo.setDate(weekAgo.getDate() - 7);
        if (d >= today) return 'Today';
        if (d >= yesterday) return 'Yesterday';
        if (d >= weekAgo) return 'This Week';
        return 'Older';
      }

      // ===== SORTING =====
      function sortIconsAndWindows() {
        const sortVal = sortSelect.value;
        windows.sort((a, b) => {
          if (sortVal === 'name') return a.title.localeCompare(b.title);
          if (sortVal === 'tag') return a.tags.localeCompare(b.tags);
          if (sortVal === 'date') return a.date - b.date;
          return 0;
        });
        const topLevel = desktopIcons.filter(i => !i.folderId);
        const inFolders = desktopIcons.filter(i => i.folderId);
        if (sortVal === 'date') {
          const groups = {};
          topLevel.forEach(icon => {
            const g = getTimeGroup(icon.date || Date.now());
            if (!groups[g]) groups[g] = [];
            groups[g].push(icon);
          });
          const order = ['Today', 'Yesterday', 'This Week', 'Older'];
          const sorted = [];
          order.forEach(g => {
            if (groups[g]) {
              groups[g].sort((a, b) => (a.date || 0) - (b.date || 0));
              sorted.push(...groups[g]);
            }
          });
          desktopIcons = [...sorted, ...inFolders];
        } else {
          topLevel.sort((a, b) => {
            if (sortVal === 'name') return a.label.localeCompare(b.label);
            if (sortVal === 'tag') {
              const aWin = windows.find(w => w.file === a.file);
              const bWin = windows.find(w => w.file === b.file);
              const aTag = aWin ? aWin.tags : '';
              const bTag = bWin ? bWin.tags : '';
              return aTag.localeCompare(bTag);
            }
            return 0;
          });
          desktopIcons = [...topLevel, ...inFolders];
        }
        saveState();
        renderDesktopIcons();
      }

      // ===== ARRANGE =====
      function arrangeIcons() {
        if (listView) return;
        const icons = desktopIcons.filter(icon => !icon.folderId);
        const deskRect = desktop.getBoundingClientRect();
        const iconWidth = 64 + 12;
        const iconHeight = 82 + 12;
        const cols = Math.floor((deskRect.width - 20) / iconWidth);
        const startX = 10, startY = 10;
        icons.forEach((icon, index) => {
          const col = index % cols;
          const row = Math.floor(index / cols);
          icon.x = startX + col * iconWidth;
          icon.y = startY + row * iconHeight;
        });
        saveState();
        renderDesktopIcons();
        applyFilterAndSort();
      }

      function adjustDesktopHeight() {
        if (listView) {
          desktop.style.height = 'auto';
          desktop.style.minHeight = '100%';
          return;
        }
        let maxY = 0;
        document.querySelectorAll('.desktop-icon').forEach(el => {
          const y = parseFloat(el.style.top);
          if (y > maxY) maxY = y;
        });
        const height = maxY + 90;
        desktop.style.height = Math.max(height, window.innerHeight - 80) + 'px';
        desktop.style.minHeight = '100%';
      }

      // ===== VIEW TOGGLE =====
      function toggleView() {
        listView = !listView;
        desktop.classList.toggle('list-view', listView);
        if (listView) {
          desktop.style.display = 'flex';
          desktop.style.flexDirection = 'column';
          desktop.style.alignItems = 'stretch';
          desktop.style.padding = '4px';
          desktop.style.height = 'auto';
          desktop.style.minHeight = '100%';
        } else {
          desktop.style.display = '';
          desktop.style.flexDirection = '';
          desktop.style.alignItems = '';
          desktop.style.padding = '10px';
          arrangeIcons();
        }
        renderDesktopIcons();
        applyFilterAndSort();
        saveState();
      }

      // ===== RENDER DESKTOP ICONS =====
      function renderDesktopIcons() {
        if (_isRendering) return;
        _isRendering = true;
        try {
          document.querySelectorAll('.desktop-icon, .desktop-separator').forEach(el => el.remove());
          const sortVal = sortSelect.value;
          let iconsToRender = [...desktopIcons];
          if (sortVal === 'date') {
            const groups = {};
            const topLevel = desktopIcons.filter(i => !i.folderId);
            topLevel.forEach(icon => {
              const g = getTimeGroup(icon.date || Date.now());
              if (!groups[g]) groups[g] = [];
              groups[g].push(icon);
            });
            const order = ['Today', 'Yesterday', 'This Week', 'Older'];
            const temp = [];
            order.forEach(g => {
              if (groups[g]) {
                temp.push({ type: 'separator', label: g });
                groups[g].forEach(icon => temp.push(icon));
              }
            });
            const foldersOnly = desktopIcons.filter(i => i.folderId);
            temp.push(...foldersOnly);
            iconsToRender = temp;
          }

          iconsToRender.forEach(icon => {
            if (icon.type === 'separator') {
              const sep = document.createElement('div');
              sep.className = 'desktop-separator';
              if (listView) sep.style.position = 'relative';
              else sep.style.cssText = 'position:relative; width:100%; text-align:center; color:#8a8aba; font-size:0.7rem; padding:4px 0; margin:4px 0; border-bottom:1px solid #3a2a6a;';
              sep.textContent = '— ' + icon.label + ' —';
              desktop.appendChild(sep);
              return;
            }
            if (icon.folderId) return;
            const div = document.createElement('div');
            const isFavFolder = icon.type === 'folder' && icon.isFavFolder;
            div.className = 'desktop-icon' + (icon.type === 'folder' ? ' folder' : '') + (icon.type === 'file' ? ' file' : '') + (isFavFolder ? ' fav-folder' : '');
            div.dataset.iconId = icon.id;
            if (!listView) {
              div.style.left = icon.x + 'px';
              div.style.top = icon.y + 'px';
            } else {
              div.style.position = 'relative';
              div.style.width = '100%';
            }
            const isFav = isFavorite(icon.id);
            let starHtml = isFav ? '<span class="star-badge">⭐</span>' : '';
            const tags = icon.tags || [];
            let tagHtml = '';
            if (tags.length > 0) {
              const firstTag = tags[0];
              const color = getTagColor(firstTag);
              tagHtml = `<span class="tag-badge" style="background:${color};">${firstTag}</span>`;
            }
            let dateHtml = '';
            if (icon.created_at || icon.updated_at) {
              const dateStr = icon.created_at || icon.updated_at;
              if (dateStr) {
                dateHtml = `<div class="icon-date">${formatDate(dateStr)}</div>`;
              }
            }
            if (icon.type === 'folder') {
              const colorStyle = icon.color ? `background-color: ${icon.color}; border-color: ${icon.color};` : '';
              const folderEmoji = isFavFolder ? '⭐' : '📁';
              div.innerHTML = `<div class="icon-img" style="${colorStyle}">${folderEmoji}${starHtml}${tagHtml}</div><div class="icon-label">${icon.label}</div>${dateHtml}<div class="folder-badge">${icon.children ? icon.children.length : 0}</div>`;
            } else if (icon.type === 'file') {
              div.innerHTML = `<div class="icon-img">📄${starHtml}${tagHtml}</div><div class="icon-label">${icon.label}</div>${dateHtml}`;
            } else {
              const emoji = getIconEmoji(icon.file);
              div.innerHTML = `<div class="icon-img">${emoji}${starHtml}${tagHtml}</div><div class="icon-label">${icon.label}</div>${dateHtml}`;
            }
            desktop.appendChild(div);
            makeDraggable(div, icon);

            // Double click
            div.addEventListener('click', (e) => {
              if (e.detail === 2) {
                if (icon.type === 'app') launchApp(icon.file);
                else if (icon.type === 'folder') openFolderWindow(icon.id);
                else if (icon.type === 'file') alert('File: ' + icon.label);
              }
            });
            let lastTap = 0;
            div.addEventListener('touchstart', (e) => {
              const now = Date.now();
              if (now - lastTap < 400) {
                e.preventDefault();
                if (icon.type === 'app') launchApp(icon.file);
                else if (icon.type === 'folder') openFolderWindow(icon.id);
                else if (icon.type === 'file') alert('File: ' + icon.label);
              }
              lastTap = now;
            }, { passive: false });

            // Context menu
            div.addEventListener('contextmenu', (e) => {
              e.preventDefault();
              if (icon.type === 'folder') {
                const action = prompt('Type "delete" to delete, or enter new name to rename:', '');
                if (action === null) return;
                if (action === 'delete') deleteFolder(icon.id);
                else if (action.trim()) {
                  const folder = folders.find(f => f.id === icon.id);
                  if (folder) {
                    folder.name = action.trim();
                    icon.label = action.trim();
                    saveState();
                    renderDesktopIcons();
                  }
                }
                return;
              }
              const actions = [
                isFavorite(icon.id) ? 'Remove from favorites' : 'Add to favorites',
                'Add tag...',
                'Remove tag...',
                'Move to folder...',
                dockedApps.includes(icon.id) ? 'Remove from dock' : 'Add to dock'
              ];
              const choice = prompt(
                'Choose action:\n1. ' + actions[0] +
                '\n2. Add tag...\n3. Remove tag...\n4. Move to folder...\n5. ' + actions[4],
                '1'
              );
              if (choice === '1') {
                toggleFavorite(icon.id);
              } else if (choice === '2') {
                const tag = prompt('Enter tag (emoji or text, e.g. 🐋, ✨, ⚛️):', '');
                if (tag && tag.trim()) {
                  addTagToIcon(icon.id, tag.trim());
                }
              } else if (choice === '3') {
                const currentTags = getTagsForIcon(icon.id);
                if (currentTags.length === 0) {
                  alert('No tags to remove.');
                  return;
                }
                const tag = prompt('Enter tag to remove (current: ' + currentTags.join(', ') + '):', '');
                if (tag && tag.trim()) {
                  removeTagFromIcon(icon.id, tag.trim());
                }
              } else if (choice === '4') {
                const fname = prompt('Enter folder name:', '');
                if (fname !== null) {
                  const folder = folders.find(f => f.name === fname);
                  if (folder) moveIconToFolder(icon.id, folder.id);
                  else alert('Folder not found.');
                }
              } else if (choice === '5') {
                if (dockedApps.includes(icon.id)) {
                  const idx = dockedApps.indexOf(icon.id);
                  if (idx > -1) {
                    dockedApps.splice(idx, 1);
                    saveState();
                    updateDock();
                  }
                } else {
                  addToDock(icon.id);
                }
              }
            });

            // Hover: store last hovered icon for cat
            div.addEventListener('mouseenter', () => {
              lastHoveredIconId = icon.id;
            });
            div.addEventListener('touchstart', () => {
              lastHoveredIconId = icon.id;
            }, { passive: true });
          });
          adjustDesktopHeight();
        } finally {
          _isRendering = false;
        }
      }

      let lastHoveredIconId = null;

      // ===== DRAGGABLE =====
      function makeDraggable(element, iconData) {
        let startX, startY, origX, origY;
        let isDragging = false;

        function onStart(e) {
          const touch = e.touches ? e.touches[0] : e;
          startX = touch.clientX;
          startY = touch.clientY;
          origX = iconData.x;
          origY = iconData.y;
          isDragging = false;
          e.preventDefault();
          element.style.zIndex = 50;
        }

        function onMove(e) {
          if (!startX) return;
          const touch = e.touches ? e.touches[0] : e;
          const dx = touch.clientX - startX;
          const dy = touch.clientY - startY;
          if (Math.abs(dx) > 5 || Math.abs(dy) > 5) isDragging = true;
          if (isDragging) {
            let newX = origX + dx;
            let newY = origY + dy;
            if (!listView) {
              element.style.left = newX + 'px';
              element.style.top = newY + 'px';
            }
            iconData._tempX = newX;
            iconData._tempY = newY;

            // iOS‑style swap
            if (!listView && !iconData.folderId) {
              const allIcons = desktopIcons.filter(i => !i.folderId && i.id !== iconData.id && i.type === 'app');
              const rect = element.getBoundingClientRect();
              const centerX = rect.left + rect.width/2;
              const centerY = rect.top + rect.height/2;
              for (let other of allIcons) {
                const otherEl = document.querySelector(`.desktop-icon[data-icon-id="${other.id}"]`);
                if (!otherEl) continue;
                const oRect = otherEl.getBoundingClientRect();
                if (centerX > oRect.left && centerX < oRect.right && centerY > oRect.top && centerY < oRect.bottom) {
                  const idxA = desktopIcons.indexOf(iconData);
                  const idxB = desktopIcons.indexOf(other);
                  if (idxA !== -1 && idxB !== -1) {
                    const tmpX = iconData.x, tmpY = iconData.y;
                    iconData.x = other.x;
                    iconData.y = other.y;
                    other.x = tmpX;
                    other.y = tmpY;
                    element.style.left = iconData.x + 'px';
                    element.style.top = iconData.y + 'px';
                    otherEl.style.left = other.x + 'px';
                    otherEl.style.top = other.y + 'px';
                    saveState();
                    adjustDesktopHeight();
                    startX = touch.clientX;
                    startY = touch.clientY;
                    origX = iconData.x;
                    origY = iconData.y;
                    break;
                  }
                }
              }
            }

            // Preview near bottom
            const deskRect = desktop.getBoundingClientRect();
            const previewY = deskRect.height - 80;
            if (touch.clientY > previewY && iconData.type === 'app') {
              const url = getAppUrl(iconData.file);
              if (url && url !== 'browser') {
                dockPreview.style.display = 'block';
                dockPreview.style.left = Math.min(touch.clientX - 100, window.innerWidth - 220) + 'px';
                dockIframe.src = url;
                dockPreviewLabel.textContent = 'Preview: ' + iconData.label;
              }
            } else {
              dockPreview.style.display = 'none';
              dockIframe.src = 'about:blank';
            }
          }
        }

        function onEnd(e) {
          dockPreview.style.display = 'none';
          dockIframe.src = 'about:blank';
          element.style.zIndex = 5;
          if (isDragging) {
            const clientX = e.changedTouches ? e.changedTouches[0].clientX : e.clientX;
            const clientY = e.changedTouches ? e.changedTouches[0].clientY : e.clientY;
            const deskRect = desktop.getBoundingClientRect();
            if (clientY > deskRect.height - 60 && iconData.type === 'app') {
              addToDock(iconData.id);
            }

            const dropTarget = document.elementFromPoint(clientX, clientY);
            let moved = false;

            if (dropTarget) {
              let folderIcon = dropTarget.closest('.desktop-icon.folder');
              if (folderIcon && folderIcon !== element) {
                const folderId = folderIcon.dataset.iconId;
                if (folderId) {
                  moveIconToFolder(iconData.id, folderId);
                  moved = true;
                  renderDesktopIcons();
                  refreshFolderWindows();
                  applyFilterAndSort();
                }
              }
              if (!moved && iconData.type === 'app') {
                const appIcon = dropTarget.closest('.desktop-icon:not(.folder)');
                if (appIcon && appIcon !== element) {
                  const targetId = appIcon.dataset.iconId;
                  const targetIcon = desktopIcons.find(i => i.id === targetId);
                  if (targetIcon && targetIcon.type === 'app') {
                    const folderName = prompt('Enter folder name:', 'New Folder');
                    if (folderName !== null) {
                      const name = folderName.trim() || 'New Folder';
                      const folder = createFolder(name, '#7a5aff');
                      moveIconToFolder(iconData.id, folder.id);
                      moveIconToFolder(targetIcon.id, folder.id);
                      moved = true;
                      renderDesktopIcons();
                      refreshFolderWindows();
                      applyFilterAndSort();
                      arrangeIcons();
                    } else {
                      moved = true;
                    }
                  }
                }
              }
              if (!moved) {
                const fwItem = dropTarget.closest('.fw-item');
                if (fwItem) {
                  const folderWindow = fwItem.closest('.folder-window');
                  if (folderWindow) {
                    const folderId = folderWindow.dataset.folderId;
                    if (folderId) {
                      moveIconToFolder(iconData.id, folderId);
                      moved = true;
                      renderDesktopIcons();
                      refreshFolderWindows();
                      applyFilterAndSort();
                    }
                  }
                }
              }
            }

            if (!moved) {
              const deskRect2 = desktop.getBoundingClientRect();
              let newX = (iconData._tempX !== undefined) ? iconData._tempX : origX;
              let newY = (iconData._tempY !== undefined) ? iconData._tempY : origY;
              newX = Math.max(0, Math.min(newX, deskRect2.width - 64));
              newY = Math.max(0, Math.min(newY, deskRect2.height - 82));
              iconData.x = newX;
              iconData.y = newY;
              if (iconData.folderId) {
                const oldFolder = folders.find(f => f.id === iconData.folderId);
                if (oldFolder) {
                  oldFolder.appIds = oldFolder.appIds.filter(id => id !== iconData.id);
                  const folderIcon = desktopIcons.find(i => i.id === oldFolder.id);
                  if (folderIcon) folderIcon.children = oldFolder.appIds;
                }
                delete iconData.folderId;
                renderDesktopIcons();
                refreshFolderWindows();
                applyFilterAndSort();
              } else {
                element.style.left = iconData.x + 'px';
                element.style.top = iconData.y + 'px';
                saveState();
                adjustDesktopHeight();
                applyFilterAndSort();
              }
            }
            delete iconData._tempX;
            delete iconData._tempY;
          }
          startX = null; startY = null; isDragging = false;
        }

        element.addEventListener('mousedown', onStart);
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onEnd);
        element.addEventListener('touchstart', onStart, { passive: false });
        document.addEventListener('touchmove', onMove, { passive: false });
        document.addEventListener('touchend', onEnd, { passive: false });
        element.addEventListener('contextmenu', (e) => e.preventDefault());
      }

      // ===== DRAGGABLE CAT =====
      function makeCatDraggable() {
        let startX, startY, origX, origY;
        let isDragging = false;
        catWidget.addEventListener('mousedown', (e) => {
          startX = e.clientX;
          startY = e.clientY;
          const rect = catWidget.getBoundingClientRect();
          origX = rect.left;
          origY = rect.top;
          isDragging = false;
          e.preventDefault();
        });
        document.addEventListener('mousemove', (e) => {
          if (!startX) return;
          const dx = e.clientX - startX;
          const dy = e.clientY - startY;
          if (Math.abs(dx) > 5 || Math.abs(dy) > 5) isDragging = true;
          if (isDragging) {
            catWidget.style.left = (origX + dx) + 'px';
            catWidget.style.top = (origY + dy) + 'px';
            catWidget.style.right = 'auto';
            catWidget.style.bottom = 'auto';
          }
        });
        document.addEventListener('mouseup', () => {
          if (isDragging) {
            // save position? Not necessary, but we could.
          }
          startX = null; startY = null; isDragging = false;
        });
        // Touch
        catWidget.addEventListener('touchstart', (e) => {
          const touch = e.touches[0];
          startX = touch.clientX;
          startY = touch.clientY;
          const rect = catWidget.getBoundingClientRect();
          origX = rect.left;
          origY = rect.top;
          isDragging = false;
          e.preventDefault();
        }, { passive: false });
        document.addEventListener('touchmove', (e) => {
          if (!startX) return;
          const touch = e.touches[0];
          const dx = touch.clientX - startX;
          const dy = touch.clientY - startY;
          if (Math.abs(dx) > 5 || Math.abs(dy) > 5) isDragging = true;
          if (isDragging) {
            catWidget.style.left = (origX + dx) + 'px';
            catWidget.style.top = (origY + dy) + 'px';
            catWidget.style.right = 'auto';
            catWidget.style.bottom = 'auto';
          }
        }, { passive: false });
        document.addEventListener('touchend', () => {
          startX = null; startY = null; isDragging = false;
        }, { passive: false });
      }

      // ===== CAT SPEAK (app info) =====
      function catSpeakAboutApp(iconId) {
        const icon = desktopIcons.find(i => i.id === iconId);
        if (!icon) return false;
        let msg = `📱 App: ${icon.label}\n`;
        if (icon.created_at) {
          msg += `📅 Created: ${formatDate(icon.created_at)}\n`;
        }
        if (icon.updated_at) {
          msg += `🔄 Updated: ${formatDate(icon.updated_at)}\n`;
        }
        if (icon.size) {
          const sizeKB = (icon.size / 1024).toFixed(1);
          msg += `📦 Size: ${sizeKB} KB`;
        } else {
          msg += `📦 Size: unknown`;
        }
        // Additional details from window if open
        const win = windows.find(w => w.file === icon.file);
        if (win) {
          msg += `\n🪟 Window: ${win.title} (${win.w}x${win.h})`;
        }
        catSpeech.textContent = msg;
        catSpeech.style.display = 'block';
        setTimeout(() => { catSpeech.style.display = 'none'; }, 6000);
        return true;
      }

      // ===== FOLDER MANAGEMENT =====
      function createFolder(name, color = '#7a5aff', isFavFolder = false) {
        const id = 'folder_' + nextFolderId++;
        const icon = { id, type: 'folder', label: name, x: 100 + Math.random()*200, y: 60 + Math.random()*150, children: [], color, isFavFolder };
        desktopIcons.push(icon);
        folders.push({ id, name, appIds: [], color, isFavFolder });
        saveState();
        renderDesktopIcons();
        applyFilterAndSort();
        return icon;
      }

      function deleteFolder(folderId) {
        const folder = folders.find(f => f.id === folderId);
        if (!folder) return;
        if (folder.isFavFolder) {
          alert('Cannot delete the Favorites folder.');
          return;
        }
        (folder.appIds || []).forEach(id => {
          const icon = desktopIcons.find(i => i.id === id);
          if (icon) delete icon.folderId;
        });
        folders = folders.filter(f => f.id !== folderId);
        desktopIcons = desktopIcons.filter(i => i.id !== folderId);
        closeFolderWindow(folderId);
        saveState();
        renderDesktopIcons();
        applyFilterAndSort();
      }

      function moveIconToFolder(iconId, folderId) {
        const icon = desktopIcons.find(i => i.id === iconId);
        if (!icon || icon.type === 'folder') return;
        const targetFolder = folders.find(f => f.id === folderId);
        if (targetFolder && targetFolder.isFavFolder) {
          if (!favorites.includes(iconId)) {
            favorites.push(iconId);
          }
        } else {
          if (icon.folderId) {
            const oldFolder = folders.find(f => f.id === icon.folderId);
            if (oldFolder && oldFolder.isFavFolder) {
              const idx = favorites.indexOf(iconId);
              if (idx > -1) favorites.splice(idx, 1);
            }
          }
        }
        if (icon.folderId) {
          const oldFolder = folders.find(f => f.id === icon.folderId);
          if (oldFolder) {
            oldFolder.appIds = oldFolder.appIds.filter(id => id !== iconId);
            const folderIcon = desktopIcons.find(i => i.id === oldFolder.id);
            if (folderIcon) folderIcon.children = oldFolder.appIds;
          }
        }
        if (folderId) {
          const folder = folders.find(f => f.id === folderId);
          if (folder) {
            if (!folder.appIds.includes(iconId)) folder.appIds.push(iconId);
            icon.folderId = folderId;
            const folderIcon = desktopIcons.find(i => i.id === folderId);
            if (folderIcon) folderIcon.children = folder.appIds;
          }
        } else {
          delete icon.folderId;
        }
        saveState();
        renderDesktopIcons();
        refreshFolderWindows();
        applyFilterAndSort();
      }

      // ===== FOLDER WINDOW =====
      let folderWindows = [];

      function openFolderWindow(folderId) {
        const existing = folderWindows.find(fw => fw.folderId === folderId);
        if (existing) { existing.element.style.display = 'flex'; existing.element.style.zIndex = 50 + folderWindows.length; return; }
        const folder = folders.find(f => f.id === folderId);
        if (!folder) return;
        const win = document.createElement('div');
        win.className = 'folder-window';
        win.dataset.folderId = folderId;
        const folderIcon = document.querySelector(`.desktop-icon[data-icon-id="${folderId}"]`);
        let left = 200, top = 100;
        if (folderIcon) { const rect = folderIcon.getBoundingClientRect(); left = rect.left + 20; top = rect.top - 20; }
        win.style.left = left + 'px';
        win.style.top = top + 'px';
        win.style.zIndex = 50 + folderWindows.length;
        const header = document.createElement('div');
        header.className = 'fw-header';
        const iconEmoji = folder.isFavFolder ? '⭐' : '📁';
        header.innerHTML = `
          <span class="fw-title">${iconEmoji} ${folder.name}</span>
          <div class="fw-controls">
            <button class="fw-open-all" title="Open all apps in this folder">🚀</button>
            <button class="fw-close" title="Close">✕</button>
          </div>
        `;
        win.appendChild(header);
        const content = document.createElement('div');
        content.className = 'fw-content';
        win.appendChild(content);
        desktop.appendChild(win);
        const fwObj = { folderId, element: win, content };
        folderWindows.push(fwObj);
        renderFolderWindowContent(folderId);
        header.querySelector('.fw-close').addEventListener('click', () => closeFolderWindow(folderId));
        header.querySelector('.fw-open-all').addEventListener('click', () => {
          const appIds = folder.appIds || [];
          if (appIds.length === 0) return;
          const deskRect = desktop.getBoundingClientRect();
          const cols = Math.ceil(Math.sqrt(appIds.length));
          const rows = Math.ceil(appIds.length / cols);
          const spacing = 20;
          const winW = Math.max(320, (deskRect.width - (cols + 1) * spacing) / cols);
          const winH = Math.max(240, (deskRect.height - (rows + 1) * spacing) / rows);
          appIds.forEach((id, idx) => {
            const icon = desktopIcons.find(i => i.id === id);
            if (!icon || icon.type !== 'app') return;
            const col = idx % cols;
            const row = Math.floor(idx / cols);
            const x = spacing + col * (winW + spacing);
            const y = spacing + row * (winH + spacing);
            launchApp(icon.file, x, y, winW, winH);
          });
        });
        let dragData = null;
        header.addEventListener('mousedown', (e) => {
          if (e.target.closest('.fw-controls')) return;
          const rect = win.getBoundingClientRect();
          dragData = { offsetX: e.clientX - rect.left, offsetY: e.clientY - rect.top };
          const onMove = (ev) => {
            if (!dragData) return;
            let newX = ev.clientX - dragData.offsetX;
            let newY = ev.clientY - dragData.offsetY;
            const deskRect = desktop.getBoundingClientRect();
            newX = Math.max(0, Math.min(newX, deskRect.width - win.offsetWidth));
            newY = Math.max(0, Math.min(newY, deskRect.height - win.offsetHeight));
            win.style.left = newX + 'px';
            win.style.top = newY + 'px';
          };
          const onUp = () => { dragData = null; document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); };
          document.addEventListener('mousemove', onMove);
          document.addEventListener('mouseup', onUp);
        });
        header.addEventListener('touchstart', (e) => {
          if (e.target.closest('.fw-controls')) return;
          const touch = e.touches[0];
          const rect = win.getBoundingClientRect();
          dragData = { offsetX: touch.clientX - rect.left, offsetY: touch.clientY - rect.top };
          const onMove = (ev) => {
            if (!dragData) return;
            const t = ev.touches[0];
            let newX = t.clientX - dragData.offsetX;
            let newY = t.clientY - dragData.offsetY;
            const deskRect = desktop.getBoundingClientRect();
            newX = Math.max(0, Math.min(newX, deskRect.width - win.offsetWidth));
            newY = Math.max(0, Math.min(newY, deskRect.height - win.offsetHeight));
            win.style.left = newX + 'px';
            win.style.top = newY + 'px';
          };
          const onUp = () => { dragData = null; document.removeEventListener('touchmove', onMove); document.removeEventListener('touchend', onUp); };
          document.addEventListener('touchmove', onMove, { passive: false });
          document.addEventListener('touchend', onUp, { passive: false });
        }, { passive: false });
        win.addEventListener('mousedown', () => {
          const maxZ = Math.max(...folderWindows.map(fw => parseInt(fw.element.style.zIndex) || 0));
          win.style.zIndex = maxZ + 1;
        });
      }

      function closeFolderWindow(folderId) {
        const idx = folderWindows.findIndex(fw => fw.folderId === folderId);
        if (idx === -1) return;
        const fw = folderWindows[idx];
        fw.element.remove();
        folderWindows.splice(idx, 1);
      }

      function renderFolderWindowContent(folderId) {
        const fw = folderWindows.find(fw => fw.folderId === folderId);
        if (!fw) return;
        const folder = folders.find(f => f.id === folderId);
        if (!folder) return;
        const content = fw.content;
        content.innerHTML = '';
        const appIds = folder.appIds || [];
        if (appIds.length === 0) {
          content.innerHTML = '<div style="color:#8a8aba; text-align:center; grid-column:1/-1;">Empty</div>';
        } else {
          appIds.forEach(id => {
            const icon = desktopIcons.find(i => i.id === id);
            if (!icon) return;
            const item = document.createElement('div');
            item.className = 'fw-item';
            item.dataset.iconId = id;
            let emoji = '';
            if (icon.type === 'app') emoji = getIconEmoji(icon.file);
            else if (icon.type === 'file') emoji = '📄';
            item.innerHTML = `<span class="fw-icon">${emoji}</span><span class="fw-label">${icon.label}</span><span class="fw-remove" data-id="${id}">✕</span>`;
            content.appendChild(item);
            item.addEventListener('click', (e) => {
              if (e.target.classList.contains('fw-remove')) return;
              if (icon.type === 'app') launchApp(icon.file);
              else alert('File: ' + icon.label);
            });
            item.querySelector('.fw-remove').addEventListener('click', (e) => {
              e.stopPropagation();
              moveIconToFolder(id, null);
              renderFolderWindowContent(folderId);
            });
            makeFolderItemDraggable(item, id, folderId);
          });
        }
        const win = fw.element;
        const count = appIds.length;
        let cols = Math.min(4, Math.max(1, Math.ceil(Math.sqrt(count))));
        let width = Math.min(380, Math.max(140, cols * 60 + 40));
        let height = Math.min(320, Math.max(80, Math.ceil(count / cols) * 70 + 60));
        win.style.width = width + 'px';
        win.style.height = height + 'px';
        const folderIcon = document.querySelector(`.desktop-icon[data-icon-id="${folderId}"]`);
        if (folderIcon) {
          const badge = folderIcon.querySelector('.folder-badge');
          if (badge) badge.textContent = appIds.length;
        }
      }

      function makeFolderItemDraggable(element, iconId, folderId) {
        let startX, startY, origIndex;
        let isDragging = false;
        element.addEventListener('mousedown', (e) => {
          if (e.target.classList.contains('fw-remove')) return;
          startX = e.clientX; startY = e.clientY;
          origIndex = Array.from(element.parentElement.children).indexOf(element);
          isDragging = false;
        });
        document.addEventListener('mousemove', (e) => {
          if (!startX) return;
          const dx = e.clientX - startX;
          const dy = e.clientY - startY;
          if (Math.abs(dx) > 5 || Math.abs(dy) > 5) {
            isDragging = true;
            element.style.transform = `translate(${dx}px, ${dy}px)`;
            const allItems = Array.from(element.parentElement.children);
            const rect = element.getBoundingClientRect();
            const centerX = rect.left + rect.width/2;
            const centerY = rect.top + rect.height/2;
            let targetIndex = origIndex;
            allItems.forEach((item, idx) => {
              if (item === element) return;
              const r = item.getBoundingClientRect();
              if (centerX > r.left && centerX < r.right && centerY > r.top && centerY < r.bottom) targetIndex = idx;
            });
            if (targetIndex !== origIndex && targetIndex < allItems.length) {
              const parent = element.parentElement;
              if (targetIndex < origIndex) parent.insertBefore(element, allItems[targetIndex]);
              else parent.insertBefore(element, allItems[targetIndex+1] || null);
              const folder = folders.find(f => f.id === folderId);
              if (folder) {
                const newOrder = Array.from(parent.children).map(el => el.dataset.iconId);
                folder.appIds = newOrder;
                const folderIcon = desktopIcons.find(i => i.id === folderId);
                if (folderIcon) folderIcon.children = newOrder;
                saveState();
              }
              const allItems2 = Array.from(parent.children);
              origIndex = allItems2.indexOf(element);
            }
          }
        });
        document.addEventListener('mouseup', () => {
          if (isDragging) element.style.transform = '';
          startX = null; startY = null; isDragging = false;
        });
        element.addEventListener('touchstart', (e) => {
          if (e.target.classList.contains('fw-remove')) return;
          const touch = e.touches[0];
          startX = touch.clientX; startY = touch.clientY;
          origIndex = Array.from(element.parentElement.children).indexOf(element);
          isDragging = false;
        }, { passive: true });
        document.addEventListener('touchmove', (e) => {
          if (!startX) return;
          const touch = e.touches[0];
          const dx = touch.clientX - startX;
          const dy = touch.clientY - startY;
          if (Math.abs(dx) > 5 || Math.abs(dy) > 5) {
            isDragging = true;
            element.style.transform = `translate(${dx}px, ${dy}px)`;
            const allItems = Array.from(element.parentElement.children);
            const rect = element.getBoundingClientRect();
            const centerX = rect.left + rect.width/2;
            const centerY = rect.top + rect.height/2;
            let targetIndex = origIndex;
            allItems.forEach((item, idx) => {
              if (item === element) return;
              const r = item.getBoundingClientRect();
              if (centerX > r.left && centerX < r.right && centerY > r.top && centerY < r.bottom) targetIndex = idx;
            });
            if (targetIndex !== origIndex && targetIndex < allItems.length) {
              const parent = element.parentElement;
              if (targetIndex < origIndex) parent.insertBefore(element, allItems[targetIndex]);
              else parent.insertBefore(element, allItems[targetIndex+1] || null);
              const folder = folders.find(f => f.id === folderId);
              if (folder) {
                const newOrder = Array.from(parent.children).map(el => el.dataset.iconId);
                folder.appIds = newOrder;
                const folderIcon = desktopIcons.find(i => i.id === folderId);
                if (folderIcon) folderIcon.children = newOrder;
                saveState();
              }
              const allItems2 = Array.from(parent.children);
              origIndex = allItems2.indexOf(element);
            }
          }
        }, { passive: false });
        document.addEventListener('touchend', () => {
          if (isDragging) element.style.transform = '';
          startX = null; startY = null; isDragging = false;
        }, { passive: true });
      }

      function refreshFolderWindows() {
        folderWindows.forEach(fw => renderFolderWindowContent(fw.folderId));
      }

      // ===== APP WINDOWS =====
      function createWindow(file, title, x, y, w, h, notes = '', tags = '', minimized = false, maximized = false) {
        const id = nextId++;
        const deskRect = desktop.getBoundingClientRect();
        const maxW = Math.max(260, deskRect.width * 0.85);
        const maxH = Math.max(200, deskRect.height * 0.8);
        w = Math.min(w || 420, maxW);
        h = Math.min(h || 320, maxH);
        x = Math.min(x || 100, deskRect.width - w - 20);
        y = Math.min(y || 60, deskRect.height - h - 20);
        const win = { id, file, title: title || file, x: Math.max(0, x), y: Math.max(0, y), w, h, minimized, maximized, notes, tags, date: Date.now() };
        windows.push(win);
        renderWindow(win);
        saveState();
        updateTaskbar();
        return win;
      }

      function renderWindow(win) {
        const existing = document.querySelector(`.window[data-id="${win.id}"]`);
        if (existing) existing.remove();
        if (win.minimized) { updateTaskbar(); return; }

        const isBrowser = win.file === 'browser';
        const div = document.createElement('div');
        div.className = 'window';
        if (win.maximized) div.classList.add('maximized');
        div.dataset.id = win.id;
        div.style.left = win.x + 'px';
        div.style.top = win.y + 'px';
        div.style.width = win.w + 'px';
        div.style.height = win.h + 'px';
        div.style.zIndex = 10 + windows.indexOf(win);
        // set focus if last in array
        if (windows.indexOf(win) === windows.length - 1) {
          div.classList.add('focused');
        }

        // Determine header color
        let headerColor = null;
        const icon = desktopIcons.find(i => i.file === win.file);
        if (icon) {
          const tags = icon.tags || [];
          if (tags.length > 0) {
            const firstTag = tags[0];
            headerColor = getTagColor(firstTag);
          }
        }
        const social = socialApps.find(s => s.file === win.file);
        if (social) {
          headerColor = social.color;
        }

        const header = document.createElement('div');
        header.className = 'window-header';
        if (headerColor) {
          header.style.background = headerColor;
          header.style.borderBottom = `1px solid ${headerColor}`;
        }

        const starBtn = document.createElement('button');
        starBtn.className = 'star-btn';
        starBtn.dataset.file = win.file;
        if (icon) {
          starBtn.classList.toggle('active', favorites.includes(icon.id));
        }
        starBtn.textContent = '⭐';
        starBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          if (!icon) return;
          toggleFavorite(icon.id);
        });
        header.appendChild(starBtn);

        const titleSpan = document.createElement('span');
        titleSpan.className = 'window-title';
        titleSpan.textContent = isBrowser ? '🌐 Browser' : win.title;
        header.appendChild(titleSpan);

        const controls = document.createElement('div');
        controls.className = 'window-controls';
        controls.innerHTML = `<button class="btn-minimize" title="Minimize">−</button><button class="btn-maximize" title="Maximize">⛶</button><button class="btn-close" title="Close">✕</button>`;
        header.appendChild(controls);
        div.appendChild(header);

        const content = document.createElement('div');
        content.className = 'window-content';
        if (isBrowser) {
          content.style.display = 'flex';
          content.style.flexDirection = 'column';
          const addressBar = document.createElement('div');
          addressBar.style.display = 'flex';
          addressBar.style.padding = '4px';
          addressBar.style.background = '#0a0a1a';
          addressBar.style.borderBottom = '1px solid #3a2a6a';
          const urlInput = document.createElement('input');
          urlInput.type = 'text';
          urlInput.placeholder = 'Search or enter URL...';
          urlInput.value = 'https://www.google.de';
          urlInput.style.flex = '1';
          urlInput.style.background = '#1a1a3a';
          urlInput.style.border = '1px solid #3a2a6a';
          urlInput.style.color = '#d0d0ff';
          urlInput.style.padding = '2px 6px';
          urlInput.style.borderRadius = '4px';
          urlInput.style.outline = 'none';
          const goBtn = document.createElement('button');
          goBtn.textContent = 'Go';
          goBtn.style.background = '#1a1a3a';
          goBtn.style.border = '1px solid #4a3a8a';
          goBtn.style.color = '#c8c0ff';
          goBtn.style.borderRadius = '4px';
          goBtn.style.marginLeft = '4px';
          goBtn.style.padding = '0 8px';
          goBtn.style.cursor = 'pointer';
          addressBar.appendChild(urlInput);
          addressBar.appendChild(goBtn);
          content.appendChild(addressBar);
          const iframe = document.createElement('iframe');
          iframe.src = 'https://www.google.de';
          iframe.style.flex = '1';
          iframe.style.border = 'none';
          iframe.style.background = '#0a0a1a';
          content.appendChild(iframe);
          function navigate() {
            let url = urlInput.value.trim();
            if (!url) return;
            if (url.includes(' ') || !url.includes('.') && !url.startsWith('http')) {
              url = 'https://www.google.de/search?q=' + encodeURIComponent(url);
            } else if (!url.startsWith('http://') && !url.startsWith('https://')) {
              url = 'https://' + url;
            }
            iframe.src = url;
          }
          goBtn.addEventListener('click', navigate);
          urlInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') navigate(); });
        } else if (win.file !== '_folder') {
          const iframe = document.createElement('iframe');
          iframe.src = getAppUrl(win.file);
          iframe.loading = 'lazy';
          content.appendChild(iframe);
        } else {
          const placeholder = document.createElement('div');
          placeholder.style.padding = '1rem';
          placeholder.style.color = '#8a8aba';
          placeholder.textContent = 'Folder content';
          content.appendChild(placeholder);
        }
        div.appendChild(content);

        if (!isBrowser) {
          const notesArea = document.createElement('div');
          notesArea.className = 'window-notes-area';
          notesArea.innerHTML = `<div class="window-tags"><span class="tag-label">🏷️ Tags:</span><input type="text" class="tag-input" placeholder="comma, separated" value="${win.tags}" /></div><textarea class="note-textarea" placeholder="Write notes...">${win.notes}</textarea>`;
          content.appendChild(notesArea);
          const noteTextarea = notesArea.querySelector('.note-textarea');
          const tagInput = notesArea.querySelector('.tag-input');
          noteTextarea.addEventListener('input', () => { win.notes = noteTextarea.value; saveState(); });
          tagInput.addEventListener('input', () => { win.tags = tagInput.value; saveState(); });
        }

        const resizeHandle = document.createElement('div');
        resizeHandle.className = 'resize-handle';
        div.appendChild(resizeHandle);

        desktop.appendChild(div);

        // Focus management
        div.addEventListener('mousedown', () => { bringWindowToFront(win.id); });
        div.addEventListener('touchstart', () => { bringWindowToFront(win.id); });

        // Drag
        let dragData = null;
        function onDragStart(e) {
          if (e.target.closest('.window-controls') || e.target.closest('.star-btn')) return;
          const touch = e.touches ? e.touches[0] : e;
          const rect = div.getBoundingClientRect();
          dragData = { offsetX: touch.clientX - rect.left, offsetY: touch.clientY - rect.top };
          const onMove = (ev) => {
            if (!dragData) return;
            const t = ev.touches ? ev.touches[0] : ev;
            let newX = t.clientX - dragData.offsetX;
            let newY = t.clientY - dragData.offsetY;
            const deskRect = desktop.getBoundingClientRect();
            newX = Math.max(0, Math.min(newX, deskRect.width - div.offsetWidth));
            newY = Math.max(0, Math.min(newY, deskRect.height - div.offsetHeight));
            div.style.left = newX + 'px';
            div.style.top = newY + 'px';
            const winData = windows.find(w => w.id === win.id);
            if (winData) { winData.x = newX; winData.y = newY; saveState(); }
          };
          const onUp = () => { dragData = null; document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); document.removeEventListener('touchmove', onMove); document.removeEventListener('touchend', onUp); };
          document.addEventListener('mousemove', onMove);
          document.addEventListener('mouseup', onUp);
          document.addEventListener('touchmove', onMove, { passive: false });
          document.addEventListener('touchend', onUp, { passive: false });
        }
        header.addEventListener('mousedown', onDragStart);
        header.addEventListener('touchstart', onDragStart, { passive: false });

        // Resize
        let resizeData = null;
        function onResizeStart(e) {
          e.stopPropagation();
          const touch = e.touches ? e.touches[0] : e;
          const rect = div.getBoundingClientRect();
          resizeData = { startX: touch.clientX, startY: touch.clientY, startW: rect.width, startH: rect.height };
          const onMove = (ev) => {
            if (!resizeData) return;
            const t = ev.touches ? ev.touches[0] : ev;
            let newW = resizeData.startW + (t.clientX - resizeData.startX);
            let newH = resizeData.startH + (t.clientY - resizeData.startY);
            const deskRect = desktop.getBoundingClientRect();
            newW = Math.min(Math.max(260, newW), deskRect.width - 20);
            newH = Math.min(Math.max(200, newH), deskRect.height - 20);
            div.style.width = newW + 'px';
            div.style.height = newH + 'px';
            const winData = windows.find(w => w.id === win.id);
            if (winData) { winData.w = newW; winData.h = newH; saveState(); }
          };
          const onUp = () => { resizeData = null; document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); document.removeEventListener('touchmove', onMove); document.removeEventListener('touchend', onUp); };
          document.addEventListener('mousemove', onMove);
          document.addEventListener('mouseup', onUp);
          document.addEventListener('touchmove', onMove, { passive: false });
          document.addEventListener('touchend', onUp, { passive: false });
        }
        resizeHandle.addEventListener('mousedown', onResizeStart);
        resizeHandle.addEventListener('touchstart', onResizeStart, { passive: false });

        controls.querySelector('.btn-minimize').addEventListener('click', (e) => {
          e.stopPropagation();
          win.minimized = true;
          div.remove();
          updateTaskbar();
          saveState();
        });
        controls.querySelector('.btn-maximize').addEventListener('click', (e) => {
          e.stopPropagation();
          win.maximized = !win.maximized;
          div.classList.toggle('maximized');
          if (win.maximized) {
            win._prevRect = { x: win.x, y: win.y, w: win.w, h: win.h };
            div.style.left = '0'; div.style.top = '0';
            div.style.width = '100%'; div.style.height = '100%';
          } else {
            const prev = win._prevRect || { x: 100, y: 60, w: 420, h: 320 };
            win.x = prev.x; win.y = prev.y; win.w = prev.w; win.h = prev.h;
            div.style.left = win.x + 'px'; div.style.top = win.y + 'px';
            div.style.width = win.w + 'px'; div.style.height = win.h + 'px';
          }
          saveState();
        });
        controls.querySelector('.btn-close').addEventListener('click', (e) => {
          e.stopPropagation();
          closeWindow(win.id);
        });

        updateTaskbar();
        saveState();
      }

      function bringWindowToFront(id) {
        const win = windows.find(w => w.id === id);
        if (!win) return;
        const maxZ = Math.max(...Array.from(document.querySelectorAll('.window')).map(el => parseInt(el.style.zIndex) || 0));
        const el = document.querySelector(`.window[data-id="${id}"]`);
        if (el) {
          el.style.zIndex = maxZ + 1;
          el.classList.add('focused');
          document.querySelectorAll('.window').forEach(w => {
            if (w !== el) w.classList.remove('focused');
          });
          const idx = windows.indexOf(win);
          if (idx > -1) {
            windows.splice(idx, 1);
            windows.push(win);
          }
        }
      }

      function closeWindow(id) {
        const idx = windows.findIndex(w => w.id === id);
        if (idx === -1) return;
        const win = windows[idx];
        const el = document.querySelector(`.window[data-id="${id}"]`);
        if (el) el.remove();
        windows.splice(idx, 1);
        updateTaskbar();
        saveState();
      }

      // ===== TASKBAR =====
      function updateTaskbar() {
        taskbar.innerHTML = '';
        windows.forEach(win => {
          const item = document.createElement('div');
          item.className = 'task-item';
          const emoji = getIconEmoji(win.file);
          item.innerHTML = `<span class="task-icon">${emoji}</span><span>${win.title}</span>`;
          item.addEventListener('click', () => {
            if (win.minimized) { win.minimized = false; renderWindow(win); }
            else { bringWindowToFront(win.id); }
            updateTaskbar();
            saveState();
          });
          taskbar.appendChild(item);
        });
      }

      // ===== LAUNCH APP =====
      function launchApp(file, x, y, w, h) {
        const social = socialApps.find(s => s.file === file);
        if (social) {
          if (file === 'browser') { createBrowserWindow(x, y, w, h); return; }
          createBrowserWindowWithUrl(file, x, y, w, h);
          return;
        }
        if (windows.some(w => w.file === file)) { alert('Already open.'); return; }
        createWindow(file, file, x || 120 + Math.random()*100, y || 80 + Math.random()*80, w || 420, h || 320);
      }

      function createBrowserWindow(x, y, w, h) {
        const id = nextId++;
        const deskRect = desktop.getBoundingClientRect();
        x = x || 100;
        y = y || 80;
        w = w || Math.min(500, deskRect.width * 0.8);
        h = h || Math.min(400, deskRect.height * 0.7);
        const win = { id, file: 'browser', title: 'Browser', x, y, w, h, minimized: false, maximized: false, notes: '', tags: '', date: Date.now() };
        windows.push(win);
        renderWindow(win);
        saveState();
        updateTaskbar();
      }

      function createBrowserWindowWithUrl(url, x, y, w, h) {
        const id = nextId++;
        const deskRect = desktop.getBoundingClientRect();
        x = x || 100;
        y = y || 80;
        w = w || Math.min(500, deskRect.width * 0.8);
        h = h || Math.min(400, deskRect.height * 0.7);
        const win = { id, file: 'browser', title: url, x, y, w, h, minimized: false, maximized: false, notes: '', tags: '', date: Date.now(), url: url };
        windows.push(win);
        renderWindow(win);
        updateTaskbar();
        saveState();
      }

            const rect = div.getBoundingClientRect();
            dragData = { offsetX: e.clientX - rect.left, offsetY: e.clientY - rect.top };
            const onMove = (ev) => {
              if (!dragData) return;
              let newX = ev.clientX - dragData.offsetX;
              let newY = ev.clientY - dragData.offsetY;
              const deskRect = desktop.getBoundingClientRect();
              newX = Math.max(0, Math.min(newX, deskRect.width - div.offsetWidth));
              newY = Math.max(0, Math.min(newY, deskRect.height - div.offsetHeight));
              div.style.left = newX + 'px';
              div.style.top = newY + 'px';
              const winData = windows.find(w => w.id === win.id);
              if (winData) { winData.x = newX; winData.y = newY; saveState(); }
            };
            const onUp = () => { dragData = null; document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); };
            document.addEventListener('mousemove', onMove);
            document.addEventListener('mouseup', onUp);
          });
          header.addEventListener('touchstart', (e) => {
            if (e.target.closest('.window-controls') || e.target.closest('.star-btn')) return;
            const touch = e.touches[0];
            const rect = div.getBoundingClientRect();
            dragData = { offsetX: touch.clientX - rect.left, offsetY: touch.clientY - rect.top };
            const onMove = (ev) => {
              if (!dragData) return;
              const t = ev.touches[0];
              let newX = t.clientX - dragData.offsetX;
              let newY = t.clientY - dragData.offsetY;
              const deskRect = desktop.getBoundingClientRect();
              newX = Math.max(0, Math.min(newX, deskRect.width - div.offsetWidth));
              newY = Math.max(0, Math.min(newY, deskRect.height - div.offsetHeight));
              div.style.left = newX + 'px';
              div.style.top = newY + 'px';
              const winData = windows.find(w => w.id === win.id);
              if (winData) { winData.x = newX; winData.y = newY; saveState(); }
            };
            const onUp = () => { dragData = null; document.removeEventListener('touchmove', onMove); document.removeEventListener('touchend', onUp); };
            document.addEventListener('touchmove', onMove, { passive: false });
            document.addEventListener('touchend', onUp, { passive: false });
          }, { passive: false });
          // Resize
          let resizeData = null;
          resizeHandle.addEventListener('mousedown', (e) => {
            e.stopPropagation();
            const rect = div.getBoundingClientRect();
            resizeData = { startX: e.clientX, startY: e.clientY, startW: rect.width, startH: rect.height };
            const onMove = (ev) => {
              if (!resizeData) return;
              let newW = resizeData.startW + (ev.clientX - resizeData.startX);
              let newH = resizeData.startH + (ev.clientY - resizeData.startY);
              const deskRect = desktop.getBoundingClientRect();
              newW = Math.min(Math.max(260, newW), deskRect.width - 20);
              newH = Math.min(Math.max(200, newH), deskRect.height - 20);
              div.style.width = newW + 'px';
              div.style.height = newH + 'px';
              const winData = windows.find(w => w.id === win.id);
              if (winData) { winData.w = newW; winData.h = newH; saveState(); }
            };
            const onUp = () => { resizeData = null; document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); };
            document.addEventListener('mousemove', onMove);
            document.addEventListener('mouseup', onUp);
          });
          resizeHandle.addEventListener('touchstart', (e) => {
            e.stopPropagation();
            const touch = e.touches[0];
            const rect = div.getBoundingClientRect();
            resizeData = { startX: touch.clientX, startY: touch.clientY, startW: rect.width, startH: rect.height };
            const onMove = (ev) => {
              if (!resizeData) return;
              const t = ev.touches[0];
              let newW = resizeData.startW + (t.clientX - resizeData.startX);
              let newH = resizeData.startH + (t.clientY - resizeData.startY);
              const deskRect = desktop.getBoundingClientRect();

              div.style.width = newW + 'px';
              div.style.height = newH + 'px';
              const winData = windows.find(w => w.id === win.id);
              if (winData) { winData.w = newW; winData.h = newH; saveState(); }
            };
            const onUp = () => { resizeData = null; document.removeEventListener('touchmove', onMove); document.removeEventListener('touchend', onUp); };
            document.addEventListener('touchmove', onMove, { passive: false });
            document.addEventListener('touchend', onUp, { passive: false });
          }, { passive: false });
          div.addEventListener('mousedown', () => { bringWindowToFront(win.id); });

      async function loadReposForUser(user) {
        const repoListDiv = document.getElementById('repoList');
        if (!repoListDiv) return;
        repoListDiv.innerHTML = 'Loading...';
        try {
          const response = await fetch(`https://api.github.com/users/${user}/repos`);
          if (!response.ok) throw new Error('Failed to fetch repos');
          const repos = await response.json();
          repoListDiv.innerHTML = '';
          repos.forEach(repo => {
            const item = document.createElement('div');
            item.className = 'repo-item';
            const isActive = repo.name === currentRepo && user === currentUser;
            item.innerHTML = `<span class="repo-icon">${isActive ? '⭐' : '📂'}</span><span>${repo.name}</span>`;
            item.addEventListener('click', () => {
              currentRepo = repo.name;
              switchRepo(user, repo.name);
            });
            repoListDiv.appendChild(item);
          });
          if (repos.length === 0) {
            repoListDiv.innerHTML = '<div style="color:#8a8aba; padding:0.5rem;">No repositories found.</div>';
          }
        } catch (e) {
          repoListDiv.innerHTML = '<div style="color:#ff6a6a; padding:0.5rem;">Error loading repos.</div>';
          console.error(e);
        }
      }

      function switchRepo(user, repo) {
        if (user === currentUser && repo === currentRepo) return;
        currentUser = user;
        currentRepo = repo;
        GITHUB_USER = user;
        GITHUB_REPO = repo;
        saveState();
        // Reload desktop
        fetchAppList(user, repo).then(() => {
          // Clear state
          windows = [];
          desktopIcons = [];
          folders = [];
          favorites = [];
          dockedApps = [];
          nextId = 1;
          nextFolderId = 1;
          // Build new icons
          appList.forEach((app, idx) => {
            desktopIcons.push({ id: 'app_' + idx, type: 'app', label: app.file, file: app.file, x: 60 + (idx % 8) * 80, y: 30 + Math.floor(idx / 8) * 90, folderId: null, created_at: app.created_at, updated_at: app.updated_at, size: app.size });
          });
          // Create favorites folder (empty)
          const favFolder = createFolder('⭐ Favorites', '#ffcc00', true);
          // Add some default favorites
          const defaultFavs = ['CREATORBOARD', 'MUSICSHELL0', 'COSMICSHELL0'];
          defaultFavs.forEach(file => {
            const icon = desktopIcons.find(i => i.file === file);
            if (icon) moveIconToFolder(icon.id, favFolder.id);
          });
          arrangeIcons();
          saveState();
          renderDesktopIcons();
          applyFilterAndSort();
          updateDock();
          repoPopup.classList.remove('active');
          alert(`Switched to ${user}/${repo}`);
        });
      }

      // ===== FILTER & SORT =====
      function applyFilterAndSort() {
        if (_isRendering) return;
        const filter = filterInput.value.trim().toLowerCase();
        document.querySelectorAll('.window').forEach(el => {
          const id = parseInt(el.dataset.id);
          const win = windows.find(w => w.id === id);
          if (!win) return;
          let show = true;
          if (filter) {
            const tags = win.tags.split(',').map(t => t.trim().toLowerCase());
            show = tags.some(t => t.includes(filter));
          }
          el.style.display = show ? 'flex' : 'none';
        });
        document.querySelectorAll('.desktop-icon').forEach(el => {
          const iconId = el.dataset.iconId;
          const icon = desktopIcons.find(i => i.id === iconId);
          if (!icon) return;
          let show = true;
          if (filter) {
            if (icon.type === 'app') {
              const win = windows.find(w => w.file === icon.file);
              if (win) {
                const tags = win.tags.split(',').map(t => t.trim().toLowerCase());
                show = tags.some(t => t.includes(filter));
              } else show = false;
            } else if (icon.type === 'file') show = icon.label.toLowerCase().includes(filter);
            else show = true;
          }
          el.style.display = show ? 'flex' : 'none';
        });
        sortIconsAndWindows();
      }

      // ===== EXPORT / IMPORT =====
      function exportNotes() {
        const data = {
          windows: windows.map(win => ({ title: win.title, file: win.file, notes: win.notes, tags: win.tags, date: win.date })),
          icons: desktopIcons.map(icon => ({ id: icon.id, type: icon.type, label: icon.label, file: icon.file || '', x: icon.x, y: icon.y, folderId: icon.folderId || null, color: icon.color || null, tags: icon.tags || [], isFavFolder: icon.isFavFolder || false, created_at: icon.created_at, updated_at: icon.updated_at, size: icon.size })),
          folders: folders.map(f => ({ id: f.id, name: f.name, appIds: f.appIds, color: f.color || null, isFavFolder: f.isFavFolder || false })),
          favorites: favorites,
          dockedApps: dockedApps,
          listView: listView,
          githubUser: GITHUB_USER,
          githubRepo: GITHUB_REPO
        };
        const text = JSON.stringify(data, null, 2);
        const blob = new Blob([text], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'ai_desktop_export.txt';
        a.click();
        URL.revokeObjectURL(url);
      }
      exportBtn.addEventListener('click', exportNotes);

      importFileInput.addEventListener('change', (e) => {
