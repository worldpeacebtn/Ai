        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const data = JSON.parse(ev.target.result);
            if (data.windows) {
              data.windows.forEach(item => {
                const win = windows.find(w => w.file === item.file);
                if (win) {
                  win.notes = item.notes || '';
                  win.tags = item.tags || '';
                  const el = document.querySelector(`.window[data-id="${win.id}"]`);
                  if (el) {
                    const textarea = el.querySelector('.note-textarea');
                    const tagInput = el.querySelector('.tag-input');
                    if (textarea) textarea.value = win.notes;
                    if (tagInput) tagInput.value = win.tags;
                  }
                }
              });
            }
            if (data.favorites) favorites = data.favorites;
            if (data.dockedApps) dockedApps = data.dockedApps;
            if (data.listView !== undefined) {
              listView = data.listView;
              if (listView) desktop.classList.add('list-view');
            }
            if (data.githubUser && data.githubRepo) {
              GITHUB_USER = data.githubUser;
              GITHUB_REPO = data.githubRepo;
              currentUser = data.githubUser;
              currentRepo = data.githubRepo;

        const state = {
          windows: windows.map(win => ({ id: win.id, file: win.file, title: win.title, x: win.x, y: win.y, w: win.w, h: win.h, minimized: win.minimized, maximized: win.maximized, notes: win.notes, tags: win.tags, date: win.date })),
          icons: desktopIcons.map(icon => ({ id: icon.id, type: icon.type, label: icon.label, file: icon.file || '', x: icon.x, y: icon.y, folderId: icon.folderId || null, color: icon.color || null, tags: icon.tags || [], isFavFolder: icon.isFavFolder || false, created_at: icon.created_at, updated_at: icon.updated_at, size: icon.size })),
          folders: folders.map(f => ({ id: f.id, name: f.name, appIds: f.appIds, color: f.color || null, isFavFolder: f.isFavFolder || false })),
          nextId, nextFolderId,
          listView: listView,
          favorites: favorites,
          dockedApps: dockedApps,
          githubUser: GITHUB_USER,
          githubRepo: GITHUB_REPO
        };
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
      }

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return false;
          const data = JSON.parse(raw);
          if (!data) return false;
          if (data.windows) {
            data.windows.forEach(item => {
              const win = { id: item.id, file: item.file, title: item.title || item.file, x: item.x || 100, y: item.y || 60, w: item.w || 420, h: item.h || 320, minimized: item.minimized || false, maximized: item.maximized || false, notes: item.notes || '', tags: item.tags || '', date: item.date || Date.now() };
              windows.push(win);
              if (!win.minimized) renderWindow(win);
            });
            const maxId = windows.reduce((max, w) => Math.max(max, w.id), 0);
            nextId = maxId + 1;
          }
          if (data.icons) {
            desktopIcons = data.icons.map(icon => ({ id: icon.id, type: icon.type, label: icon.label, file: icon.file || '', x: icon.x || 100, y: icon.y || 60, folderId: icon.folderId || null, color: icon.color || null, tags: icon.tags || [], isFavFolder: icon.isFavFolder || false, created_at: icon.created_at, updated_at: icon.updated_at, size: icon.size }));
          }
          if (data.folders) {
            folders = data.folders.map(f => ({ id: f.id, name: f.name, appIds: f.appIds || [], color: f.color || '#7a5aff', isFavFolder: f.isFavFolder || false }));
          }
          if (data.nextId) nextId = data.nextId;
          if (data.nextFolderId) nextFolderId = data.nextFolderId;
          if (data.listView !== undefined) {
            listView = data.listView;
            if (listView) desktop.classList.add('list-view');
          }
          if (data.favorites) favorites = data.favorites;
          if (data.dockedApps) dockedApps = data.dockedApps;
          if (data.githubUser) GITHUB_USER = data.githubUser;
          if (data.githubRepo) GITHUB_REPO = data.githubRepo;
          currentUser = GITHUB_USER;
          currentRepo = GITHUB_REPO;
          renderDesktopIcons();
          updateTaskbar();
          updateDock();
          renderFavorites();
          return true;
        } catch(e) { return false; }
      }

      // ===== INIT =====
      async function init() {
        const loaded = loadState();
        await fetchAppList(GITHUB_USER, GITHUB_REPO);
        if (!loaded) {
          appList.forEach((app, idx) => {
            desktopIcons.push({ id: 'app_' + idx, type: 'app', label: app.file, file: app.file, x: 60 + (idx % 8) * 80, y: 30 + Math.floor(idx / 8) * 90, folderId: null, created_at: app.created_at, updated_at: app.updated_at, size: app.size });
          });
          const favFolder = createFolder('⭐ Favorites', '#ffcc00', true);
          const defaultFavs = ['CREATORBOARD', 'MUSICSHELL0', 'COSMICSHELL0'];
          defaultFavs.forEach(file => {
            const icon = desktopIcons.find(i => i.file === file);
            if (icon) moveIconToFolder(icon.id, favFolder.id);
          });
          arrangeIcons();
          saveState();
          renderDesktopIcons();
          applyFilterAndSort();
          updateDock();
        } else {
          renderDesktopIcons();
          applyFilterAndSort();
          updateDock();
        }
        console.log('✨ Ai Desktop v24 ready!');
        console.log(`📦 ${appList.length} apps loaded from ${GITHUB_USER}/${GITHUB_REPO}`);
        console.log(`⭐ ${favorites.length} favorites.`);
        console.log(`📌 ${dockedApps.length} docked apps.`);
      }

      init();
    })();
  </script>
</body>
</html>
