<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Three.js Grid Engine — 2D / 3D</title>

<style>
  :root{
    --safe-top:env(safe-area-inset-top,0px);
    --safe-right:env(safe-area-inset-right,0px);
    --safe-bottom:env(safe-area-inset-bottom,0px);
    --safe-left:env(safe-area-inset-left,0px);
    --panel:rgba(15,16,22,.82);
    --text:#f4f5f7;
    --muted:#aeb4c0;
    --accent:#4a9eff;
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{
    width:100%;height:100%;margin:0;overflow:hidden;
    position:fixed;inset:0;background:#0b0c10;
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
    touch-action:none;
    -webkit-user-select:none;user-select:none;
    -webkit-touch-callout:none;
  }

  #game{display:block;width:100%;height:100%;touch-action:none}

  .ui{
    position:fixed;z-index:5;pointer-events:none;
    left:calc(var(--safe-left) + 12px);
    right:calc(var(--safe-right) + 12px);
  }
  .top{
    top:calc(var(--safe-top) + 12px);
    display:flex;align-items:center;justify-content:space-between;gap:8px;
  }
  .panel{
    background:var(--panel);
    border:1px solid rgba(255,255,255,.12);
    border-radius:14px;
    box-shadow:0 4px 24px rgba(0,0,0,.32);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
  }
  button{
    pointer-events:auto;
    min-width:48px;min-height:48px;
    padding:10px 16px;border-radius:14px;
    border:1px solid rgba(255,255,255,.12);
    background:var(--panel);color:var(--text);
    font:600 14px/1 -apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;
    box-shadow:0 4px 24px rgba(0,0,0,.32);
    touch-action:manipulation;
  }
  button:active{transform:scale(.95)}
  .legend{
    padding:10px 13px;display:flex;gap:10px;align-items:center;
    font-size:12px;color:var(--muted);white-space:nowrap
  }
  .dot{width:11px;height:11px;display:inline-block;background:#5b9bd5;border-radius:3px}
  .dot.s{background:#e8913a;border-radius:50%}

  .bottom{
    bottom:calc(var(--safe-bottom) + 12px);
    display:flex;justify-content:center;
  }
  #info{
    min-width:220px;max-width:calc(100vw - 24px);
    padding:10px 15px;text-align:center;
    font-size:12px;line-height:1.45;white-space:pre-line;
    opacity:0;transform:translateY(8px);
    transition:opacity .2s,transform .2s;
  }
  #info.show{opacity:1;transform:none}
  .hint{
    position:fixed;z-index:4;left:50%;transform:translateX(-50%);
    bottom:calc(var(--safe-bottom) + 78px);
    color:rgba(255,255,255,.45);font-size:11px;pointer-events:none;
    white-space:nowrap
  }
  @media(max-width:420px){
    button{font-size:13px;padding:9px 13px}
    .legend{font-size:11px;padding:9px 10px;gap:7px}
  }
</style>
</head>

<body>
<canvas id="game"></canvas>

<div class="ui top">
  <button id="viewBtn" type="button">↗ 3D View</button>
  <div class="panel legend">
    <span class="dot"></span>Cubic
    <span class="dot s"></span>Spheric
  </div>
</div>

<div class="ui bottom">
  <div id="info" class="panel">Tap a block to toggle its visual style.</div>
</div>
<div class="hint">3D: drag to orbit · Tap: toggle block</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from "three";

/* ============================================================================
   CONFIG
   ============================================================================ */

const CFG = Object.freeze({
  gridSize: 8,             // 8 x 8 = 64 logical blocks
  cell: 1,
  maxPixelRatio: 2,        // iPhone DPR can be 3; 2 is a useful mobile ceiling
  cameraTransition: 7,
  dragThreshold: 9,
  orbitSensitivity: 0.32,
  minPhi: 20,
  maxPhi: 84,
  topHeight: 18,
  orbitRadius: 16.5
});

const View = Object.freeze({
  TWO_D: "2D",
  THREE_D: "3D"
});

/* ============================================================================
   LIGHTWEIGHT VIEW STATE MACHINE
   ============================================================================ */

class ViewStateMachine {
  constructor() {
    this.current = View.TWO_D;
    this.target = View.TWO_D;
  }

  toggle() {
    this.target = this.target === View.TWO_D ? View.THREE_D : View.TWO_D;
  }
}

/* ============================================================================
   SHARED RENDER RESOURCES
   One geometry + one material per visual style. No per-block GPU resources.
   ============================================================================ */

const BOX_GEO = new THREE.BoxGeometry(.92, .92, .92);
const SPHERE_GEO = new THREE.SphereGeometry(.46, 10, 8);

const CUBIC_MAT = new THREE.MeshLambertMaterial({
  color: 0x5b9bd5,
  flatShading: true
});

const SPHERIC_MAT = new THREE.MeshLambertMaterial({
  color: 0xe8913a,
  flatShading: true
});

/* ============================================================================
   BLOCK
   Logical state is deliberately separate from rendering state.
   ============================================================================ */

class Block {
  constructor(x, z, style = "cubic") {
    this.x = x;
    this.z = z;
    this.style = style;

    // Arbitrary gameplay payload. Add/remove fields as your game requires.
    this.payload = {
      id: `blk_${x}_${z}`,
      type: ["basic", "heavy", "fast", "shield"][(x * 7 + z) % 4],
      speed: Math.round(Math.random() * 15 - 5),
      weight: Math.round(Math.random() * 10 - 5),
      energy: Math.round(Math.random() * 100)
    };

    this.mesh = new THREE.Mesh(
      style === "cubic" ? BOX_GEO : SPHERE_GEO,
      style === "cubic" ? CUBIC_MAT : SPHERIC_MAT
    );

    this.mesh.userData.block = this;
    this.mesh.position.set(
      x * CFG.cell - CFG.gridSize * CFG.cell / 2 + CFG.cell / 2,
      .5,
      z * CFG.cell - CFG.gridSize * CFG.cell / 2 + CFG.cell / 2
    );
  }

  toggleStyle() {
    this.style = this.style === "cubic" ? "spheric" : "cubic";
    this.mesh.geometry = this.style === "cubic" ? BOX_GEO : SPHERE_GEO;
    this.mesh.material = this.style === "cubic" ? CUBIC_MAT : SPHERIC_MAT;
  }

  summary() {
    const p = this.payload;
    return `${p.id} · ${this.style}\n` +
      `Type: ${p.type}   Speed: ${p.speed >= 0 ? "+" : ""}${p.speed}   ` +
      `Weight: ${p.weight >= 0 ? "+" : ""}${p.weight}   Energy: ${p.energy}%`;
  }
}

/* ============================================================================
   GRID
   ============================================================================ */

class Grid {
  constructor() {
    this.blocks = new Map();
    this.group = new THREE.Group();
    this.group.name = "Grid";

    for (let z = 0; z < CFG.gridSize; z++) {
      for (let x = 0; x < CFG.gridSize; x++) {
        // Deterministic initial pattern avoids unnecessary random state.
        const style = ((x + z) % 3 === 0) ? "spheric" : "cubic";
        const block = new Block(x, z, style);
        this.blocks.set(x + "," + z, block);
        this.group.add(block.mesh);
      }
    }
  }
}

/* ============================================================================
   CAMERA
   Smoothly blends between a flat top-down layer and an orbiting 3D world.
   ============================================================================ */

class CameraController {
  constructor(camera, state) {
    this.camera = camera;
    this.state = state;

    this.theta = 40;
    this.phi = 58;
    this.radius = CFG.orbitRadius;

    this.targetPosition = new THREE.Vector3();
    this.lookTarget = new THREE.Vector3(0, 0, 0);

    this.camera.position.set(0, CFG.topHeight, .001);
    this.camera.lookAt(this.lookTarget);
    this.camera.fov = 28;
    this.camera.updateProjectionMatrix();
  }

  orbit(dx, dy) {
    if (this.state.target !== View.THREE_D) return;

    this.theta -= dx * CFG.orbitSensitivity;
    this.phi = THREE.MathUtils.clamp(
      this.phi - dy * CFG.orbitSensitivity * .8,
      CFG.minPhi,
      CFG.maxPhi
    );
  }

  update(dt) {
    const a = 1 - Math.exp(-CFG.cameraTransition * dt);

    if (this.state.target === View.TWO_D) {
      this.targetPosition.set(0, CFG.topHeight, .001);
    } else {
      const t = THREE.MathUtils.degToRad(this.theta);
      const p = THREE.MathUtils.degToRad(this.phi);
      this.targetPosition.set(
        this.radius * Math.sin(p) * Math.cos(t),
        this.radius * Math.cos(p),
        this.radius * Math.sin(p) * Math.sin(t)
      );
    }

    this.camera.position.lerp(this.targetPosition, a);
    this.camera.lookAt(this.lookTarget);

    const wantedFov = this.state.target === View.TWO_D ? 28 : 45;
    this.camera.fov += (wantedFov - this.camera.fov) * a;
    this.camera.updateProjectionMatrix();

    // Once visually close enough, mark the target as the current state.
    if (this.camera.position.distanceToSquared(this.targetPosition) < .0025) {
      this.state.current = this.state.target;
    }
  }
}

/* ============================================================================
   TOUCH INPUT
   Pointer Events give one input path for iPhone/iPad/Android/desktop.
   A tap toggles a block. A drag orbits only in 3D.
   ============================================================================ */

class TouchController {
  constructor(canvas, camera, grid, cameraController, onTap) {
    this.canvas = canvas;
    this.camera = camera;
    this.grid = grid;
    this.cameraController = cameraController;
    this.onTap = onTap;

    this.raycaster = new THREE.Raycaster();
    this.ndc = new THREE.Vector2();

    this.pointerId = -1;
    this.startX = 0;
    this.startY = 0;
    this.lastX = 0;
    this.lastY = 0;
    this.dragging = false;

    canvas.addEventListener("pointerdown", e => this.down(e));
    canvas.addEventListener("pointermove", e => this.move(e));
    canvas.addEventListener("pointerup", e => this.up(e));
    canvas.addEventListener("pointercancel", e => this.cancel(e));
    canvas.addEventListener("contextmenu", e => e.preventDefault());
  }

  down(e) {
    if (this.pointerId !== -1) return;

    this.pointerId = e.pointerId;
    this.startX = this.lastX = e.clientX;
    this.startY = this.lastY = e.clientY;
    this.dragging = false;

    this.canvas.setPointerCapture?.(e.pointerId);
  }

  move(e) {
    if (e.pointerId !== this.pointerId) return;

    const dx = e.clientX - this.lastX;
    const dy = e.clientY - this.lastY;
    this.lastX = e.clientX;
    this.lastY = e.clientY;

    if (!this.dragging) {
      const totalX = e.clientX - this.startX;
      const totalY = e.clientY - this.startY;
      if (totalX * totalX + totalY * totalY > CFG.dragThreshold ** 2) {
        this.dragging = true;
      }
    }

    if (this.dragging) {
      this.cameraController.orbit(dx, dy);
    }
  }

  up(e) {
    if (e.pointerId !== this.pointerId) return;

    if (!this.dragging) {
      this.tap(e.clientX, e.clientY);
    }

    this.reset(e.pointerId);
  }

  cancel(e) {
    if (e.pointerId === this.pointerId) this.reset(e.pointerId);
  }

  reset(id) {
    this.canvas.releasePointerCapture?.(id);
    this.pointerId = -1;
    this.dragging = false;
  }

  tap(clientX, clientY) {
    const r = this.canvas.getBoundingClientRect();

    this.ndc.x = ((clientX - r.left) / r.width) * 2 - 1;
    this.ndc.y = -((clientY - r.top) / r.height) * 2 + 1;

    this.raycaster.setFromCamera(this.ndc, this.camera);

    // 64 meshes max: direct raycast is cheaper and simpler than a spatial index.
    const hit = this.raycaster.intersectObjects(this.grid.group.children, false)[0];

    if (hit?.object?.userData?.block) {
      this.onTap(hit.object.userData.block);
    }
  }
}

/* ============================================================================
   ENGINE SETUP
   ============================================================================ */

function createRenderer(canvas) {
  const renderer = new THREE.WebGLRenderer({
    canvas,
    antialias: true,
    powerPreference: "high-performance"
  });

  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, CFG.maxPixelRatio));
  renderer.setSize(innerWidth, innerHeight, false);
  renderer.outputColorSpace = THREE.SRGBColorSpace;

  // Intentionally no shadow map: 64 blocks do not need it, and this saves
  // fill-rate + GPU memory on mobile.
  renderer.shadowMap.enabled = false;

  return renderer;
}

function createScene() {
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0b0c10);
  scene.fog = new THREE.Fog(0x0b0c10, 22, 42);

  const camera = new THREE.PerspectiveCamera(
    28, innerWidth / innerHeight, .1, 100
  );

  scene.add(new THREE.AmbientLight(0x667080, 1.25));

  const key = new THREE.DirectionalLight(0xffffff, 1.8);
  key.position.set(8, 14, 6);
  scene.add(key);

  // Single plane + GridHelper: no per-cell floor meshes.
  const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(CFG.gridSize * 1.15, CFG.gridSize * 1.15),
    new THREE.MeshLambertMaterial({color: 0x181a21})
  );
  floor.rotation.x = -Math.PI / 2;
  floor.position.y = -.01;
  scene.add(floor);

  const gridHelper = new THREE.GridHelper(
    CFG.gridSize * CFG.cell,
    CFG.gridSize,
    0x414553,
    0x282b34
  );
  gridHelper.position.y = .01;
  scene.add(gridHelper);

  return {scene, camera};
}

/* ============================================================================
   UI
   ============================================================================ */

const viewButton = document.getElementById("viewBtn");
const info = document.getElementById("info");

function updateViewLabel(state) {
  viewButton.textContent =
    state.target === View.THREE_D ? "↙ 2D View" : "↗ 3D View";
}

let infoTimer = 0;
function showInfo(block) {
  info.textContent = block.summary();
  info.classList.add("show");
  clearTimeout(infoTimer);
  infoTimer = setTimeout(() => info.classList.remove("show"), 2600);
}

/* ============================================================================
   BOOT
   ============================================================================ */

const canvas = document.getElementById("game");
const renderer = createRenderer(canvas);
const {scene, camera} = createScene();

const state = new ViewStateMachine();
const grid = new Grid();
scene.add(grid.group);

const cameraController = new CameraController(camera, state);

const touch = new TouchController(
  canvas,
  camera,
  grid,
  cameraController,
  block => {
    block.toggleStyle();
    showInfo(block);

    // Tiny feedback pulse; no permanent allocation.
    const mesh = block.mesh;
    mesh.scale.setScalar(1.12);
    setTimeout(() => mesh.scale.setScalar(1), 110);
  }
);

// Use click only for the UI button. Pointer events on the canvas are independent.
viewButton.addEventListener("click", () => {
  state.toggle();
  updateViewLabel(state);
});

function resize() {
  const w = innerWidth;
  const h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}

addEventListener("resize", resize);
addEventListener("orientationchange", () => setTimeout(resize, 150));

updateViewLabel(state);

const clock = new THREE.Clock();

function frame() {
  requestAnimationFrame(frame);

  // Clamp large jumps after tab/background suspension.
  const dt = Math.min(clock.getDelta(), .05);

  cameraController.update(dt);
  renderer.render(scene, camera);
}

frame();

// Optional developer hook.
window.GridEngine = {scene, camera, grid, state, renderer};
</script>
</body>
</html>
