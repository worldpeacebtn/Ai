<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Utopian Neon Audio React</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --neon-cyan: #00f3ff;
            --neon-magenta: #ff00ff;
            --dark-bg: #03040a;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--dark-bg);
            font-family: 'Courier New', Courier, monospace; /* Techy font */
            touch-action: none; /* Prevent scroll on touch */
        }

        #webgl-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none; /* Let clicks pass through where there's no UI */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Utopian Glassmorphism HUD */
        .glass-hud {
            background: rgba(3, 4, 10, 0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 243, 255, 0.2);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.1) inset;
            pointer-events: auto;
        }

        .neon-text-cyan {
            color: var(--neon-cyan);
            text-shadow: 0 0 5px var(--neon-cyan), 0 0 10px rgba(0, 243, 255, 0.5);
        }

        .neon-text-magenta {
            color: var(--neon-magenta);
            text-shadow: 0 0 5px var(--neon-magenta), 0 0 10px rgba(255, 0, 255, 0.5);
        }

        .hud-border {
            border: 1px solid rgba(0, 243, 255, 0.3);
            position: relative;
        }
        
        .hud-border::before, .hud-border::after {
            content: '';
            position: absolute;
            width: 10px;
            height: 10px;
            border: 2px solid var(--neon-cyan);
        }
        .hud-border::before { top: -2px; left: -2px; border-right: none; border-bottom: none; }
        .hud-border::after { bottom: -2px; right: -2px; border-left: none; border-top: none; }

        .drop-zone {
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .drop-zone.dragover {
            background: rgba(0, 243, 255, 0.2);
            border-color: var(--neon-cyan);
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.4);
            transform: scale(1.05);
        }

        /* Custom Range Slider */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 8px;
            background: var(--neon-cyan);
            box-shadow: 0 0 10px var(--neon-cyan);
            cursor: pointer;
            margin-top: -6px;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: rgba(0, 243, 255, 0.2);
            border-radius: 2px;
        }

        /* Visualizer Bars */
        .visualizer-container {
            display: flex;
            align-items: flex-end;
            gap: 2px;
            height: 40px;
            width: 100%;
            opacity: 0.7;
        }
        .bar {
            flex: 1;
            background: var(--neon-cyan);
            height: 5%;
            transition: height 0.05s ease;
            box-shadow: 0 0 5px var(--neon-cyan);
        }
        .bar.magenta { background: var(--neon-magenta); box-shadow: 0 0 5px var(--neon-magenta); }

        #file-input { display: none; }
    </style>

    <!-- Import Three.js and Post-Processing as ES Modules -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <div id="webgl-container"></div>

    <div id="ui-layer" class="p-4 sm:p-6 lg:p-8">
        
        <!-- Top HUD Status & Spec Controls -->
        <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 w-full">
            <div class="glass-hud hud-border px-4 py-2 rounded-sm text-xs sm:text-sm font-bold tracking-widest uppercase neon-text-cyan flex items-center gap-2">
                <span>SYS.V.2.0 //</span> <span id="status-text" class="text-white">AWAITING SIGNAL</span>
            </div>

            <!-- Mood & Spec Customization Panel -->
            <div class="glass-hud hud-border px-3 py-2 rounded-sm flex flex-wrap items-center gap-3 text-xs text-cyan-300">
                <div class="flex items-center gap-1">
                    <span class="opacity-70">MOOD:</span>
                    <select id="mood-select" class="bg-black/60 border border-cyan-400/40 text-cyan-400 rounded px-2 py-1 outline-none cursor-pointer">
                        <option value="cyberpunk">Cyberpunk (Cyan/Magenta)</option>
                        <option value="matrix">Matrix (Emerald / Lime)</option>
                        <option value="synthwave">Sunset Synthwave</option>
                        <option value="void">Deep Void Purple</option>
                    </select>
                </div>
                <div class="flex items-center gap-1">
                    <span class="opacity-70">SCALE:</span>
                    <input type="range" id="scale-slider" min="0.5" max="2.0" step="0.1" value="1.0" class="w-16">
                </div>
                <div class="flex items-center gap-1">
                    <span class="opacity-70">SPEED:</span>
                    <input type="range" id="speed-slider" min="0.2" max="2.5" step="0.1" value="1.0" class="w-16">
                </div>
            </div>
        </header>

        <!-- Center Interactive Area -->
        <main class="flex-grow flex items-center justify-center pointer-events-none relative">
            <input type="file" id="file-input" accept="audio/*">
            <label for="file-input" id="drop-zone" class="glass-hud drop-zone rounded-full w-48 h-48 sm:w-64 sm:h-64 flex flex-col items-center justify-center gap-4 text-center p-6 border-2 border-dashed border-cyan-400/50 relative overflow-hidden group">
                <!-- Rotating border effect -->
                <div class="absolute inset-0 border-2 border-transparent border-t-cyan-400 rounded-full animate-spin opacity-50 group-hover:opacity-100" style="animation-duration: 3s;"></div>
                
                <svg class="w-12 h-12 text-cyan-400 filter drop-shadow-[0_0_8px_rgba(0,243,255,0.8)]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"></path>
                </svg>
                <div>
                    <h2 class="neon-text-cyan font-bold tracking-widest text-sm">INITIATE AUDIO</h2>
                    <p class="text-[10px] text-cyan-200/60 mt-2 tracking-widest uppercase">Tap or Drop File</p>
                </div>
            </label>
        </main>

        <!-- Bottom Player Controls -->
        <footer class="glass-hud hud-border w-full max-w-2xl mx-auto rounded-lg p-4 sm:p-5 flex flex-col gap-4">
            <!-- Track Info & Visualizer -->
            <div class="flex justify-between items-end">
                <div class="overflow-hidden w-2/3">
                    <h3 id="track-name" class="text-white font-bold text-sm sm:text-base truncate drop-shadow-md">NO TRACK LOADED</h3>
                    <p class="text-cyan-400/80 text-xs tracking-widest truncate" id="track-time">00:00 / 00:00</p>
                </div>
                
                <!-- Mini UI Visualizer -->
                <div class="w-1/3 visualizer-container" id="ui-visualizer">
                    <!-- Bars generated in JS -->
                </div>
            </div>

            <!-- Progress Bar -->
            <div class="w-full relative group">
                <input type="range" id="progress-slider" min="0" max="100" value="0" class="w-full z-10 relative">
            </div>

            <!-- Controls -->
            <div class="flex items-center justify-between">
                <div class="flex gap-4 items-center">
                    <button id="btn-play" class="w-12 h-12 rounded-full border border-cyan-400/50 flex items-center justify-center text-cyan-400 hover:bg-cyan-400/10 hover:shadow-[0_0_15px_rgba(0,243,255,0.4)] transition-all">
                        <svg class="w-5 h-5 ml-1" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    </button>
                    <button id="btn-pause" class="w-12 h-12 rounded-full border border-cyan-400/50 hidden items-center justify-center text-cyan-400 hover:bg-cyan-400/10 hover:shadow-[0_0_15px_rgba(0,243,255,0.4)] transition-all">
                        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                    </button>
                </div>

                <div class="flex items-center gap-2 w-1/3 max-w-[120px]">
                    <svg class="w-4 h-4 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path></svg>
                    <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.7">
                </div>
            </div>
        </footer>
    </div>

    <!-- Application Logic -->
    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        // --- Audio Context & State ---
        let audioCtx, analyser, source, gainNode;
        const audioElement = new Audio();
        let audioDataArray;
        let isPlaying = false;

        // Customization specs
        let moodSettings = {
            primaryColor: 0x00f3ff,
            secondaryColor: 0xff00ff,
            fogColor: 0x03040a,
            scaleMultiplier: 1.0,
            speedMultiplier: 1.0
        };

        // UI Elements
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const btnPlay = document.getElementById('btn-play');
        const btnPause = document.getElementById('btn-pause');
        const statusText = document.getElementById('status-text');
        const trackName = document.getElementById('track-name');
        const trackTime = document.getElementById('track-time');
        const progressSlider = document.getElementById('progress-slider');
        const volumeSlider = document.getElementById('volume-slider');
        const uiVisualizer = document.getElementById('ui-visualizer');
        const moodSelect = document.getElementById('mood-select');
        const scaleSlider = document.getElementById('scale-slider');
        const speedSlider = document.getElementById('speed-slider');

        // Create UI visualizer bars
        const numBars = 16;
        const uiBars = [];
        for(let i=0; i<numBars; i++) {
            const bar = document.createElement('div');
            bar.className = 'bar ' + (i % 4 === 0 ? 'magenta' : '');
            uiVisualizer.appendChild(bar);
            uiBars.push(bar);
        }

        // --- Three.js Setup ---
        const container = document.getElementById('webgl-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x03040a, 0.015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 3, 12);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // --- Post-Processing (Neon Bloom) ---
        const renderScene = new RenderPass(scene, camera);
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 2.5, 0.5, 0.1);
        
        const composer = new EffectComposer(renderer);
        composer.addPass(renderScene);
        composer.addPass(bloomPass);

        // --- Scene Objects ---

        // 1. Moving Neon Terrain Grid
        const gridGeometry = new THREE.PlaneGeometry(100, 100, 60, 60);
        gridGeometry.rotateX(-Math.PI / 2);
        
        const positionAttribute = gridGeometry.attributes.position;
        const originalVertices = [];
        for (let i = 0; i < positionAttribute.count; i++) {
            originalVertices.push(
                positionAttribute.getX(i),
                positionAttribute.getY(i),
                positionAttribute.getZ(i)
            );
        }

        const gridMaterial = new THREE.MeshBasicMaterial({ 
            color: moodSettings.primaryColor, 
            wireframe: true, 
            transparent: true, 
            opacity: 0.3 
        });
        const grid = new THREE.Mesh(gridGeometry, gridMaterial);
        grid.position.y = -3;
        scene.add(grid);

        // 2. Central Utopian Core
        const coreGroup = new THREE.Group();
        const coreGeo = new THREE.IcosahedronGeometry(2, 1);
        const coreMat = new THREE.MeshBasicMaterial({ color: moodSettings.secondaryColor });
        const coreMesh = new THREE.Mesh(coreGeo, coreMat);
        
        const wireGeo = new THREE.IcosahedronGeometry(2.5, 1);
        const wireMat = new THREE.MeshBasicMaterial({ color: moodSettings.primaryColor, wireframe: true });
        const wireMesh = new THREE.Mesh(wireGeo, wireMat);
        
        coreGroup.add(coreMesh);
        coreGroup.add(wireMesh);
        scene.add(coreGroup);

        // 3. Floating Particles
        const particleCount = 250;
        const particlesGeo = new THREE.BufferGeometry();
        const posArray = new Float32Array(particleCount * 3);
        const velocityArray = [];

        for(let i = 0; i < particleCount * 3; i+=3) {
            posArray[i] = (Math.random() - 0.5) * 40;
            posArray[i+1] = (Math.random() - 0.5) * 40;
            posArray[i+2] = (Math.random() - 0.5) * 40;
            velocityArray.push({
                x: (Math.random() - 0.5) * 0.05,
                y: (Math.random() - 0.5) * 0.05,
                z: (Math.random() - 0.5) * 0.05
            });
        }
        particlesGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const particleMat = new THREE.PointsMaterial({
            size: 0.2,
            color: 0xffffff,
            transparent: true,
            opacity: 0.6,
            blending: THREE.AdditiveBlending
        });
        const particles = new THREE.Points(particlesGeo, particleMat);
        scene.add(particles);


        // --- Mood / Color Presets Handler ---
        moodSelect.addEventListener('change', (e) => {
            const val = e.target.value;
            if(val === 'cyberpunk') {
                moodSettings.primaryColor = 0x00f3ff;
                moodSettings.secondaryColor = 0xff00ff;
                moodSettings.fogColor = 0x03040a;
            } else if(val === 'matrix') {
                moodSettings.primaryColor = 0x00ff66;
                moodSettings.secondaryColor = 0x003311;
                moodSettings.fogColor = 0x010502;
            } else if(val === 'synthwave') {
                moodSettings.primaryColor = 0xff3366;
                moodSettings.secondaryColor = 0xffcc00;
                moodSettings.fogColor = 0x0a0308;
            } else if(val === 'void') {
                moodSettings.primaryColor = 0x9933ff;
                moodSettings.secondaryColor = 0x00ffff;
                moodSettings.fogColor = 0x05020a;
            }

            // Apply immediately to materials
            gridMaterial.color.setHex(moodSettings.primaryColor);
            wireMat.color.setHex(moodSettings.primaryColor);
            coreMat.color.setHex(moodSettings.secondaryColor);
            scene.fog.color.setHex(moodSettings.fogColor);
            renderer.setClearColor(moodSettings.fogColor);
        });

        scaleSlider.addEventListener('input', (e) => {
            moodSettings.scaleMultiplier = parseFloat(e.target.value);
        });

        speedSlider.addEventListener('input', (e) => {
            moodSettings.speedMultiplier = parseFloat(e.target.value);
        });


        // --- Audio Initialization ---
        function initAudio() {
            if (audioCtx) return;
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 1024; 
            const bufferLength = analyser.frequencyBinCount;
            audioDataArray = new Uint8Array(bufferLength);
            
            gainNode = audioCtx.createGain();
            gainNode.gain.value = volumeSlider.value;

            source = audioCtx.createMediaElementSource(audioElement);
            source.connect(gainNode);
            gainNode.connect(analyser);
            analyser.connect(audioCtx.destination);
        }

        function loadAudioFile(file) {
            initAudio();
            const url = URL.createObjectURL(file);
            audioElement.src = url;
            audioElement.load();
            
            trackName.textContent = file.name.replace(/\.[^/.]+$/, "");
            statusText.textContent = "SIGNAL ESTABLISHED";
            statusText.className = "text-cyan-400";
            
            dropZone.style.opacity = '0.1';
            dropZone.style.transform = 'scale(0.8)';
            
            playAudio();
        }

        // --- Interaction Logic ---
        window.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });
        window.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        window.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files && e.dataTransfer.files[0]) {
                const file = e.dataTransfer.files[0];
                if(file.type.startsWith('audio/')) loadAudioFile(file);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files && e.target.files[0]) loadAudioFile(e.target.files[0]);
        });

        function playAudio() {
            if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            
            const playPromise = audioElement.play();
            if (playPromise !== undefined) {
                playPromise.then(() => {
                    isPlaying = true;
                    btnPlay.classList.add('hidden');
                    btnPause.classList.remove('hidden');
                    statusText.textContent = "SIGNAL ACTIVE";
                }).catch(error => {
                    isPlaying = false;
                    btnPause.classList.add('hidden');
                    btnPlay.classList.remove('hidden');
                    statusText.textContent = "TAP PLAY TO START";
                });
            }
        }

        function pauseAudio() {
            audioElement.pause();
            isPlaying = false;
            btnPause.classList.add('hidden');
            btnPlay.classList.remove('hidden');
            statusText.textContent = "SIGNAL PAUSED";
        }

        btnPlay.addEventListener('click', () => {
            if(!audioElement.src) fileInput.click();
            else playAudio();
        });
        btnPause.addEventListener('click', pauseAudio);

        volumeSlider.addEventListener('input', (e) => {
            if(gainNode) gainNode.gain.value = e.target.value;
            audioElement.volume = e.target.value;
        });

        audioElement.addEventListener('timeupdate', () => {
            if(audioElement.duration) {
                progressSlider.value = (audioElement.currentTime / audioElement.duration) * 100;
                const formatTime = (time) => `${Math.floor(time / 60).toString().padStart(2, '0')}:${Math.floor(time % 60).toString().padStart(2, '0')}`;
                trackTime.textContent = `${formatTime(audioElement.currentTime)} / ${formatTime(audioElement.duration)}`;
            }
        });

        progressSlider.addEventListener('input', (e) => {
            if(audioElement.duration) audioElement.currentTime = (e.target.value / 100) * audioElement.duration;
        });

        audioElement.addEventListener('ended', () => {
            pauseAudio();
            statusText.textContent = "SIGNAL COMPLETE";
        });


        // --- Animation Loop ---
        let time = 0;

        function animate() {
            requestAnimationFrame(animate);
            time += 0.02 * moodSettings.speedMultiplier;

            let bassAvg = 0;
            let midAvg = 0;

            if (analyser && isPlaying) {
                analyser.getByteFrequencyData(audioDataArray);
                for(let i=0; i<10; i++) bassAvg += audioDataArray[i];
                bassAvg /= 10;
                for(let i=10; i<50; i++) midAvg += audioDataArray[i];
                midAvg /= 40;

                const step = Math.floor(audioDataArray.length / 3 / numBars);
                for(let i=0; i<numBars; i++) {
                    const val = audioDataArray[i * step];
                    uiBars[i].style.height = `${Math.max(5, (val / 255) * 100)}%`;
                }
            } else {
                for(let i=0; i<numBars; i++) {
                    const h = parseFloat(uiBars[i].style.height || '5');
                    if(h > 5) uiBars[i].style.height = `${h - 2}%`;
                }
            }

            const normalizedBass = bassAvg / 255;
            const normalizedMid = midAvg / 255;

            // 1. Animate Core with Scale Multiplier
            const targetScale = (1 + (normalizedBass * 0.8)) * moodSettings.scaleMultiplier;
            coreGroup.scale.lerp(new THREE.Vector3(targetScale, targetScale, targetScale), 0.1);
            
            coreMesh.rotation.x = time * 0.5 + normalizedMid;
            coreMesh.rotation.y = time * 0.3;
            wireMesh.rotation.x = -time * 0.4;
            wireMesh.rotation.y = time * 0.6 + normalizedBass;

            bloomPass.threshold = 0.1 - (normalizedBass * 0.05);
            bloomPass.strength = (2.5 + (normalizedBass * 1.5)) * moodSettings.scaleMultiplier;

            // 2. Animate Grid Waves
            const positions = gridGeometry.attributes.position.array;
            for (let i = 0; i < positions.length; i += 3) {
                const ox = originalVertices[i];
                const oy = originalVertices[i + 1];
                const wave1 = Math.sin(ox * 0.2 + time * 3) * 0.5;
                const wave2 = Math.cos(oy * 0.2 - time * 2) * 0.5;
                const dist = Math.sqrt(ox*ox + oy*oy);
                const bassWave = Math.sin(dist * 0.5 - time * 5) * (normalizedBass * 3 * moodSettings.scaleMultiplier) * Math.max(0, 1 - dist/50);
                positions[i + 2] = wave1 + wave2 + bassWave;
            }
            gridGeometry.attributes.position.needsUpdate = true;
            grid.position.z = (time * 10) % 2;

            // 3. Animate Particles
            const pPositions = particlesGeo.attributes.position.array;
            for(let i=0; i<particleCount; i++) {
                const i3 = i * 3;
                pPositions[i3] += velocityArray[i].x * (1 + normalizedBass*2);
                pPositions[i3+1] += velocityArray[i].y * (1 + normalizedBass*2);
                pPositions[i3+2] += velocityArray[i].z * moodSettings.speedMultiplier + (isPlaying ? 0.1 : 0.02);

                if(pPositions[i3+2] > 10) {
                    pPositions[i3] = (Math.random() - 0.5) * 40;
                    pPositions[i3+1] = (Math.random() - 0.5) * 40;
                    pPositions[i3+2] = -30;
                }
            }
            particlesGeo.attributes.position.needsUpdate = true;

            camera.position.x = Math.sin(time * 0.5) * 1;
            camera.position.y = 3 + Math.cos(time * 0.3) * 0.5;
            camera.lookAt(0, 0, 0);

            composer.render();
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
