<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Holo-Nexus Studio v2</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root {
  --cyan: #00f3ff; --magenta: #ff00ff; --lime: #62fcd7; 
  --bg: #03040a; --panel: rgba(10, 12, 18, 0.85);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { 
  margin: 0; width: 100%; height: 100%; overflow: hidden; 
  background: var(--bg); color: #eafaff; font-family: Inter, system-ui, sans-serif; 
  touch-action: none; /* Prevent browser pull-to-refresh */
}
canvas { display: block; outline: none; }
#webgl { position: absolute; inset: 0; z-index: 1; }

.ui-layer {
  position: absolute; z-index: 20; inset: 0; pointer-events: none;
  display: flex; flex-direction: column; justify-content: flex-end;
}
.bottom-panel {
  pointer-events: auto; background: var(--panel);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border-top: 1px solid rgba(0, 243, 255, 0.3);
  box-shadow: 0 -5px 25px rgba(0, 243, 255, 0.1);
  border-top-left-radius: 20px; border-top-right-radius: 20px;
  width: 100%; max-height: 50vh; display: flex; flex-direction: column;
  transition: transform 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);
}
.bottom-panel.collapsed { transform: translateY(calc(100% - 60px)); }

.drag-handle {
  width: 100%; height: 20px; display: flex; justify-content: center; align-items: center; cursor: pointer;
}
.drag-handle::after {
  content: ''; width: 40px; height: 4px; background: rgba(255,255,255,0.3); border-radius: 2px;
}

.tabs { display: flex; border-bottom: 1px solid rgba(255,255,255,0.1); padding: 0 10px; gap: 10px; overflow-x: auto;}
.tab-btn {
  background: none; border: none; color: #8b92a5; padding: 10px; font-size: 13px;
  text-transform: uppercase; letter-spacing: 1px; cursor: pointer; border-bottom: 2px solid transparent;
  white-space: nowrap; transition: 0.2s;
}
.tab-btn.active { color: var(--cyan); border-bottom-color: var(--cyan); }

.tab-content { padding: 15px; overflow-y: auto; flex: 1; display: none; gap: 12px; flex-direction: column; }
.tab-content.active { display: flex; }

.btn {
  background: rgba(0, 243, 255, 0.1); border: 1px solid rgba(0, 243, 255, 0.4);
  color: #fff; padding: 10px 15px; border-radius: 8px; cursor: pointer; font-size: 14px;
  display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s;
}
.btn:active { background: var(--cyan); color: #000; }

.row { display: flex; justify-content: space-between; align-items: center; font-size: 13px; gap: 10px;}
input[type=range] { flex: 1; accent-color: var(--cyan); }
select { background: #161923; border: 1px solid #3b3f4b; color: #fff; padding: 6px; border-radius: 6px; outline:none; }

#toast {
  position: absolute; top: 40px; left: 50%; transform: translateX(-50%);
  background: #090d16; border: 1px solid var(--cyan); padding: 8px 16px;
  border-radius: 20px; font-size: 12px; z-index: 100; opacity: 0; pointer-events: none;
  transition: 0.3s; box-shadow: 0 0 15px rgba(0, 243, 255, 0.3); text-transform: uppercase;
}
#toast.show { opacity: 1; top: 20px; }

#player-bar {
  display: flex; align-items: center; gap: 12px; background: rgba(0,0,0,0.4); 
  padding: 10px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1);
}
.play-btn { width: 40px; height: 40px; border-radius: 50%; background: var(--cyan); border: none; color: #000; font-size: 18px; cursor: pointer;}
.track-info { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 12px;}

.library-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 8px; }
.lib-item { 
  aspect-ratio: 1; background: #111; border: 1px solid #333; border-radius: 8px; 
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  font-size: 10px; text-align: center; cursor: pointer; overflow: hidden; position: relative;
}
.lib-item.active { border-color: var(--cyan); background: rgba(0, 243, 255, 0.1); }
.lib-item img, .lib-item video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.5; }

#browserOverlay {
  position: absolute; inset: 20px; z-index: 50; background: #fff; border-radius: 12px;
  display: none; flex-direction: column; overflow: hidden; border: 2px solid var(--cyan);
}
#browserOverlay iframe { flex: 1; width: 100%; border: none; }
.browser-header { background: #222; padding: 10px; display: flex; justify-content: space-between; align-items: center;}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>

<div id="toast">System Online</div>

<!-- 2D Browser Overlay -->
<div id="browserOverlay">
  <div class="browser-header">
    <span style="font-weight:bold; color:var(--cyan)">NEXUS WEB EXPLORER</span>
    <button class="btn" onclick="document.getElementById('browserOverlay').style.display='none'" style="padding: 4px 10px; font-size: 12px;">Close</button>
  </div>
  <iframe id="browserFrame" src="about:blank"></iframe>
</div>

<!-- WebGL Canvas Container -->
<div id="webgl"></div>

<!-- Mobile-Optimized Bottom UI -->
<div class="ui-layer">
  <div class="bottom-panel" id="bottomPanel">
    <div class="drag-handle" id="dragHandle"></div>
    
    <!-- Tabs -->
    <div class="tabs">
      <button class="tab-btn active" data-target="tab-player">Player & Media</button>
      <button class="tab-btn" data-target="tab-edit" id="btnTabEdit">Edit Object</button>
      <button class="tab-btn" data-target="tab-world">World Env</button>
    </div>

    <!-- Player & Library Tab -->
    <div class="tab-content active" id="tab-player">
      <div id="player-bar">
        <button class="play-btn" id="btnPlayPause">▶</button>
        <div class="track-info">
          <b id="lblTrack" style="color:var(--cyan);">No Media Playing</b><br>
          <span style="color:#888" id="lblSub">Upload MP3/MP4 to begin</span>
        </div>
        <button class="btn" id="btnNext" style="padding: 8px;">⏭</button>
      </div>
      
      <div class="row">
        <span style="color:var(--cyan); font-weight:bold; font-size:11px;">MEDIA LIBRARY</span>
        <label class="btn" style="padding: 6px 12px; font-size: 12px; cursor: pointer;">
          + ADD FILES
          <input type="file" id="universalInput" multiple accept="audio/*,video/*,image/*,.glb,.html" style="display:none;">
        </label>
      </div>
      
      <div class="library-grid" id="libraryGrid">
        <!-- Dynamically populated -->
      </div>
    </div>

    <!-- Edit Object Tab -->
    <div class="tab-content" id="tab-edit">
      <div id="noSelectionMsg" style="text-align:center; color:#888; padding: 20px;">
        Tap any 3D object in the space to edit it here.
      </div>
      <div id="editControls" style="display:none; flex-direction:column; gap:12px;">
        <div class="row">
          <b style="color:var(--cyan)" id="editObjName">Object_01</b>
          <button class="btn" id="btnZoomObj" style="padding:4px 8px; font-size:11px;">Focus Camera</button>
        </div>
        <div class="row">
          <span>Scale / Size</span>
          <input type="range" id="rngScale" min="0.5" max="5" step="0.1" value="1">
        </div>
        <div class="row">
          <span>Glow (Bloom) Intensity</span>
          <input type="range" id="rngGlow" min="0" max="2" step="0.1" value="0">
        </div>
        <div class="row">
          <span>Orbit Behavior</span>
          <select id="selOrbit">
            <option value="static">Static (Gravity Anchor)</option>
            <option value="circle">Circular Orbit</option>
            <option value="sphere">Spherical Float</option>
          </select>
        </div>
      </div>
    </div>

    <!-- World Environment Tab -->
    <div class="tab-content" id="tab-world">
      <div class="row">
        <span>Color Matrix</span>
        <select id="selScheme">
          <option value="cyber">Cyber Cyan</option>
          <option value="solar">Solar Flare</option>
          <option value="matrix">Emerald Matrix</option>
        </select>
      </div>
      <div class="row">
        <span>Global Bloom Level</span>
        <input type="range" id="rngGlobalBloom" min="0" max="3" step="0.1" value="1.5">
      </div>
      <div class="row">
        <span>Add Virtual Web Node</span>
        <button class="btn" id="btnAddWeb" style="padding:6px 12px;">+ Spawn</button>
      </div>
    </div>
    
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import TWEEN from 'https://cdn.jsdelivr.net/npm/@tweenjs/tween.js@18.6.4/dist/tween.esm.js';

const $ = id => document.getElementById(id);
const toast = t => {
  const e = $('toast'); e.textContent = t; e.classList.add('show');
  clearTimeout(window.__t); window.__t = setTimeout(() => e.classList.remove('show'), 2000);
};

// UI Interactions (Tabs & Panel)
let panelCollapsed = false;
$('dragHandle').onclick = () => {
  panelCollapsed = !panelCollapsed;
  $('bottomPanel').classList.toggle('collapsed', panelCollapsed);
};

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    $(btn.dataset.target).classList.add('active');
  };
});

// Three.js Fundamentals
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x03040a);
scene.fog = new THREE.FogExp2(0x03040a, 0.015);

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 1000);
camera.position.set(0, 5, 20);

const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
$('webgl').appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.05;
controls.maxDistance = 60;

// Post Processing (Bloom)
const composer = new EffectComposer(renderer);
const renderPass = new RenderPass(scene, camera);
composer.addPass(renderPass);
const bloomPass = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 1.5, 0.4, 0.1);
composer.addPass(bloomPass);

const room = new THREE.Group(); scene.add(room);
const state = { primary: 0x00f3ff, secondary: 0xff00ff, logic: 0x62fcd7, globalBloom: 1.5 };
const interactableObjects = [];
let selectedNode = null;

// Grid Floor
const gridGeo = new THREE.PlaneGeometry(120, 120, 40, 40);
gridGeo.rotateX(-Math.PI / 2);
const gridMat = new THREE.MeshBasicMaterial({ color: state.primary, wireframe: true, transparent: true, opacity: 0.3 });
const gridMesh = new THREE.Mesh(gridGeo, gridMat); 
gridMesh.position.y = -5; room.add(gridMesh);

// Central Gravity Anchor (Nexus Core)
const coreGeo = new THREE.IcosahedronGeometry(2, 2);
const coreMat = new THREE.MeshStandardMaterial({ color: 0x111111, emissive: state.secondary, emissiveIntensity: 0.5, wireframe: true });
const coreMesh = new THREE.Mesh(coreGeo, coreMat);
room.add(coreMesh);
const ambientLight = new THREE.AmbientLight(0xffffff, 0.5); scene.add(ambientLight);

const mediaLibrary = []; // For UI and Playback
const domAudio = new Audio();
let currentMediaIdx = -1;
let audioCtx, analyser, audioData;

$('universalInput').onchange = (e) => {
  const files = Array.from(e.target.files);
  files.forEach(file => processUploadedFile(file));
  e.target.value = ''; // reset
};

function processUploadedFile(file) {
  const url = URL.createObjectURL(file);
  const type = file.type;
  const name = file.name;
  
  const mediaItem = { id: Date.now() + Math.random(), name, type, url, file };
  mediaLibrary.push(mediaItem);
  
  create3DNode(mediaItem);
  updateLibraryUI();
  toast(`Deployed: ${name.slice(0, 10)}`);
}

function create3DNode(media) {
  const nodeGroup = new THREE.Group();
  // Random starting position for spherical float
  const radius = 8 + Math.random() * 10;
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos((Math.random() * 2) - 1);
  nodeGroup.position.setFromSphericalCoords(radius, phi, theta);
  
  let mesh;
  const matParams = { color: 0xffffff, transparent: true, side: THREE.DoubleSide, emissive: state.primary, emissiveIntensity: 0 }; // Glow 0 at start

  // Handle distinct types
  if (media.type.startsWith('image/')) {
    const tex = new THREE.TextureLoader().load(media.url);
    tex.colorSpace = THREE.SRGBColorSpace;
    mesh = new THREE.Mesh(new THREE.PlaneGeometry(4, 4), new THREE.MeshStandardMaterial({ ...matParams, map: tex }));
  } 
  else if (media.type.startsWith('video/')) {
    // Hidden video element for texture
    const vid = document.createElement('video');
    vid.src = media.url; vid.loop = true; vid.muted = true; vid.playsInline = true;
    vid.play().catch(()=>{}); // attempt autoplay
    const tex = new THREE.VideoTexture(vid);
    tex.colorSpace = THREE.SRGBColorSpace;
    mesh = new THREE.Mesh(new THREE.PlaneGeometry(5, 3), new THREE.MeshStandardMaterial({ ...matParams, map: tex }));
    media.videoEl = vid; // Store ref
  } 
  else if (media.name.endsWith('.glb')) {
    new GLTFLoader().load(media.url, gltf => { 
      gltf.scene.scale.setScalar(2); 
      // Force glow reset on loaded materials
      gltf.scene.traverse(c => { if(c.isMesh) { c.material.emissiveIntensity = 0; c.material.emissive.setHex(state.primary); }});
      nodeGroup.add(gltf.scene); 
    });
    // Placeholder invisible hit box for raycasting
    mesh = new THREE.Mesh(new THREE.BoxGeometry(4,4,4), new THREE.MeshBasicMaterial({visible: false}));
  } 
  else if (media.type.startsWith('audio/')) {
    // Audio Visualizer Sphere
    mesh = new THREE.Mesh(
      new THREE.IcosahedronGeometry(1.5, 2), 
      new THREE.MeshStandardMaterial({ ...matParams, color: 0x333333, wireframe: true, emissiveIntensity: 0.2 })
    );
  } else {
    // Generic Document/File
    const canvas = document.createElement('canvas'); canvas.width = 256; canvas.height = 256;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#0a1128'; ctx.fillRect(0,0,256,256);
    ctx.strokeStyle = '#00f3ff'; ctx.lineWidth = 10; ctx.strokeRect(0,0,256,256);
    ctx.fillStyle = '#00f3ff'; ctx.font = 'bold 24px sans-serif'; 
    ctx.fillText(media.name.slice(0, 15), 20, 130);
    mesh = new THREE.Mesh(new THREE.PlaneGeometry(3, 3), new THREE.MeshStandardMaterial({ ...matParams, map: new THREE.CanvasTexture(canvas) }));
  }

  mesh.userData = { isNode: true, mediaId: media.id };
  nodeGroup.add(mesh);
  interactableObjects.push(mesh);
  
  // Custom Data for Animation / State
  nodeGroup.userData = {
    orbitType: 'circle', // 'static', 'circle', 'sphere'
    baseRadius: radius,
    angleY: theta,
    angleXZ: phi,
    speed: (Math.random() * 0.5 + 0.2) * (Math.random() > 0.5 ? 1 : -1),
    glow: 0,
    mediaRef: media,
    meshRef: mesh
  };

  room.add(nodeGroup);
  media.node3D = nodeGroup;
}

$('btnAddWeb').onclick = () => {
  const m = { id: Date.now(), name: 'Web Explorer', type: 'web', url: 'https://www.wikipedia.org' };
  mediaLibrary.push(m);
  create3DNode(m);
  updateLibraryUI();
};

function updateLibraryUI() {
  const grid = $('libraryGrid');
  grid.innerHTML = '';
  mediaLibrary.forEach((m, idx) => {
    const el = document.createElement('div');
    el.className = 'lib-item';
    el.onclick = () => playMedia(idx);
    
    if(m.type.startsWith('image/')) el.innerHTML = `<img src="${m.url}"><span>${m.name.slice(0,8)}</span>`;
    else if(m.type.startsWith('video/')) el.innerHTML = `<video src="${m.url}" muted></video><span>${m.name.slice(0,8)}</span>`;
    else if(m.type.startsWith('audio/')) el.innerHTML = `<div style="font-size:24px">🎵</div><span>${m.name.slice(0,8)}</span>`;
    else if(m.type === 'web') el.innerHTML = `<div style="font-size:24px">🌐</div><span>Web Node</span>`;
    else el.innerHTML = `<div style="font-size:24px">📄</div><span>${m.name.slice(0,8)}</span>`;
    
    if(idx === currentMediaIdx) el.classList.add('active');
    grid.appendChild(el);
  });
}

function playMedia(idx) {
  if (idx < 0 || idx >= mediaLibrary.length) return;
  currentMediaIdx = idx;
  const m = mediaLibrary[idx];
  updateLibraryUI();
  
  $('lblTrack').textContent = m.name;
  
  if (m.type.startsWith('audio/') || m.type.startsWith('video/')) {
    initAudioContext();
    domAudio.src = m.url;
    domAudio.play().then(() => {
      $('btnPlayPause').textContent = '⏸';
      setupMediaSession(m.name, 'Unknown Artist');
    }).catch(e => console.log('Autoplay blocked', e));
    // Unmute video texture in 3D if it's a video
    if(m.videoEl) { m.videoEl.muted = false; m.videoEl.volume = 1; }
  } else if (m.type === 'web') {
    openBrowser(m.url);
  }
}

$('btnPlayPause').onclick = () => {
  if(domAudio.src) {
    if(domAudio.paused) { domAudio.play(); $('btnPlayPause').textContent = '⏸'; }
    else { domAudio.pause(); $('btnPlayPause').textContent = '▶'; }
  }
};
$('btnNext').onclick = () => { playMedia((currentMediaIdx + 1) % mediaLibrary.length); };

// Setup MediaSession for background/lockscreen control
function setupMediaSession(title, artist) {
  if ('mediaSession' in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({ title, artist, album: 'Holo-Nexus Studio' });
    navigator.mediaSession.setActionHandler('play', () => { domAudio.play(); $('btnPlayPause').textContent = '⏸'; });
    navigator.mediaSession.setActionHandler('pause', () => { domAudio.pause(); $('btnPlayPause').textContent = '▶'; });
    navigator.mediaSession.setActionHandler('previoustrack', () => playMedia((currentMediaIdx - 1 + mediaLibrary.length) % mediaLibrary.length));
    navigator.mediaSession.setActionHandler('nexttrack', () => $('btnNext').click());
  }
}

function initAudioContext() {
  if(audioCtx) return;
  const AudioContext = window.AudioContext || window.webkitAudioContext;
  audioCtx = new AudioContext();
  analyser = audioCtx.createAnalyser(); analyser.fftSize = 256;
  audioData = new Uint8Array(analyser.frequencyBinCount);
  const source = audioCtx.createMediaElementSource(domAudio);
  source.connect(analyser);
  analyser.connect(audioCtx.destination);
}

// First interaction unblocks audio/video play policies
window.addEventListener('pointerdown', () => {
  if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  mediaLibrary.forEach(m => { if(m.videoEl && m.videoEl.paused) m.videoEl.play(); });
}, {once:true});

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let lastClickTime = 0;
let clickTimeout;

window.addEventListener('pointerdown', (e) => {
  if (e.target.closest('.ui-layer') || e.target.closest('#browserOverlay')) return; // Ignore UI clicks
  
  pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
  
  raycaster.setFromCamera(pointer, camera);
  const intersects = raycaster.intersectObjects(interactableObjects, false);
  
  const now = Date.now();
  const isDoubleClick = now - lastClickTime < 400;
  lastClickTime = now;

  if (intersects.length > 0) {
    const clickedMesh = intersects[0].object;
    const parentNode = clickedMesh.parent;
    
    if (isDoubleClick) {
      clearTimeout(clickTimeout);
      handleDoubleClick(parentNode);
    } else {
      clickTimeout = setTimeout(() => handleSingleClick(parentNode, clickedMesh), 450);
    }
  } else {
    // Clicked empty space
    selectedNode = null;
    $('noSelectionMsg').style.display = 'block';
    $('editControls').style.display = 'none';
  }
});

function handleSingleClick(nodeGroup, mesh) {
  selectedNode = nodeGroup;
  toast('Node Selected');
  
  // Open Edit Tab
  $('btnTabEdit').click();
  $('noSelectionMsg').style.display = 'none';
  $('editControls').style.display = 'flex';
  
  // Populate UI with node data
  const data = nodeGroup.userData;
  $('editObjName').textContent = data.mediaRef.name;
  $('rngScale').value = nodeGroup.scale.x;
  $('rngGlow').value = data.glow;
  $('selOrbit').value = data.orbitType;
  
  // Flash effect
  const orig = data.meshRef.material.emissiveIntensity || 0;
  new TWEEN.Tween(data.meshRef.material)
    .to({ emissiveIntensity: orig + 2 }, 150)
    .yoyo(true).repeat(1)
    .onComplete(() => { data.meshRef.material.emissiveIntensity = data.glow; })
    .start();
}

function handleDoubleClick(nodeGroup) {
  toast('Focusing Node');
  const targetPos = nodeGroup.position;
  const data = nodeGroup.userData;
  
  // Open Browser if Web Node
  if(data.mediaRef.type === 'web') {
    openBrowser(data.mediaRef.url);
  }
  
  // Tween controls target
  new TWEEN.Tween(controls.target)
    .to({ x: targetPos.x, y: targetPos.y, z: targetPos.z }, 800)
    .easing(TWEEN.Easing.Quadratic.Out)
    .start();
    
  // Move camera slightly in front of object
  const offset = targetPos.clone().normalize().multiplyScalar(targetPos.length() + 8);
  new TWEEN.Tween(camera.position)
    .to({ x: offset.x, y: offset.y, z: offset.z }, 1000)
    .easing(TWEEN.Easing.Cubic.Out)
    .start();
}

function openBrowser(url) {
  $('browserOverlay').style.display = 'flex';
  $('browserFrame').src = url;
}

$('rngScale').oninput = e => { if(selectedNode) selectedNode.scale.setScalar(parseFloat(e.target.value)); };
$('rngGlow').oninput = e => { 
  if(selectedNode) {
    const val = parseFloat(e.target.value);
    selectedNode.userData.glow = val;
    selectedNode.userData.meshRef.material.emissiveIntensity = val;
  }
};
$('selOrbit').onchange = e => { if(selectedNode) selectedNode.userData.orbitType = e.target.value; };
$('btnZoomObj').onclick = () => { if(selectedNode) handleDoubleClick(selectedNode); };

$('selScheme').onchange = e => {
  const c = { cyber: 0x00f3ff, solar: 0xfd76b5, matrix: 0x00ff66 }[e.target.value];
  state.primary = c; gridMat.color.setHex(c); 
  room.children.forEach(c => {
    if(c.userData && c.userData.meshRef && c.userData.meshRef.material.emissive) {
      c.userData.meshRef.material.emissive.setHex(c);
    }
  });
};
$('rngGlobalBloom').oninput = e => { bloomPass.strength = parseFloat(e.target.value); };

const clock = new THREE.Clock();

function animate(time) {
  requestAnimationFrame(animate);
  TWEEN.update(time);
  
  const delta = clock.getDelta();
  const t = clock.getElapsedTime();
  
  // Audio Reactivity (Core Pulse)
  let bass = 0;
  if(analyser && audioData) {
    analyser.getByteFrequencyData(audioData);
    bass = (audioData[2] + audioData[4] + audioData[6]) / 3 / 255;
    coreMesh.scale.setScalar(1 + bass * 0.5);
    coreMesh.rotation.y += 0.01 + (bass * 0.05);
  }

  // Node Animations & Billboarding
  room.children.forEach(child => {
    if (child.userData.isNode === undefined && child.userData.orbitType) {
      const data = child.userData;
      
      // Orbit Logic
      if (data.orbitType !== 'static') {
        data.angleY += data.speed * delta * 0.5;
        if(data.orbitType === 'sphere') data.angleXZ += data.speed * delta * 0.3;
        
        const r = data.baseRadius;
        if(data.orbitType === 'circle') {
          child.position.x = Math.cos(data.angleY) * r;
          child.position.z = Math.sin(data.angleY) * r;
        } else if (data.orbitType === 'sphere') {
          child.position.setFromSphericalCoords(r, data.angleXZ, data.angleY);
        }
      }
      
      // BILLBOARDING: Force mesh inside group to look at camera 
      // (We rotate the mesh itself so the group coordinates aren't messed up by lookAt)
      if (data.meshRef && data.mediaRef.type !== 'audio/') {
         // Copy camera rotation for perfect billboarding of planes
         data.meshRef.quaternion.copy(camera.quaternion);
      }
      
      // Audio reaction for audio nodes
      if (data.mediaRef.type && data.mediaRef.type.startsWith('audio/')) {
        data.meshRef.rotation.x += 0.01;
        data.meshRef.rotation.y += 0.02;
        data.meshRef.scale.setScalar(1 + bass);
        data.meshRef.material.emissiveIntensity = data.glow + (bass * 2); // Pulse glow
      }
    }
  });

  // Grid wave
  gridMesh.position.z = (t * 2) % (120 / 40);

  controls.update();
  composer.render();
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
});
</script>
