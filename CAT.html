        const titleSpan = document.createElement('span');
        titleSpan.className = 'window-title';
        titleSpan.textContent = win.title;
        header.appendChild(titleSpan);

        const controls = document.createElement('div');
        controls.className = 'window-controls';
        controls.innerHTML = `<button class="btn-minimize" title="Minimize">−</button><button class="btn-maximize" title="Maximize">⛶</button><button class="btn-close" title="Close">✕</button>`;
        header.appendChild(controls);
        div.appendChild(header);

        const content = document.createElement('div');
        content.className = 'window-content';
        if (win.file !== '_folder') {
          const iframe = document.createElement('iframe');
          iframe.src = getAppUrl(win.file);
          iframe.loading = 'lazy';
          content.appendChild(iframe);
        } else {
          const placeholder = document.createElement('div');
          placeholder.style.padding = '1rem';
          placeholder.style.color = '#8a8aba';
          placeholder.textContent = 'Folder content';
          content.appendChild(placeholder);
        }

        const notesArea = document.createElement('div');
        notesArea.className = 'window-notes-area';
        notesArea.innerHTML = `<div class="window-tags"><span class="tag-label">🏷️ Tags:</span><input type="text" class="tag-input" placeholder="comma, separated" value="${win.tags}" /></div><textarea class="note-textarea" placeholder="Write notes...">${win.notes}</textarea>`;
        content.appendChild(notesArea);
        div.appendChild(content);

        const resizeHandle = document.createElement('div');
        resizeHandle.className = 'resize-handle';
        div.appendChild(resizeHandle);

        desktop.appendChild(div);

        // Drag & Resize (same as regular)
        let dragData = null;
        function onDragStart(e) {
          if (e.target.closest('.window-controls') || e.target.closest('.star-btn')) return;
          const touch = e.touches ? e.touches[0] : e;
          const rect = div.getBoundingClientRect();
          dragData = { offsetX: touch.clientX - rect.left, offsetY: touch.clientY - rect.top };
          const onMove = (ev) => {
            if (!dragData) return;
            const t = ev.touches ? ev.touches[0] : ev;
            let newX = t.clientX - dragData.offsetX;
            let newY = t.clientY - dragData.offsetY;
            const deskRect = desktop.getBoundingClientRect();
            newX = Math.max(0, Math.min(newX, deskRect.width - div.offsetWidth));
            newY = Math.max(0, Math.min(newY, deskRect.height - div.offsetHeight));
            div.style.left = newX + 'px';
            div.style.top = newY + 'px';
            const winData = windows.find(w => w.id === win.id);
            if (winData) { winData.x = newX; winData.y = newY; saveState(); }
          };
          const onUp = () => { dragData = null; document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); document.removeEventListener('touchmove', onMove); document.removeEventListener('touchend', onUp); };
          document.addEventListener('mousemove', onMove);
          document.addEventListener('mouseup', onUp);
          document.addEventListener('touchmove', onMove, { passive: false });
          document.addEventListener('touchend', onUp, { passive: false });
        }
        header.addEventListener('mousedown', onDragStart);
        header.addEventListener('touchstart', onDragStart, { passive: false });

        let resizeData = null;
        function onResizeStart(e) {
          e.stopPropagation();
          const touch = e.touches ? e.touches[0] : e;
          const rect = div.getBoundingClientRect();
          resizeData = { startX: touch.clientX, startY: touch.clientY, startW: rect.width, startH: rect.height };
          const onMove = (ev) => {
            if (!resizeData) return;
            const t = ev.touches ? ev.touches[0] : ev;
            let newW = resizeData.startW + (t.clientX - resizeData.startX);
            let newH = resizeData.startH + (t.clientY - resizeData.startY);
            const deskRect = desktop.getBoundingClientRect();
            newW = Math.min(Math.max(260, newW), deskRect.width - 20);
            newH = Math.min(Math.max(200, newH), deskRect.height - 20);
            div.style.width = newW + 'px';
            div.style.height = newH + 'px';
            const winData = windows.find(w => w.id === win.id);
            if (winData) { winData.w = newW; winData.h = newH; saveState(); }
          };
          const onUp = () => { resizeData = null; document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); document.removeEventListener('touchmove', onMove); document.removeEventListener('touchend', onUp); };
          document.addEventListener('mousemove', onMove);
          document.addEventListener('mouseup', onUp);
          document.addEventListener('touchmove', onMove, { passive: false });
          document.addEventListener('touchend', onUp, { passive: false });
        }
        resizeHandle.addEventListener('mousedown', onResizeStart);
        resizeHandle.addEventListener('touchstart', onResizeStart, { passive: false });

        controls.querySelector('.btn-minimize').addEventListener('click', (e) => {
          e.stopPropagation();
          win.minimized = true;
          div.remove();
          updateTaskbar();
          saveState();
        });
        controls.querySelector('.btn-maximize').addEventListener('click', (e) => {
          e.stopPropagation();
          win.maximized = !win.maximized;
          div.classList.toggle('maximized');
          if (win.maximized) {
            win._prevRect = { x: win.x, y: win.y, w: win.w, h: win.h };
            div.style.left = '0'; div.style.top = '0';
            div.style.width = '100%'; div.style.height = '100%';
          } else {
            const prev = win._prevRect || { x: 100, y: 60, w: 420, h: 320 };
            win.x = prev.x; win.y = prev.y; win.w = prev.w; win.h = prev.h;
            div.style.left = win.x + 'px'; div.style.top = win.y + 'px';
            div.style.width = win.w + 'px'; div.style.height = win.h + 'px';
          }
          saveState();
        });
        controls.querySelector('.btn-close').addEventListener('click', (e) => {
          e.stopPropagation();
          closeWindow(win.id);
        });

        const noteTextarea = notesArea.querySelector('.note-textarea');
        const tagInput = notesArea.querySelector('.tag-input');
        noteTextarea.addEventListener('input', () => { win.notes = noteTextarea.value; saveState(); });
        tagInput.addEventListener('input', () => { win.tags = tagInput.value; saveState(); });

        updateTaskbar();
        saveState();
      }

      function closeWindow(id) {
        const idx = windows.findIndex(w => w.id === id);
        if (idx === -1) return;
        const win = windows[idx];
        const el = document.querySelector(`.window[data-id="${id}"]`);
        if (el) el.remove();
        windows.splice(idx, 1);
        updateTaskbar();
        saveState();
      }

      // ----- TASKBAR -----
      function updateTaskbar() {
        taskbar.innerHTML = '';
        windows.forEach(win => {
          const item = document.createElement('div');
          item.className = 'task-item';
          const emoji = getIconEmoji(win.file);
          item.innerHTML = `<span class="task-icon">${emoji}</span><span>${win.title}</span>`;
          item.addEventListener('click', () => {
            if (win.minimized) { win.minimized = false; renderWindow(win); }
            else {
              const el = document.querySelector(`.window[data-id="${win.id}"]`);
              if (el) {
                const maxZ = Math.max(...Array.from(document.querySelectorAll('.window')).map(el => parseInt(el.style.zIndex) || 0));
                el.style.zIndex = maxZ + 1;
              }
            }
            updateTaskbar();
            saveState();
          });
          taskbar.appendChild(item);
        });
      }

      // ----- LAUNCH APP & BROWSER -----
      function launchApp(file) {
        const social = socialApps.find(s => s.file === file);
        if (social) {
          if (file === 'browser') { createBrowserWindow(); return; }
          window.open(file, '_blank');
          return;
        }
        if (windows.some(w => w.file === file)) { alert('Already open.'); return; }
        createWindow(file, file, 120 + Math.random()*100, 80 + Math.random()*80, 420, 320);
      }

      function createBrowserWindow() {
        const id = nextId++;
        const win = { id, file: 'browser', title: 'Browser', x: 100, y: 80, w: 500, h: 400, minimized: false, maximized: false, notes: '', tags: '', date: Date.now() };
        windows.push(win);
        renderWindow(win);
        saveState();
        updateTaskbar();
      }

      // ----- APP GRID MODAL -----
      function openAppGrid() { appModal.classList.add('active'); renderAppGrid(''); }
      function renderAppGrid(searchTerm = '') {
        const term = searchTerm.toLowerCase().trim();
        const filtered = appList.filter(app => app.file.toLowerCase().includes(term) || app.desc.toLowerCase().includes(term));
        appGridContainer.innerHTML = '';
        filtered.forEach(app => {
          const div = document.createElement('div');
          div.className = 'app-grid-item';
          div.innerHTML = `<span class="app-icon">${getIconEmoji(app.file)}</span><span class="app-name">${app.file}</span>`;
          div.addEventListener('click', () => { launchApp(app.file); appModal.classList.remove('active'); });
          appGridContainer.appendChild(div);
        });
        socialApps.forEach(social => {
          const div = document.createElement('div');
          div.className = 'app-grid-item';
          div.innerHTML = `<span class="app-icon">${social.emoji}</span><span class="app-name">${social.desc}</span>`;
          div.addEventListener('click', () => { launchApp(social.file); appModal.classList.remove('active'); });
          appGridContainer.appendChild(div);
        });
      }
      openAppGridBtn.addEventListener('click', openAppGrid);
      addAppBtn.addEventListener('click', openAppGrid);
      appModalClose.addEventListener('click', () => appModal.classList.remove('active'));
      appModal.addEventListener('click', (e) => { if (e.target === appModal) appModal.classList.remove('active'); });
      appSearchInput.addEventListener('input', (e) => renderAppGrid(e.target.value));

      // ----- REMOVE LAST APP -----
      removeAppBtn.addEventListener('click', () => {
        if (windows.length === 0) { alert('No windows to close.'); return; }
        const last = windows[windows.length - 1];
        closeWindow(last.id);
      });

      // ----- NEW FOLDER -----
      newFolderBtn.addEventListener('click', () => {
        const name = prompt('Enter folder name:', 'New Folder');
        if (name && name.trim()) { createFolder(name.trim(), '#7a5aff'); arrangeIcons(); }
      });

      // ----- UPLOAD MEDIA -----
      uploadBtn.addEventListener('click', () => fileUploadInput.click());
      fileUploadInput.addEventListener('change', (e) => {
        const files = e.target.files;
        if (!files || files.length === 0) return;
        Array.from(files).forEach(file => {
          const id = 'file_' + Date.now() + '_' + Math.random().toString(36).substr(2,4);
          desktopIcons.push({ id, type: 'file', label: file.name, file: file.name, x: 100 + Math.random()*200, y: 60 + Math.random()*150, folderId: null });
        });
        saveState();
        renderDesktopIcons();
        applyFilterAndSort();
        fileUploadInput.value = '';
        alert(files.length + ' file(s) uploaded.');
      });

      // ----- OPEN / CLOSE ALL -----
      openAllBtn.addEventListener('click', () => {
        appList.forEach(app => { if (!windows.some(w => w.file === app.file)) launchApp(app.file); });
      });
      closeAllBtn.addEventListener('click', () => { windows.slice().forEach(w => closeWindow(w.id)); });

      // ----- THEME TOGGLE -----
      const themes = ['theme-purple','theme-blue','theme-green','theme-red','theme-cyber'];
      let themeIndex = 0;
      themeToggleBtn.addEventListener('click', () => {
        document.body.classList.remove(...themes);
        themeIndex = (themeIndex + 1) % themes.length;
        document.body.classList.add(themes[themeIndex]);
        localStorage.setItem('ai_desktop_theme', themes[themeIndex]);
      });
      const savedTheme = localStorage.getItem('ai_desktop_theme');
      if (savedTheme && themes.includes(savedTheme)) {
        document.body.classList.remove(...themes);
        document.body.classList.add(savedTheme);
        themeIndex = themes.indexOf(savedTheme);
      }

      // ----- FILTER & SORT -----
      function applyFilterAndSort() {
        if (_isRendering) return;
        const filter = filterInput.value.trim().toLowerCase();
        document.querySelectorAll('.window').forEach(el => {
          const id = parseInt(el.dataset.id);
          const win = windows.find(w => w.id === id);
          if (!win) return;
          let show = true;
          if (filter) {
            const tags = win.tags.split(',').map(t => t.trim().toLowerCase());
            show = tags.some(t => t.includes(filter));
          }
          el.style.display = show ? 'flex' : 'none';
        });
        document.querySelectorAll('.desktop-icon').forEach(el => {
          const iconId = el.dataset.iconId;
          const icon = desktopIcons.find(i => i.id === iconId);
          if (!icon) return;
          let show = true;
          if (filter) {
            if (icon.type === 'app') {
              const win = windows.find(w => w.file === icon.file);
              if (win) {
                const tags = win.tags.split(',').map(t => t.trim().toLowerCase());
                show = tags.some(t => t.includes(filter));
              } else show = false;
            } else if (icon.type === 'file') show = icon.label.toLowerCase().includes(filter);
            else show = true;
          }
          el.style.display = show ? 'flex' : 'none';
        });
        sortIconsAndWindows();
      }

      filterInput.addEventListener('input', () => {
        applyFilterAndSort();
        clearFilterBtn.classList.toggle('show', filterInput.value.length > 0);
      });
      clearFilterBtn.addEventListener('click', () => {
        filterInput.value = '';
        applyFilterAndSort();
        clearFilterBtn.classList.remove('show');
      });
      sortSelect.addEventListener('change', applyFilterAndSort);

      // ----- ARRANGE & VIEW -----
      arrangeBtn.addEventListener('click', arrangeIcons);
      viewToggleBtn.addEventListener('click', toggleView);

      // ----- FAVORITES PANEL -----
      function renderFavorites() {
        const search = favSearch.value.toLowerCase().trim();
        const favIcons = desktopIcons.filter(icon => favorites.includes(icon.id) && !icon.folderId);
        favList.innerHTML = '';
        if (favIcons.length === 0) {
          favList.innerHTML = '<div style="color:#8a8aba; text-align:center; padding:1rem;">No favorites yet.</div>';
          return;
        }
        const filtered = favIcons.filter(icon => icon.label.toLowerCase().includes(search));
        filtered.forEach(icon => {
          const item = document.createElement('div');
          item.className = 'fav-item';
          const emoji = icon.type === 'app' ? getIconEmoji(icon.file) : '📄';
          item.innerHTML = `
            <span class="fav-icon">${emoji}</span>
            <span class="fav-label">${icon.label}</span>
            <span class="fav-remove" data-id="${icon.id}">✕</span>
          `;
          item.addEventListener('click', (e) => {
            if (e.target.classList.contains('fav-remove')) return;
            if (icon.type === 'app') launchApp(icon.file);
            else alert('File: ' + icon.label);
          });
          item.querySelector('.fav-remove').addEventListener('click', (e) => {
            e.stopPropagation();
            const idx = favorites.indexOf(icon.id);
            if (idx > -1) {
              favorites.splice(idx, 1);
              saveState();
              renderDesktopIcons();
              renderFavorites();
            }
          });
          favList.appendChild(item);
        });
      }

      favoritesToggleBtn.addEventListener('click', () => {
        favoritesPanel.classList.toggle('open');
        renderFavorites();
      });
      favPanelClose.addEventListener('click', () => favoritesPanel.classList.remove('open'));
      favSearch.addEventListener('input', renderFavorites);

      // ----- EXPORT / IMPORT -----
      function exportNotes() {
        const data = {
          windows: windows.map(win => ({ title: win.title, file: win.file, notes: win.notes, tags: win.tags, date: win.date })),
          icons: desktopIcons.map(icon => ({ id: icon.id, type: icon.type, label: icon.label, file: icon.file || '', x: icon.x, y: icon.y, folderId: icon.folderId || null, color: icon.color || null })),
          folders: folders.map(f => ({ id: f.id, name: f.name, appIds: f.appIds, color: f.color || null })),
          favorites: favorites,
          listView: listView,
          githubUser: GITHUB_USER
        };
        const text = JSON.stringify(data, null, 2);
        const blob = new Blob([text], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'ai_desktop_export.txt';
        a.click();
        URL.revokeObjectURL(url);
      }
      exportBtn.addEventListener('click', exportNotes);

      importBtn.addEventListener('click', () => importFileInput.click());
      importFileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const data = JSON.parse(ev.target.result);
            if (data.windows) {
              data.windows.forEach(item => {
                const win = windows.find(w => w.file === item.file);
                if (win) {
                  win.notes = item.notes || '';
                  win.tags = item.tags || '';
                  const el = document.querySelector(`.window[data-id="${win.id}"]`);
                  if (el) {
                    const textarea = el.querySelector('.note-textarea');
                    const tagInput = el.querySelector('.tag-input');
                    if (textarea) textarea.value = win.notes;
                    if (tagInput) tagInput.value = win.tags;
                  }
                }
              });
            }
            if (data.favorites) favorites = data.favorites;
            if (data.listView !== undefined) {
              listView = data.listView;
              if (listView) desktop.classList.add('list-view');
            }
            if (data.githubUser) {
              GITHUB_USER = data.githubUser;
              fetchAppList(GITHUB_USER).then(() => {
                alert('GitHub user switched to: ' + GITHUB_USER);
                location.reload();
              });
            }
            saveState();
            renderDesktopIcons();
            renderFavorites();
            alert('Notes & settings imported!');
          } catch (err) { alert('Import failed: ' + err.message); }
        };
        reader.readAsText(file);
        importFileInput.value = '';
      });

      // ----- RESET -----
      resetBtn.addEventListener('click', () => {
        if (confirm('Reset all data?')) {
          localStorage.removeItem(STORAGE_KEY);
          localStorage.removeItem('ai_desktop_theme');
          location.reload();
        }
      });

      // ----- CAT -----
      const catFacts = [
        '🐱 I purr when you organize your files.',
        '📂 Drag apps into folders to keep your desktop tidy!',
        '🎨 You can change the theme with the 🎨 button.',
        '📤 Upload any file – I\'ll guard it with my whiskers!',
        '💡 Double‑click any icon to open it.',
        '🔍 Use the filter to find apps by tag.',
        '📋 Sort windows by name, tag, or date.',
        '🗑️ Right‑click a folder and type "delete" to remove it.',
        '📦 The Apps grid shows all available apps.',
        '📁 Folders can hold apps and files – drag them in!',
        '🖱️ Resize windows by dragging the bottom‑right corner.',
        '🌙 I love the cyberpunk aesthetic – don\'t you?',
        '⚡ This desktop is powered by pure JavaScript magic.',
        '🎵 Try opening a music app – I\'ll start dancing!'
      ];
      catWidget.addEventListener('click', () => {
        const fact = catFacts[Math.floor(Math.random() * catFacts.length)];
        catSpeech.textContent = fact;
        catSpeech.style.display = 'block';
        setTimeout(() => { catSpeech.style.display = 'none'; }, 4000);
      });

      // ----- PERSISTENCE -----
      function saveState() {
        const state = {
          windows: windows.map(win => ({ id: win.id, file: win.file, title: win.title, x: win.x, y: win.y, w: win.w, h: win.h, minimized: win.minimized, maximized: win.maximized, notes: win.notes, tags: win.tags, date: win.date })),
          icons: desktopIcons.map(icon => ({ id: icon.id, type: icon.type, label: icon.label, file: icon.file || '', x: icon.x, y: icon.y, folderId: icon.folderId || null, color: icon.color || null })),
          folders: folders.map(f => ({ id: f.id, name: f.name, appIds: f.appIds, color: f.color || null })),
          nextId, nextFolderId,
          listView: listView,
          favorites: favorites,
          githubUser: GITHUB_USER
        };
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
      }

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return false;
          const data = JSON.parse(raw);
          if (!data) return false;
          if (data.windows) {
            data.windows.forEach(item => {
              const win = { id: item.id, file: item.file, title: item.title || item.file, x: item.x || 100, y: item.y || 60, w: item.w || 420, h: item.h || 320, minimized: item.minimized || false, maximized: item.maximized || false, notes: item.notes || '', tags: item.tags || '', date: item.date || Date.now() };
              windows.push(win);
              if (!win.minimized) renderWindow(win);
            });
            const maxId = windows.reduce((max, w) => Math.max(max, w.id), 0);
            nextId = maxId + 1;
          }
          if (data.icons) {
            desktopIcons = data.icons.map(icon => ({ id: icon.id, type: icon.type, label: icon.label, file: icon.file || '', x: icon.x || 100, y: icon.y || 60, folderId: icon.folderId || null, color: icon.color || null }));
          }
          if (data.folders) {
            folders = data.folders.map(f => ({ id: f.id, name: f.name, appIds: f.appIds || [], color: f.color || '#7a5aff' }));
          }
          if (data.nextId) nextId = data.nextId;
          if (data.nextFolderId) nextFolderId = data.nextFolderId;
          if (data.listView !== undefined) {
            listView = data.listView;
            if (listView) desktop.classList.add('list-view');
          }
          if (data.favorites) favorites = data.favorites;
          if (data.githubUser) GITHUB_USER = data.githubUser;
          renderDesktopIcons();
          updateTaskbar();
          renderFavorites();
          return true;
        } catch(e) { return false; }
      }

      // ----- INIT -----
      async function init() {
        const loaded = loadState();
        await fetchAppList(GITHUB_USER);
        if (!loaded) {
          // Create app icons (no social apps on desktop)
          appList.forEach((app, idx) => {
            desktopIcons.push({ id: 'app_' + idx, type: 'app', label: app.file, file: app.file, x: 60 + (idx % 8) * 68, y: 30 + Math.floor(idx / 8) * 76, folderId: null });
          });
          // No social apps on desktop
          const folder = createFolder('My Favorites', '#ff6a8a');
          const favApps = ['CREATORBOARD', 'MUSICSHELL0', 'COSMICSHELL0'];
          favApps.forEach(file => {
            const icon = desktopIcons.find(i => i.file === file);
            if (icon) moveIconToFolder(icon.id, folder.id);
          });
          arrangeIcons();
          // Do NOT open any windows on first load
          saveState();
          renderDesktopIcons();
          applyFilterAndSort();
        } else {
          renderDesktopIcons();
          applyFilterAndSort();
        }
        console.log('✨ Ai Desktop v15 ready!');
        console.log(`📦 ${appList.length} apps loaded from GitHub user: ${GITHUB_USER}`);
        console.log(`⭐ ${favorites.length} favorites.`);
      }

      init();
    })();
  </script>
</body>
</html>
