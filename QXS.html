<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>WorldPeace Editor — Voxel & Asset Studio</title>
    <style>
        :root{
            --safe-top:env(safe-area-inset-top,0px);
            --safe-right:env(safe-area-inset-right,0px);
            --safe-bottom:env(safe-area-inset-bottom,0px);
            --safe-left:env(safe-area-inset-left,0px);
            --panel:rgba(15,16,22,.88);
            --panel2:rgba(25,26,35,.92);
            --text:#f4f5f7;
            --muted:#aeb4c0;
            --accent:#4a9eff;
            --accent2:#ff9f4a;
            --radius:12px;
            --small:10px;
        }
        *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
        html,body{
            width:100%;height:100%;margin:0;overflow:hidden;
            position:fixed;inset:0;background:#0b0c10;
            color:var(--text);
            font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
            touch-action:none;
            -webkit-user-select:none;user-select:none;
            -webkit-touch-callout:none;
        }
        #game{display:block;width:100%;height:100%;touch-action:none;filter:brightness(1) contrast(1) saturate(1);}
        .ui{position:fixed;z-index:5;pointer-events:none}
        .panel{background:var(--panel);border:1px solid rgba(255,255,255,.12);border-radius:var(--radius);
            box-shadow:0 4px 24px rgba(0,0,0,.32);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);padding:6px 8px;}
        /* Left side main menu (goldener schnitt friendly) */
        #mainMenu{
            top:calc(var(--safe-top) + 8px);
            left:calc(var(--safe-left) + 8px);
            width:210px;max-height:calc(100vh - var(--safe-top) - var(--safe-bottom) - 16px);
            overflow-y:auto;overflow-x:hidden;pointer-events:auto;
            display:flex;flex-direction:column;gap:6px;
        }
        .menu-section{display:flex;flex-direction:column;gap:4px;}
        .menu-section h4{margin:4px 0 2px 4px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}
        .btn-row{display:flex;gap:4px;flex-wrap:wrap;}
        button{
            pointer-events:auto;
            min-width:36px;min-height:36px;
            padding:6px 10px;border-radius:8px;
            border:1px solid rgba(255,255,255,.15);
            background:var(--panel2);color:var(--text);
            font:500 12px/1 -apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;
            box-shadow:0 2px 10px rgba(0,0,0,.3);
            cursor:pointer;transition:transform .08s, background .15s;
            white-space:nowrap;
        }
        button:active{transform:scale(.92)}
        button.active{background:var(--accent);color:#000;border-color:var(--accent)}
        button.accent{background:var(--accent2);color:#000}
        .small{font-size:10px;padding:4px 6px;min-width:30px;min-height:28px;}
        .elem-btn{padding:4px 8px;font-size:11px;}
        .elem-btn.active{border:2px solid white}
        .layer-btn{min-width:28px;padding:4px 6px;font-size:11px;}
        .slider-row{display:flex;align-items:center;gap:6px;font-size:11px;}
        .slider-row input{flex:1;min-width:0;}
        /* right top info */
        #infoPanel{
            top:calc(var(--safe-top) + 8px);right:calc(var(--safe-right) + 8px);
            max-width:200px;pointer-events:none;text-align:right;
        }
        /* bottom status */
        #statusBar{
            bottom:calc(var(--safe-bottom) + 8px);left:50%;transform:translateX(-50%);
            pointer-events:none;text-align:center;font-size:11px;color:var(--muted);
            background:var(--panel);padding:4px 12px;border-radius:20px;
        }
        input[type="file"]{display:none}
        @media(max-width:700px){
            #mainMenu{width:170px;padding:4px;}
            button{font-size:11px;padding:5px 7px;}
        }
    </style>
</head>

    <div id="infoText">Tap / drag to paint</div>
</div>

<!-- STATUS BAR -->
<div id="statusBar">🖌️ Earth</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

/* ============================================================================
   CONFIG
   ============================================================================ */
const CFG = Object.freeze({
    gridX: 8,
    gridY: 4,
    gridZ: 8,
    cellSize: 1,
    maxPixelRatio: 2,
    cameraTransition: 7,
    dragThreshold: 9,
    orbitSensitivity: 0.32,
    minPhi: 20,
    maxPhi: 84,
    topHeight: 20,
    orbitRadius: 18,
});

const View = { TWO_D: "2D", THREE_D: "3D" };
const Tool = { BRUSH: "brush", ERASER: "eraser", ASSET: "asset", STICKER: "sticker" };

/* ============================================================================
   ELEMENTS & MATERIALS
   ============================================================================ */
const SHAPES = {
    cubic: new THREE.BoxGeometry(0.92, 0.92, 0.92),
    spheric: new THREE.SphereGeometry(0.46, 10, 8),
    cylinder: new THREE.CylinderGeometry(0.35, 0.35, 0.9, 10),
    cone: new THREE.ConeGeometry(0.4, 0.9, 10),
    pyramid: new THREE.ConeGeometry(0.4, 0.9, 4),
    plane: new THREE.PlaneGeometry(0.9, 0.9),
    triangle: new THREE.ConeGeometry(0.4, 0.9, 3),
};

const ELEMENTS = {
    air:      { name: "Air",    shape: null,      color: 0x000000, emissive: 0x000000, roughness: 1.0 },
    earth:    { name: "Earth",  shape: "cubic",   color: 0x5b9bd5, emissive: 0x0a1a2a, roughness: 0.7 },
    cloud:    { name: "Cloud",  shape: "spheric", color: 0xf0f0f0, emissive: 0x101018, roughness: 0.9 },
    sun:      { name: "Sun",    shape: "spheric", color: 0xffaa00, emissive: 0x441100, roughness: 0.3 },
    moon:     { name: "Moon",   shape: "spheric", color: 0xcccccc, emissive: 0x101020, roughness: 0.6 },
    grass:    { name: "Grass",  shape: "cubic",   color: 0x4caf50, emissive: 0x0a1a0a, roughness: 0.8 },
    water:    { name: "Water",  shape: "cubic",   color: 0x2196f3, emissive: 0x001020, roughness: 0.2, transparent: true, opacity: 0.8 },
    sand:     { name: "Sand",   shape: "cubic",   color: 0xffe0b2, emissive: 0x1a1408, roughness: 0.9 },
    stone:    { name: "Stone",  shape: "cubic",   color: 0x9e9e9e, emissive: 0x080808, roughness: 0.9 },
    fire:     { name: "Fire",   shape: "spheric", color: 0xff5722, emissive: 0x441100, roughness: 0.5 },
};

const MATERIALS = {};
for (const [key, def] of Object.entries(ELEMENTS)) {
    if (def.shape) {
        MATERIALS[key] = new THREE.MeshLambertMaterial({
            color: def.color,
            emissive: def.emissive,
            roughness: def.roughness,
            flatShading: true,
            transparent: def.transparent || false,
            opacity: def.opacity || 1.0,
        });
    }
}

/* ============================================================================
   BLOCK & GRID
   ============================================================================ */
class Block {
    constructor(x, y, z, element = "air") {
        this.x = x; this.y = y; this.z = z;
        this.element = element;
        this.mesh = null;
        if (element !== "air") this._addMesh(element);
    }
    _addMesh(element) {
        const def = ELEMENTS[element];
        const geo = SHAPES[def.shape];
        const mat = MATERIALS[element];
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(
            this.x * CFG.cellSize - CFG.gridX * CFG.cellSize / 2 + CFG.cellSize / 2,
            this.y * CFG.cellSize + CFG.cellSize / 2,
            this.z * CFG.cellSize - CFG.gridZ * CFG.cellSize / 2 + CFG.cellSize / 2
        );
        mesh.userData.block = this;
        this.mesh = mesh;
    }
    setElement(newElement) {
        if (this.mesh) { this.mesh.parent?.remove(this.mesh); this.mesh = null; }
        this.element = newElement;
        if (newElement !== "air") this._addMesh(newElement);
    }
}

class Grid {
    constructor() {
        this.blocks = new Map();
        this.group = new THREE.Group();
        this.group.name = "GridBlocks";
        this.assetGroup = new THREE.Group();
        this.assetGroup.name = "CustomAssets";
        for (let x = 0; x < CFG.gridX; x++)
            for (let y = 0; y < CFG.gridY; y++)
                for (let z = 0; z < CFG.gridZ; z++) {
                    const b = new Block(x, y, z, "air");
                    this.blocks.set(`${x},${y},${z}`, b);
                }
        this.group.add(this.assetGroup);
    }
    setBlock(x, y, z, element) {
        if (x<0||x>=CFG.gridX||y<0||y>=CFG.gridY||z<0||z>=CFG.gridZ) return;
        const key = `${x},${y},${z}`;
        const b = this.blocks.get(key);
        if (b.mesh) this.group.remove(b.mesh);
        b.setElement(element);
        if (b.mesh) this.group.add(b.mesh);
    }
    getBlock(x,y,z){ return this.blocks.get(`${x},${y},${z}`); }
    fillAll(element){ for(let x=0;x<CFG.gridX;x++)for(let y=0;y<CFG.gridY;y++)for(let z=0;z<CFG.gridZ;z++) this.setBlock(x,y,z,element); }
    loadJSON(json){ this.fillAll("air"); for(const v of json.voxels) this.setBlock(v.x,v.y,v.z,v.element); }
    toJSON(){
        const voxels = [];
        for(const [key,b] of this.blocks){ if(b.element !== "air") voxels.push({x:b.x,y:b.y,z:b.z,element:b.element}); }
        return {voxels, assets: this.assetGroup.children.map(m => ({type:"mesh", position:m.position.toArray(), scale:m.scale.toArray(), quaternion:m.quaternion.toArray()}))};
    }
}

/* ============================================================================
   ASSET SYSTEM
   ============================================================================ */
const gltfLoader = new GLTFLoader();
const assetLibrary = []; // {name, object}
let selectedAssetId = 0;

function addAssetMesh(object, name = "custom") {
    object.traverse(o => { if(o.isMesh) { o.castShadow = false; o.receiveShadow = false; o.userData.asset = true; }});
    assetLibrary.push({name, object});
    grid.assetGroup.add(object);
    updateAssetList();
}

/* ============================================================================
   PARTICLE SYSTEM (simple sprites)
   ============================================================================ */
const particleSystems = [];
class ParticleSystem {
    constructor(type) {
        this.type = type;
        this.group = new THREE.Group();
        this.particles = [];
        const count = 100;
        const geo = new THREE.BufferGeometry();
        const positions = new Float32Array(count*3);
        geo.setAttribute('position', new THREE.BufferAttribute(positions,3));
        const material = new THREE.PointsMaterial({ color:0xffffff, size:0.05, transparent:true, opacity:0.8, blending:THREE.AdditiveBlending });
        this.points = new THREE.Points(geo, material);
        this.group.add(this.points);
        for(let i=0;i<count;i++){ this.particles.push({x:0,y:0,z:0,vx:0,vy:0,vz:0,life:0}); }
        scene.add(this.group);
        particleSystems.push(this);
    }
    update(dt) {
        const positions = this.points.geometry.attributes.position.array;
        for(let i=0;i<this.particles.length;i++){
            const p = this.particles[i];
            p.life -= dt;
            if(p.life <= 0){
                p.x = (Math.random()-0.5)*8; p.y = Math.random()*6; p.z = (Math.random()-0.5)*8;
                p.vx = (Math.random()-0.5)*0.5; p.vy = (this.type==='rain') ? -3 : (this.type==='snow') ? -0.5 : 0;
                p.vz = (Math.random()-0.5)*0.5;
                p.life = (this.type==='fire') ? 0.5 : 2;
            } else {
                p.x += p.vx*dt; p.y += p.vy*dt; p.z += p.vz*dt;
            }
            positions[i*3] = p.x; positions[i*3+1] = p.y; positions[i*3+2] = p.z;
        }
        this.points.geometry.attributes.position.needsUpdate = true;
    }
    stop() { scene.remove(this.group); const idx = particleSystems.indexOf(this); if(idx>-1) particleSystems.splice(idx,1); }
}

/* ============================================================================
   CAMERA / TOUCH
   ============================================================================ */
class CameraController {
    constructor(camera, state) {
        this.camera = camera; this.state = state;
        this.theta = 40; this.phi = 58; this.radius = CFG.orbitRadius;
        this.targetPos = new THREE.Vector3(); this.look = new THREE.Vector3(0,0,0);
        this.camera.position.set(0, CFG.topHeight, 0.001);
        this.camera.lookAt(this.look); this.camera.fov = 28; this.camera.updateProjectionMatrix();
    }
    orbit(dx,dy){ if(this.state.target!==View.THREE_D)return; this.theta-=dx*CFG.orbitSensitivity; this.phi=THREE.MathUtils.clamp(this.phi-dy*CFG.orbitSensitivity*0.8,CFG.minPhi,CFG.maxPhi); }
    update(dt){
        const a=1-Math.exp(-CFG.cameraTransition*dt);
        if(this.state.target===View.TWO_D) this.targetPos.set(0,CFG.topHeight,0.001);
        else{ const t=THREE.MathUtils.degToRad(this.theta); const p=THREE.MathUtils.degToRad(this.phi);
            this.targetPos.set(this.radius*Math.sin(p)*Math.cos(t), this.radius*Math.cos(p), this.radius*Math.sin(p)*Math.sin(t)); }
        this.camera.position.lerp(this.targetPos,a); this.camera.lookAt(this.look);
        const wantedFov=this.state.target===View.TWO_D?28:45;
        this.camera.fov+=(wantedFov-this.camera.fov)*a; this.camera.updateProjectionMatrix();
    }
}

class TouchController {
    constructor(canvas, camera, grid, cameraController, onTap, onDrag) {
        this.canvas=canvas; this.camera=camera; this.grid=grid; this.cameraController=cameraController; this.onTap=onTap; this.onDrag=onDrag;
        this.raycaster=new THREE.Raycaster(); this.ndc=new THREE.Vector2();
        this.pointerId=-1; this.startX=0; this.startY=0; this.lastX=0; this.lastY=0; this.dragging=false;
        canvas.addEventListener('pointerdown',e=>this.down(e)); canvas.addEventListener('pointermove',e=>this.move(e));
        canvas.addEventListener('pointerup',e=>this.up(e)); canvas.addEventListener('pointercancel',e=>this.cancel(e));
        canvas.addEventListener('contextmenu',e=>e.preventDefault());
    }
    down(e){ if(this.pointerId!==-1)return; this.pointerId=e.pointerId; this.startX=this.lastX=e.clientX; this.startY=this.lastY=e.clientY; this.dragging=false; this.canvas.setPointerCapture?.(e.pointerId); }
    move(e){ if(e.pointerId!==this.pointerId)return; const dx=e.clientX-this.lastX,dy=e.clientY-this.lastY; this.lastX=e.clientX; this.lastY=e.clientY;
        if(!this.dragging){ const tx=e.clientX-this.startX,ty=e.clientY-this.startY; if(tx*tx+ty*ty>CFG.dragThreshold**2)this.dragging=true; }
        if(this.dragging)this.onDrag(dx,dy); else this.onTap(e.clientX,e.clientY); }
    up(e){ if(e.pointerId!==this.pointerId)return; if(!this.dragging)this.onTap(e.clientX,e.clientY); this.reset(e.pointerId); }
    cancel(e){ if(e.pointerId===this.pointerId)this.reset(e.pointerId); }
    reset(id){ this.canvas.releasePointerCapture?.(id); this.pointerId=-1; this.dragging=false; }
    raycast(clientX,clientY){
        const rect=this.canvas.getBoundingClientRect(); this.ndc.x=((clientX-rect.left)/rect.width)*2-1; this.ndc.y=-((clientY-rect.top)/rect.height)*2+1;
        this.raycaster.setFromCamera(this.ndc,this.camera); const meshes=Array.from(this.grid.group.children).filter(o=>o.userData.block);
        const hit=this.raycaster.intersectObjects(meshes,false)[0]; if(hit?.object?.userData?.block) return hit.object.userData.block; return null;
    }
}

/* ============================================================================
   SCENE SETUP
   ============================================================================ */
const canvas = document.getElementById('game');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio||1, CFG.maxPixelRatio));
renderer.setSize(innerWidth,innerHeight,false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = false;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0c10);
scene.fog = new THREE.Fog(0x0b0c10,25,45);

const camera = new THREE.PerspectiveCamera(28, innerWidth/innerHeight, 0.1, 100);
scene.add(new THREE.AmbientLight(0x667080,1.25));
const keyLight = new THREE.DirectionalLight(0xffffff,1.8); keyLight.position.set(8,14,6); scene.add(keyLight);

const floor = new THREE.Mesh(new THREE.PlaneGeometry(CFG.gridX*1.15,CFG.gridZ*1.15), new THREE.MeshLambertMaterial({color:0x181a21}));
floor.rotation.x=-Math.PI/2; floor.position.y=-0.01; scene.add(floor);
const gridHelper = new THREE.GridHelper(CFG.gridX*CFG.cellSize,CFG.gridX,0x414553,0x282b34);
gridHelper.position.y=0.01; scene.add(gridHelper);

const grid = new Grid();
scene.add(grid.group);

const state = {current:View.TWO_D, target:View.TWO_D, toggle(){this.target=this.target===View.TWO_D?View.THREE_D:View.TWO_D;}};
const camController = new CameraController(camera, state);

let currentTool = Tool.BRUSH;
let currentElement = 'earth';
let activeLayer = 0; // Y layer for painting
let brushRadius = 1;

function handlePaint(x,y,z){
    if(currentTool===Tool.ERASER) grid.setBlock(x,y,z,'air');
    else if(currentTool===Tool.BRUSH) grid.setBlock(x,y,z,currentElement);
}

const touch = new TouchController(canvas, camera, grid, camController,
    (clientX,clientY)=>{ // tap/paint
        const block = touch.raycast(clientX,clientY);
        if(block){ const r=brushRadius; for(let dx=-r;dx<=r;dx++) for(let dy=-r;dy<=r;dy++) for(let dz=-r;dz<=r;dz++) if(dx*dx+dy*dy+dz*dz<=r*r) handlePaint(block.x+dx, activeLayer, block.z+dz); }
    },
    (dx,dy)=> camController.orbit(dx,dy)
);

/* ============================================================================
   UI WIRING
   ============================================================================ */
function updateInfo(msg){ document.getElementById('infoText').innerHTML = msg; }
function updateStatus(msg){ document.getElementById('statusBar').textContent = msg; }

// Layer buttons
const layerDiv = document.getElementById('layerButtons');
for(let y=0;y<CFG.gridY;y++){
    const btn=document.createElement('button'); btn.className='layer-btn'; btn.textContent=`Y${y}`;
    if(y===activeLayer) btn.classList.add('active');
    btn.addEventListener('click',()=>{ activeLayer=y; document.querySelectorAll('.layer-btn').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); });
    layerDiv.appendChild(btn);
}

// Element buttons
const elemDiv = document.getElementById('elementButtons');
for(const [key,def] of Object.entries(ELEMENTS)){
    if(def.shape){
        const btn=document.createElement('button'); btn.className='elem-btn'; btn.textContent=def.name;
        if(key===currentElement) btn.classList.add('active');
        btn.addEventListener('click',()=>{ currentElement=key; document.querySelectorAll('.elem-btn').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); updateStatus(`🖌️ ${def.name}`); });
        elemDiv.appendChild(btn);
    }
}

// Tool buttons
document.getElementById('brushBtn').addEventListener('click',()=>{ currentTool=Tool.BRUSH; setActiveTool('brushBtn'); });
document.getElementById('eraserBtn').addEventListener('click',()=>{ currentTool=Tool.ERASER; setActiveTool('eraserBtn'); });
document.getElementById('assetBrushBtn').addEventListener('click',()=>{ currentTool=Tool.ASSET; setActiveTool('assetBrushBtn'); });
document.getElementById('stickerBrushBtn').addEventListener('click',()=>{ currentTool=Tool.STICKER; setActiveTool('stickerBrushBtn'); });
function setActiveTool(id){ ['brushBtn','eraserBtn','assetBrushBtn','stickerBrushBtn'].forEach(b=>document.getElementById(b).classList.remove('active')); document.getElementById(id).classList.add('active'); }

// View
document.getElementById('viewBtn').addEventListener('click',()=>{ state.toggle(); document.getElementById('viewBtn').textContent = state.target===View.THREE_D?'2D':'3D'; });
document.getElementById('resetCamBtn').addEventListener('click',()=>{ camController.theta=40; camController.phi=58; });

// Filters
let currentFilter = '';
document.getElementById('filterPixelBtn').addEventListener('click',()=>{ canvas.style.filter='pixelated(3px) brightness(1.2)'; });
document.getElementById('filterHoloBtn').addEventListener('click',()=>{ canvas.style.filter='hue-rotate(90deg) saturate(2)'; });
document.getElementById('filterNeonBtn').addEventListener('click',()=>{ canvas.style.filter='contrast(1.5) saturate(1.5)'; });
document.getElementById('filterBtn').addEventListener('click',()=>{ canvas.style.filter='none'; });

// Brush radius
document.getElementById('brushRadius').addEventListener('input',e=>{ brushRadius=parseInt(e.target.value); });

// Asset library
function updateAssetList(){
    const div=document.getElementById('assetList'); div.innerHTML='';
    assetLibrary.forEach((asset,idx)=>{
        const btn=document.createElement('button'); btn.className='small'; btn.textContent=asset.name;
        btn.addEventListener('click',()=>{ selectedAssetId=idx; updateStatus(`📦 ${asset.name} selected`); });
        div.appendChild(btn);
    });
}
document.getElementById('uploadGLB').addEventListener('click',()=>{ const inp=document.createElement('input'); inp.type='file'; inp.accept='.glb,.gltf'; inp.onchange=(e)=>{ const file=e.target.files[0]; if(file){ const url=URL.createObjectURL(file); gltfLoader.load(url,gltf=>{ addAssetMesh(gltf.scene,file.name); },undefined,err=>console.error); } }; inp.click(); });
document.getElementById('uploadImage').addEventListener('click',()=>{ const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*'; inp.onchange=(e)=>{ const file=e.target.files[0]; if(file){ const tex=new THREE.TextureLoader().load(URL.createObjectURL(file)); const mat=new THREE.MeshLambertMaterial({map:tex}); const plane=new THREE.Mesh(new THREE.PlaneGeometry(1,1),mat); addAssetMesh(plane,file.name); } }; inp.click(); });
document.getElementById('exportJSON').addEventListener('click',()=>{ const data=grid.toJSON(); const blob=new Blob([JSON.stringify(data)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='world.json'; a.click(); });
document.getElementById('importJSON').addEventListener('click',()=>{ const inp=document.createElement('input'); inp.type='file'; inp.accept='.json'; inp.onchange=(e)=>{ const file=e.target.files[0]; const reader=new FileReader(); reader.onload=(ev)=>{ grid.loadJSON(JSON.parse(ev.target.result)); }; reader.readAsText(file); }; inp.click(); });

// Presets
document.getElementById('presetGrass').addEventListener('click',()=>{ grid.fillAll('air'); for(let x=0;x<CFG.gridX;x++)for(let z=0;z<CFG.gridZ;z++){ const y=0; grid.setBlock(x,y,z,'grass'); } });
document.getElementById('presetDesert').addEventListener('click',()=>{ grid.fillAll('air'); for(let x=0;x<CFG.gridX;x++)for(let z=0;z<CFG.gridZ;z++){ grid.setBlock(x,0,z,'sand'); } });
document.getElementById('presetWater').addEventListener('click',()=>{ grid.fillAll('air'); for(let x=0;x<CFG.gridX;x++)for(let z=0;z<CFG.gridZ;z++){ grid.setBlock(x,0,z,'water'); } });
document.getElementById('presetFire').addEventListener('click',()=>{ grid.fillAll('air'); for(let x=2;x<6;x++)for(let z=2;z<6;z++){ grid.setBlock(x,0,z,'fire'); } });
document.getElementById('presetNight').addEventListener('click',()=>{ scene.background=new THREE.Color(0x0a0a20); scene.fog=new THREE.Fog(0x0a0a20,25,45); });

// Animation
let floatAnimation = false;
document.getElementById('animFloatBtn').addEventListener('click',()=>{ floatAnimation=true; });
document.getElementById('animStopBtn').addEventListener('click',()=>{ floatAnimation=false; });

// Particles
document.getElementById('pRainBtn').addEventListener('click',()=>{ new ParticleSystem('rain'); });
document.getElementById('pSnowBtn').addEventListener('click',()=>{ new ParticleSystem('snow'); });
document.getElementById('pFireBtn').addEventListener('click',()=>{ new ParticleSystem('fire'); });
document.getElementById('pStopBtn').addEventListener('click',()=>{ particleSystems.forEach(ps=>ps.stop()); });

/* ============================================================================
   ANIMATION LOOP
   ============================================================================ */
const clock = new THREE.Clock();
function animate(){
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(),0.05);
    camController.update(dt);
    if(floatAnimation){
        grid.group.children.forEach(child=>{ if(child.userData.block) child.position.y += Math.sin(Date.now()*0.003)*0.002; });
    }
    particleSystems.forEach(ps=>ps.update(dt));
    renderer.render(scene,camera);
}
animate();

function resize(){ renderer.setSize(innerWidth,innerHeight,false); camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize',resize);
addEventListener('orientationchange',()=>setTimeout(resize,150));

// Expose
window.WorldEditor = {scene, camera, grid, state, setElement:(e)=>currentElement=e, setTool:(t)=>currentTool=t};
</script>
</body>
</html>
