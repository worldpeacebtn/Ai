<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>✨ Stardust 3D Studio Pro ✨</title>
    <style>
        :root {
            --bg: #080810;
            --panel: rgba(15, 15, 28, 0.92);
            --panel2: rgba(25, 25, 45, 0.8);
            --border: rgba(255, 255, 255, 0.15);
            --border2: rgba(255, 255, 255, 0.07);
            --accent: #8b5cf6;
            --accent2: #06b6d4;
            --accent3: #ec4899;
            --gold: #fbbf24;
            --green: #34d399;
            --red: #f87171;
            --text: #f1f1f8;
            --text2: #9090b0;
            --radius: 14px;
            --radius-sm: 8px;
            --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.6);
            --transition: 0.25s cubic-bezier(0.22, 1, 0.36, 1);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--bg);
            font-family: var(--font);
            color: var(--text);
            touch-action: none;
            position: fixed;
            inset: 0;
        }
        #scene-container {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background: radial-gradient(ellipse at center, #0d0d20 0%, #050510 100%);
        }
        #scene-container canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
        }

        /* ─── Top HUD Bar ─── */
        .hud-top {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 30;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 5px 6px;
            gap: 2px;
            background: linear-gradient(180deg, rgba(8, 8, 16, 0.95) 50%, transparent);
            flex-wrap: nowrap;
            pointer-events: none;
        }
        .hud-top>* {
            pointer-events: auto;
        }
        .hud-btn {
            background: rgba(25, 25, 45, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: var(--text);
            padding: 5px 7px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1rem;
            line-height: 1;
            transition: all var(--transition);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2px;
            min-height: 30px;
            min-width: 30px;
            touch-action: manipulation;
            flex-shrink: 0;
            position: relative;
        }
        .hud-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }
        .hud-btn:active {
            transform: scale(0.88);
        }
        .hud-btn.active {
            border-color: var(--accent);
            box-shadow: 0 0 14px rgba(139, 92, 246, 0.5);
            background: rgba(139, 92, 246, 0.25);
        }
        .hud-btn .tip {
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.45rem;
            color: var(--text2);
            letter-spacing: 0.3px;
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .hud-btn:hover .tip {
            opacity: 1;
        }
        .hud-btn-group {
            display: flex;
            gap: 2px;
            align-items: center;
        }

        /* ─── Bottom Mode Bar ─── */
        .hud-bottom {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 30;
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 4px 4px max(4px, var(--safe-bottom));
            gap: 2px;
            background: linear-gradient(0deg, rgba(8, 8, 16, 0.95) 55%, transparent);
            flex-wrap: nowrap;
            pointer-events: none;
        }
        .hud-bottom>* {
            pointer-events: auto;
        }
        .mode-btn {
            flex: 1;
            min-width: 40px;
            max-width: 65px;
            text-align: center;
            padding: 4px 2px;
            border-radius: 8px;
            cursor: pointer;
            background: transparent;
            border: 1.5px solid transparent;
            transition: all var(--transition);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0;
            touch-action: manipulation;
        }
        .mode-btn .ico {
            font-size: 1.15rem;
            line-height: 1.1;
        }
        .mode-btn .lbl {
            font-size: 0.45rem;
            font-weight: 600;
            color: var(--text2);
            letter-spacing: 0.2px;
        }
        .mode-btn.active {
            border-color: var(--accent);
            background: rgba(139, 92, 246, 0.2);
            box-shadow: 0 0 12px rgba(139, 92, 246, 0.35);
        }
        .mode-btn.active .lbl {
            color: var(--text);
        }

        /* ─── Joystick Sphere Panel ─── */
        .joy-panel {
            position: absolute;
            z-index: 40;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: var(--shadow);
            padding: 10px;
            pointer-events: auto;
            max-width: 300px;
            width: 92vw;
            transition: all var(--transition);
        }
        .joy-panel.hidden {
            opacity: 0;
            pointer-events: none;
            transform: translateY(25px) scale(0.9);
        }
        .joy-panel .title {
            font-size: 0.7rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 8px;
            color: var(--accent2);
            letter-spacing: 0.4px;
        }
        .joy-sphere-wrap {
            position: relative;
            width: 140px;
            height: 140px;
            margin: 0 auto 8px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, rgba(139, 92, 246, 0.2), rgba(6, 182, 212, 0.1));
            border: 2px solid rgba(255, 255, 255, 0.15);
            cursor: pointer;
            touch-action: none;
            box-shadow: inset 0 0 30px rgba(139, 92, 246, 0.15), 0 0 20px rgba(139, 92, 246, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .joy-sphere-wrap canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
        }
        .joy-value-label {
            text-align: center;
            font-size: 0.65rem;
            font-weight: 700;
            color: var(--text);
            letter-spacing: 0.3px;
            margin-top: 2px;
            font-variant-numeric: tabular-nums;
        }
        .joy-value-label .val {
            color: var(--accent2);
            font-size: 0.75rem;
        }
        .joy-presets {
            display: flex;
            gap: 3px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 5px;
        }
        .joy-preset {
            padding: 3px 7px;
            border-radius: 5px;
            border: 1px solid var(--border2);
            background: var(--panel2);
            color: var(--text2);
            font-size: 0.5rem;
            cursor: pointer;
            touch-action: manipulation;
        }
        .joy-preset:active {
            background: var(--accent);
            color: #fff;
        }

        /* ─── Timeline Bar ─── */
        .timeline-bar {
            position: absolute;
            bottom: 48px;
            left: 6px;
            right: 6px;
            z-index: 25;
            display: flex;
            align-items: center;
            gap: 4px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 4px 6px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            flex-wrap: wrap;
            pointer-events: auto;
        }
        .timeline-bar .tl-slider {
            flex: 1;
            min-width: 60px;
            height: 16px;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            outline: none;
            cursor: pointer;
        }
        .timeline-bar .tl-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            border: 2px solid rgba(255, 255, 255, 0.3);
            cursor: pointer;
            box-shadow: 0 0 12px rgba(139, 92, 246, 0.6);
        }
        .timeline-bar .tl-time {
            font-size: 0.55rem;
            color: var(--accent2);
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            min-width: 32px;
            text-align: center;
        }
        .timeline-bar .hud-btn {
            font-size: 0.65rem;
            padding: 3px 5px;
            min-height: 22px;
            min-width: 22px;
        }

        /* ─── Upload Overlay ─── */
        .upload-overlay {
            position: fixed;
            inset: 0;
            z-index: 50;
            background: rgba(0, 0, 0, 0.75);
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .upload-overlay.hidden {
            display: none;
        }
        .upload-card {
            background: var(--panel);
            border: 1.5px solid var(--border);
            border-radius: var(--radius);
            padding: 18px;
            text-align: center;
            max-width: 340px;
            width: 92%;
            box-shadow: var(--shadow);
        }
        .upload-card .ico {
            font-size: 2.2rem;
            display: block;
            margin-bottom: 6px;
        }
        .upload-card .msg {
            font-size: 0.6rem;
            color: var(--text2);
            margin-bottom: 10px;
        }
        .upload-card input[type="file"] {
            display: none;
        }
        .upload-actions {
            display: flex;
            gap: 6px;
            justify-content: center;
            flex-wrap: wrap;
            margin: 8px 0;
        }
        .upload-card .hud-btn {
            font-size: 0.7rem;
            padding: 6px 10px;
        }

        /* ─── Toast ─── */
        .toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.7);
            background: rgba(20, 20, 35, 0.95);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 12px 18px;
            z-index: 100;
            pointer-events: none;
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            text-align: center;
            font-weight: 600;
            font-size: 0.7rem;
            box-shadow: 0 0 30px rgba(139, 92, 246, 0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            max-width: 85vw;
        }
        .toast.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }
        .toast .ico {
            font-size: 1.5rem;
            display: block;
            margin-bottom: 4px;
        }

        /* ─── Joint Highlight ─── */
        .joint-highlight {
            position: absolute;
            pointer-events: none;
            border: 2px solid var(--accent3);
            border-radius: 50%;
            width: 28px;
            height: 28px;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 20px rgba(236, 72, 153, 0.8);
            z-index: 5;
            display: none;
            animation: pulse 1.5s ease-in-out infinite;
        }
        @keyframes pulse {
            0%,
            100% {
                box-shadow: 0 0 12px rgba(236, 72, 153, 0.5);
            }
            50% {
                box-shadow: 0 0 28px rgba(236, 72, 153, 1);
            }
        }

        /* ─── Fade Overlay for Skeleton ─── */
        .fade-hint {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 0.55rem;
            color: var(--text2);
            pointer-events: none;
            z-index: 3;
            opacity: 0;
            transition: opacity 0.5s;
            letter-spacing: 0.5px;
            text-align: center;
        }
        .fade-hint.visible {
            opacity: 1;
        }

        @media(max-width:480px) {
            .hud-btn {
                padding: 4px 5px;
                font-size: 0.9rem;
                min-height: 26px;
                min-width: 26px;
            }
            .mode-btn .ico {
                font-size: 1rem;
            }
            .joy-sphere-wrap {
                width: 100px;
                height: 100px;
            }
            .joy-panel {
                padding: 6px;
                border-radius: 10px;
                width: 95vw;
                max-width: 280px;
            }
            .timeline-bar {
                bottom: 40px;
                padding: 3px 4px;
            }
        }
    </style>
</head>
<body>

    <div id="scene-container"></div>
    <div id="joint-labels" style="position:absolute;inset:0;z-index:4;pointer-events:none;overflow:hidden;"></div>
    <div class="joint-highlight" id="jointHighlight"></div>
    <div class="fade-hint" id="fadeHint"></div>

    <!-- Top HUD -->
    <div class="hud-top" id="hudTop">
        <div class="hud-btn-group">
            <button class="hud-btn" id="btnUpload" title="Upload Media">📥<span class="tip">Media</span></button>
            <button class="hud-btn" id="btnSave" title="Save">💾<span class="tip">Save</span></button>
            <button class="hud-btn" id="btnLoad" title="Load">📂<span class="tip">Load</span></button>
            <button class="hud-btn" id="btnExport" title="Export HTML">🌐<span class="tip">Export</span></button>
        </div>
        <div class="hud-btn-group">
            <button class="hud-btn" id="btnJoySettings" title="Settings Joystick">🎛️<span class="tip">Joystick</span></button>
            <button class="hud-btn" id="btnText" title="3D Text">🔤<span class="tip">Text</span></button>
            <button class="hud-btn" id="btnAudio" title="Audio">🎤<span class="tip">Audio</span></button>
            <button class="hud-btn" id="btnCamKey" title="Add Camera Key">🎥<span class="tip">CamKey</span></button>
        </div>
    </div>

    <!-- Bottom Mode Bar -->
    <div class="hud-bottom" id="hudBottom">
        <button class="mode-btn active" data-mode="view"><span class="ico">🔄</span><span class="lbl">View</span></button>
        <button class="mode-btn" data-mode="pose"><span class="ico">🦴</span><span class="lbl">Pose</span></button>
        <button class="mode-btn" data-mode="animate"><span class="ico">🎬</span><span class="lbl">Timeline</span></button>
        <button class="mode-btn" data-mode="audio"><span class="ico">🔊</span><span class="lbl">React</span></button>
        <button class="mode-btn" data-mode="cam"><span class="ico">📷</span><span class="lbl">Cam</span></button>
    </div>

    <!-- Joystick Panel -->
    <div class="joy-panel hidden" id="joyPanel" style="top:42px;right:4px;left:auto;">
        <div class="title" id="joyTitle">🎛️ Settings Joystick</div>
        <div class="joy-sphere-wrap" id="joySphereWrap">
            <canvas id="joyCanvas"></canvas>
        </div>
        <div class="joy-value-label"><span id="joyParamName">Size</span>: <span class="val" id="joyParamVal">2.5</span></div>
        <div class="joy-presets" id="joyPresets">
            <button class="joy-preset" data-param="size">Size</button>
            <button class="joy-preset" data-param="density">Density</button>
            <button class="joy-preset" data-param="depth">Depth</button>
            <button class="joy-preset" data-param="shimmer">Shimmer</button>
            <button class="joy-preset" data-param="flow">Flow</button>
            <button class="joy-preset" data-param="turbulence">Turb</button>
            <button class="joy-preset" data-param="audio">Audio</button>
        </div>
    </div>

    <!-- Timeline Bar -->
    <div class="timeline-bar" id="timelineBar" style="display:none;">
        <span style="font-size:0.5rem;color:var(--text2);">⏱️</span>
        <input type="range" class="tl-slider" id="tlSlider" min="0" max="10" value="0" step="0.05">
        <span class="tl-time" id="tlTime">0.0s</span>
        <button class="hud-btn" id="btnTlKey">🔑</button>
        <button class="hud-btn" id="btnTlPlay">▶️</button>
        <button class="hud-btn" id="btnTlClear">🗑️</button>
        <button class="hud-btn" id="btnTlBlend" title="Blend Mode">🔄</button>
    </div>

    <!-- Upload Overlay -->
    <div class="upload-overlay hidden" id="uploadOverlay">
        <div class="upload-card">
            <span class="ico">📥✨</span>
            <div style="font-weight:700;font-size:0.8rem;margin-bottom:3px;">Upload Media</div>
            <div class="msg">Images, Videos, or Audio (MP3, M4A, WAV, etc.)<br>You can spawn multiple items</div>
            <input type="file" id="unifiedFileInput" accept="image/*,video/*,audio/*,.m4a,.mp3,.wav,.ogg,.aac">
            <div class="upload-actions">
                <label class="hud-btn" for="unifiedFileInput" style="cursor:pointer;">📁 Choose File</label>
            </div>
            <div id="uploadPreview" style="margin:6px 0;font-size:0.6rem;color:var(--text2);"></div>
            <div class="upload-actions">
                <button class="hud-btn" id="btnSpawnImage" style="display:none;font-size:0.6rem;">✨ Spawn as Particles</button>
                <button class="hud-btn" id="btnSpawnAudio" style="display:none;font-size:0.6rem;">🎵 Use Audio</button>
            </div>
            <button class="hud-btn" id="btnCloseUpload" style="font-size:0.65rem;margin-top:8px;width:100%;">Cancel</button>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"><span class="ico" id="toastIcon">✨</span><span id="toastText"></span></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js">
    </script>
    <script>
        (function() {
            'use strict';

            // ─── DOM ───
            const container = document.getElementById('scene-container');
            const jointLabelsEl = document.getElementById('joint-labels');
            const jointHighlight = document.getElementById('jointHighlight');
            const fadeHint = document.getElementById('fadeHint');
            const hudTop = document.getElementById('hudTop');
            const hudBottom = document.getElementById('hudBottom');
            const joyPanel = document.getElementById('joyPanel');
            const joyCanvas = document.getElementById('joyCanvas');
            const joySphereWrap = document.getElementById('joySphereWrap');
            const joyParamName = document.getElementById('joyParamName');
            const joyParamVal = document.getElementById('joyParamVal');
            const joyPresets = document.getElementById('joyPresets');
            const timelineBar = document.getElementById('timelineBar');
            const tlSlider = document.getElementById('tlSlider');
            const tlTime = document.getElementById('tlTime');
            const uploadOverlay = document.getElementById('uploadOverlay');
            const unifiedFileInput = document.getElementById('unifiedFileInput');
            const uploadPreview = document.getElementById('uploadPreview');
            const btnSpawnImage = document.getElementById('btnSpawnImage');
            const btnSpawnAudio = document.getElementById('btnSpawnAudio');
            const toast = document.getElementById('toast');
            const toastText = document.getElementById('toastText');
            const toastIcon = document.getElementById('toastIcon');

            // ─── State ───
            let mode = 'view';
            let particleSize = 2.5;
            let particleDensity = 6;
            let depthSpread = 8;
            let shimmerIntensity = 0.6;
            let flowSpeed = 1.2;
            let turbulence = 0.5;
            let audioSensitivity = 1.5;
            let bassBoost = 1.0;
            let currentTime = 0;
            let isPlaying = false;
            let keyframes = []; // {time, pose}
            let camKeyframes = []; // {time, camTarget:[x,y,z], camSpherical:{r,theta,phi}, blendTime:number}
            let sceneItems = []; // {type:'photo'|'text'|'video', points:THREE.Points, data}
            let skeletonVisible = false;
            let skeletonFadeTarget = 0; // 0=hidden, 1=visible
            let skeletonFadeCurrent = 0;
            let selectedJoint = null;
            let audioContext = null;
            let audioAnalyser = null;
            let audioDataArray = null;
            let audioSource = null;
            let audioActive = false;
            let pendingFile = null;
            let rainbowMode = false;
            let shapeIndex = 0;
            let currentJoyParam = 'size';
            let dragState = { mode: 'none', touches: [], startDist: 0, spherical: null, jointId: null, plane: null,
                joyActive: false, joyAngle: 0, joyRadius: 0 };
            let camTarget = new THREE.Vector3(0, 1.2, 0);
            let camSpherical = { r: 16, theta: 0.4, phi: 1.15 };
            let animationId = null;
            let lastFrameTime = 0;
            let toastTimeout = null;

            // ─── THREE ───
            const scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x080810, 0.01);
            const camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 200);
            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setClearColor(0x080810, 1);
            renderer.outputEncoding = THREE.sRGBEncoding;
            container.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0x333355, 2.0);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.7);
            dirLight.position.set(5, 12, 5);
            scene.add(dirLight);
            const pl1 = new THREE.PointLight(0x8b5cf6, 2.0, 40);
            pl1.position.set(-3, 4, 4);
            scene.add(pl1);
            const pl2 = new THREE.PointLight(0x06b6d4, 1.8, 35);
            pl2.position.set(3, -1, 3);
            scene.add(pl2);

            // Ground reference grid
            const gridGeo = new THREE.GridHelper(20, 20, 0x333355, 0x1a1a2e);
            gridGeo.material.transparent = true;
            gridGeo.material.opacity = 0.3;
            const grid = new THREE.LineSegments(gridGeo);
            grid.position.y = -0.5;
            scene.add(grid);

            function createGlowTexture(shape = 'circle') {
                const c = document.createElement('canvas');
                c.width = 64;
                c.height = 64;
                const ctx = c.getContext('2d');
                const g = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
                g.addColorStop(0, 'rgba(255,255,255,1)');
                g.addColorStop(0.2, 'rgba(255,255,255,0.85)');
                g.addColorStop(0.5, 'rgba(255,255,255,0.4)');
                g.addColorStop(1, 'rgba(255,255,255,0)');
                ctx.fillStyle = g;
                if (shape === 'star') {
                    ctx.clearRect(0, 0, 64, 64);
                    ctx.translate(32, 32);
                    ctx.beginPath();
                    for (let i = 0; i < 5; i++) {
                        const a = (i * 72 - 90) * Math.PI / 180;
                        const ia = (i * 72 + 36 - 90) * Math.PI / 180;
                        const ox = Math.cos(a) * 30,
                            oy = Math.sin(a) * 30;
                        const ix = Math.cos(ia) * 12,
                            iy = Math.sin(ia) * 12;
                        i === 0 ? ctx.moveTo(ox, oy) : ctx.lineTo(ox, oy);
                        ctx.lineTo(ix, iy);
                    }
                    ctx.closePath();
                    ctx.fillStyle = g;
                    ctx.fill();
                } else if (shape === 'diamond') {
                    ctx.clearRect(0, 0, 64, 64);
                    ctx.translate(32, 32);
                    ctx.beginPath();
                    ctx.moveTo(0, -30);
                    ctx.lineTo(25, 0);
                    ctx.lineTo(0, 30);
                    ctx.lineTo(-25, 0);
                    ctx.closePath();
                    ctx.fillStyle = g;
                    ctx.fill();
                } else if (shape === 'heart') {
                    ctx.clearRect(0, 0, 64, 64);
                    ctx.translate(32, 28);
                    ctx.beginPath();
                    ctx.moveTo(0, 15);
                    ctx.bezierCurveTo(-20, -5, -15, -25, 0, -12);
                    ctx.bezierCurveTo(15, -25, 20, -5, 0, 15);
                    ctx.closePath();
                    ctx.fillStyle = g;
                    ctx.fill();
                } else {
                    ctx.fillRect(0, 0, 64, 64);
                }
                const tex = new THREE.CanvasTexture(c);
                tex.needsUpdate = true;
                return tex;
            }
            let glowTexture = createGlowTexture('circle');

            function regenerateGlowTexture() {
                const shapes = ['circle', 'star', 'diamond', 'heart'];
                particleShape = shapes[shapeIndex % shapes.length];
                glowTexture = createGlowTexture(particleShape);
                scene.traverse(o => { if (o.material && o.material.uniforms && o.material.uniforms.uTexture) o.material
                        .uniforms.uTexture.value = glowTexture; });
            }

            const particleVS = `
            attribute float aSize; attribute vec3 aColor; attribute float aTwinkle;
            varying vec3 vColor; varying float vTwinkle;
            uniform float uTime; uniform float uShimmer; uniform float uFlow;
            void main(){
              vColor=aColor; vTwinkle=aTwinkle;
              vec3 pos=position;
              float wave=sin(pos.x*0.7+uTime*uFlow)*0.25+cos(pos.y*0.6+uTime*uFlow*1.1)*0.2;
              pos.y+=wave*0.12;
              pos.x+=sin(pos.z*0.5+uTime*uFlow*0.7)*0.1;
              vec4 mv=modelViewMatrix*vec4(pos,1.0);
              gl_PointSize=aSize*(160.0/length(mv.xyz));
              gl_Position=projectionMatrix*mv;
            }`;
            const particleFS = `
            varying vec3 vColor; varying float vTwinkle;
            uniform float uTime; uniform float uShimmer; uniform sampler2D uTexture;
            void main(){
              vec4 tc=texture2D(uTexture,gl_PointCoord);
              float d=length(gl_PointCoord-vec2(0.5));
              if(d>0.5)discard;
              float tw=0.6+0.4*sin(uTime*2.3+vTwinkle*43.0);
              float sh=0.5+0.5*sin(uTime*1.8+vTwinkle*29.0+d*15.0);
              vec3 col=vColor*(1.0+(sh-0.5)*uShimmer*2.2);
              gl_FragColor=vec4(col,tc.a*tw);
            }`;

            function makeParticleMat() {
                return new THREE.ShaderMaterial({
                    vertexShader: particleVS,
                    fragmentShader: particleFS,
                    transparent: true,
                    blending: THREE.AdditiveBlending,
                    depthWrite: false,
                    depthTest: true,
                    uniforms: { uTime: { value: 0 }, uShimmer: { value: shimmerIntensity }, uFlow: { value: flowSpeed },
                        uTexture: { value: glowTexture } }
                });
            }

            function createBgStars() {
                const g = new THREE.BufferGeometry();
                const n = 250;
                const p = new Float32Array(n * 3);
                const c = new Float32Array(n * 3);
                const s = new Float32Array(n);
                const t = new Float32Array(n);
                for (let i = 0; i < n; i++) {
                    p[i * 3] = (Math.random() - 0.5) * 50;
                    p[i * 3 + 1] = (Math.random() - 0.5) * 35;
                    p[i * 3 + 2] = (Math.random() - 0.5) * 35 - 8;
                    const col = new THREE.Color().setHSL(Math.random() * 0.2 + 0.55, 0.35, 0.45 + Math.random() * 0.5);
                    c[i * 3] = col.r;
                    c[i * 3 + 1] = col.g;
                    c[i * 3 + 2] = col.b;
                    s[i] = Math.random() * 1.8 + 0.4;
                    t[i] = Math.random() * Math.PI * 2;
                }
                g.setAttribute('position', new THREE.BufferAttribute(p, 3));
                g.setAttribute('aColor', new THREE.BufferAttribute(c, 3));
                g.setAttribute('aSize', new THREE.BufferAttribute(s, 1));
                g.setAttribute('aTwinkle', new THREE.BufferAttribute(t, 1));
                return new THREE.Points(g, makeParticleMat());
            }
            const bgStars = createBgStars();
            bgStars.name = 'bgStars';
            scene.add(bgStars);

            // ─── Skeleton ───
            const skelDef = {

                spine: { name: 'Spine', parent: 'root', pos: [0, 0.5, 0], color: 0xf59e0b },
                chest: { name: 'Chest', parent: 'spine', pos: [0, 0.5, 0], color: 0xf97316 },
                neck: { name: 'Neck', parent: 'chest', pos: [0, 0.35, 0], color: 0xef4444 },
                head: { name: 'Head', parent: 'neck', pos: [0, 0.3, 0], color: 0xec4899 },
                lShoulder: { name: 'LShldr', parent: 'chest', pos: [-0.4, 0.1, 0], color: 0x8b5cf6 },
                lElbow: { name: 'LElbow', parent: 'lShoulder', pos: [-0.35, -0.15, 0], color: 0x7c3aed },

            let joints = {};
            let jointMeshes = {};
            let boneLines = {};
            let jointGroup = new THREE.Group();
            jointGroup.name = 'skeleton';

            function buildSkeleton() {
                while (jointGroup.children.length > 0) {
                    const c = jointGroup.children[0];
                    if (c.geometry) c.geometry.dispose();
                    if (c.material) c.material.dispose();
                    jointGroup.remove(c);
                }
                joints = {};
                jointMeshes = {};
                boneLines = {};
                labelDivs = {};
                jointLabelsEl.innerHTML = '';
                for (const [id, d] of Object.entries(skelDef)) {
                    const g = new THREE.SphereGeometry(0.07, 10, 10);
                    const m = new THREE.MeshStandardMaterial({ color: d.color, emissive: d.color, emissiveIntensity: 0.6,
                        roughness: 0.2, metalness: 0.5 });
                    const mesh = new THREE.Mesh(g, m);
                    mesh.userData.jointId = id;
                    mesh.position.set(d.pos[0], d.pos[1], d.pos[2]);
                    mesh.name = 'j_' + id;
                    jointGroup.add(mesh);
                    joints[id] = { ...d, localPos: new THREE.Vector3(d.pos[0], d.pos[1], d.pos[2]) };
                    jointMeshes[id] = mesh;
                    const div = document.createElement('div');
                    div.className = 'joint-label';
                    div.textContent = d.name;
                    div.style.cssText =
                        'position:absolute;color:#fff;font-size:0.45rem;font-weight:700;text-shadow:0 0 8px rgba(139,92,246,0.9);pointer-events:none;transform:translate(-50%,-50%);letter-spacing:0.2px;display:none;';
                    jointLabelsEl.appendChild(div);
                    labelDivs[id] = div;
                }
                for (const [id, d] of Object.entries(skelDef)) {
                    if (!d.parent) continue;
                    const lg = new THREE.BufferGeometry();
                    const lm = new THREE.LineBasicMaterial({ color: d.color, transparent: true, opacity: 0.5,
                        blending: THREE.AdditiveBlending, depthWrite: false });
                    const lp = new Float32Array(6);
                    lg.setAttribute('position', new THREE.BufferAttribute(lp, 3));
                    const line = new THREE.Line(lg, lm);
                    line.userData.boneId = id;
                    line.userData.parentId = d.parent;
                    jointGroup.add(line);
                    boneLines[id] = line;
                }
                computeWorldPositions();
                updateBoneLines();
                updateJointLabels();
            }

            function computeWorldPositions() {
                for (const id of Object.keys(skelDef)) {
                    const d = skelDef[id];
                    if (!d.parent) joints[id].worldPos = joints[id].localPos.clone();
                    else joints[id].worldPos = joints[d.parent].worldPos.clone().add(joints[id].localPos);
                    jointMeshes[id].position.copy(joints[id].worldPos);
                }
            }

            function updateBoneLines() {
                for (const id of Object.keys(boneLines)) {
                    const line = boneLines[id];
                    const pp = joints[line.userData.parentId].worldPos;
                    const cp = joints[id].worldPos;
                    const arr = line.geometry.attributes.position.array;
                    arr[0] = pp.x;
                    arr[1] = pp.y;
                    arr[2] = pp.z;
                    arr[3] = cp.x;
                    arr[4] = cp.y;
                    arr[5] = cp.z;
                    line.geometry.attributes.position.needsUpdate = true;
                }
            }

            function updateJointLabels() {
                const show = skeletonFadeCurrent > 0.1 && jointGroup.visible;
                for (const id of Object.keys(joints)) {
                    const wp = joints[id].worldPos;
                    const sp = wp.clone().project(camera);
                    const div = labelDivs[id];
                    if (sp.z > 1 || sp.z < -1 || !show) div.style.display = 'none';
                    else {
                        div.style.display = 'block';
                        div.style.left = ((sp.x * 0.5 + 0.5) * container.clientWidth) + 'px';
                        div.style.top = ((-sp.y * 0.5 + 0.5) * container.clientHeight) + 'px';
                        div.style.opacity = skeletonFadeCurrent;
                    }
                }
            }

            function getJointAtScreen(x, y) {
                if (!jointGroup.visible || skeletonFadeCurrent < 0.3) return null;
                const rc = new THREE.Raycaster();
                const m = new THREE.Vector2((x / container.clientWidth) * 2 - 1, -(y / container.clientHeight) * 2 + 1);
                rc.setFromCamera(m, camera);
                const ints = rc.intersectObjects(Object.values(jointMeshes), false);
                if (ints.length > 0) return ints[0].object.userData.jointId;
                return null;
            }

            function getDragPlane(wp) {
                const cd = camera.getWorldDirection(new THREE.Vector3());
                const n = cd.clone().negate();
                return new THREE.Plane().setFromNormalAndCoplanarPoint(n, wp);
            }

            function getPointOnPlane(cx, cy, plane) {
                const rc = new THREE.Raycaster();
                const m = new THREE.Vector2((cx / container.clientWidth) * 2 - 1, -(cy / container.clientHeight) * 2 + 1);
                rc.setFromCamera(m, camera);
                const p = new THREE.Vector3();
                rc.ray.intersectPlane(plane, p);
                return p;
            }

            function moveJointToWorld(id, wp) {
                const d = skelDef[id];
                if (!d.parent) joints[id].localPos.copy(wp);
                else joints[id].localPos.copy(wp.clone().sub(joints[d.parent].worldPos));
                computeWorldPositions();
                updateBoneLines();
            }

            function resetPose() {
                for (const id of Object.keys(skelDef)) {
                    const d = skelDef[id];
                    joints[id].localPos.set(d.pos[0], d.pos[1], d.pos[2]);
                }
                computeWorldPositions();
                updateBoneLines();
            }

            // ─── Scene Items ───
            function spawnImageParticles(img) {
                const canvas = document.createElement('canvas');
                const maxDim = 140;
                const s = Math.min(1, maxDim / Math.max(img.width, img.height));
                canvas.width = Math.floor(img.width * s);
                canvas.height = Math.floor(img.height * s);
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                const idata = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const data = idata.data;
                const step = Math.max(1, Math.floor(particleDensity));
                const pos = [],
                    cols = [],
                    szs = [],
                    twk = [];
                const dw = 6,
                    dh = dw * canvas.height / canvas.width;
                const cx = (sceneItems.length * 1.2) % 8 - 3;
                const cy = 1.0 + Math.random() * 1.5;
                const cz = -1 + sceneItems.length * 0.6;
                for (let y = 0; y < canvas.height; y += step) {
                    for (let x = 0; x < canvas.width; x += step) {
                        const idx = (y * canvas.width + x) * 4;
                        const a = data[idx + 3];
                        if (a < 30) continue;
                        const r = data[idx],
                            g = data[idx + 1],
                            b = data[idx + 2];
                        const br = (r + g + b) / 3;
                        if (br < 8) continue;
                        const px = ((x / canvas.width) - 0.5) * dw + cx;
                        const py = -((y / canvas.height) - 0.5) * dh + cy;
                        const pz = cz + (Math.random() - 0.5) * depthSpread * 0.3;
                        pos.push(px, py, pz);
                        cols.push(r / 255, g / 255, b / 255);
                        szs.push(particleSize * (0.5 + br / 255 * 0.8) * (0.6 + Math.random() * 0.7));
                        twk.push(Math.random() * Math.PI * 2);
                    }

                if (pos.length < 8) { showToast('⚠️', 'Image too dark'); return; }
                const g = new THREE.BufferGeometry();

                g.setAttribute('aSize', new THREE.Float32BufferAttribute(szs, 1));
                g.setAttribute('aTwinkle', new THREE.Float32BufferAttribute(twk, 1));
                const mat = makeParticleMat();
                const pts = new THREE.Points(g, mat);

                pts.userData.type = 'photo';

                scene.add(pts);
                sceneItems.push({ type: 'photo', points: pts, data: { pos: new THREE.Vector3(cx, cy, cz) } });
                showToast('✨', pos.length / 3 + ' particles spawned');

            // ─── Camera Keyframes & Blend ───
            function addCameraKeyframe(time) {
                const blendTime = 1.5; // default blend
                camKeyframes.push({
                    time,
                    camTarget: camTarget.toArray(),
                    camSpherical: { ...camSpherical },
                    blendTime
                });
                camKeyframes.sort((a, b) => a.time - b.time);
                showToast('🎥', 'Cam key @' + time.toFixed(1) + 's');
            }

            function getCameraAtTime(t) {
                if (camKeyframes.length === 0) return null;
                if (t <= camKeyframes[0].time) return { target: new THREE.Vector3(...camKeyframes[0].camTarget),
                    spherical: { ...camKeyframes[0].camSpherical }, blendTime: 0 };
                if (t >= camKeyframes[camKeyframes.length - 1].time) {
                    const k = camKeyframes[camKeyframes.length - 1];
                    return { target: new THREE.Vector3(...k.camTarget), spherical: { ...k.camSpherical }, blendTime: 0 };
                }
                for (let i = 0; i < camKeyframes.length - 1; i++) {
                    const k1 = camKeyframes[i],
                        k2 = camKeyframes[i + 1];
                    if (t >= k1.time && t <= k2.time) {
                        const blend = k1.blendTime;
                        const span = k2.time - k1.time;
                        if (blend >= span * 0.8) {
                            const f = (t - k1.time) / span;
                            const sf = f * f * (3 - 2 * f);
                            const target = new THREE.Vector3(
                                k1.camTarget[0] + (k2.camTarget[0] - k1.camTarget[0]) * sf,
                                k1.camTarget[1] + (k2.camTarget[1] - k1.camTarget[1]) * sf,
                                k1.camTarget[2] + (k2.camTarget[2] - k1.camTarget[2]) * sf,
                            );
                            const spherical = {
                                r: k1.camSpherical.r + (k2.camSpherical.r - k1.camSpherical.r) * sf,
                                theta: k1.camSpherical.theta + (k2.camSpherical.theta - k1.camSpherical.theta) * sf,
                                phi: k1.camSpherical.phi + (k2.camSpherical.phi - k1.camSpherical.phi) * sf,
                            };
                            return { target, spherical, blendTime: blend };
                        } else {
                            const blendEnd = k1.time + blend;
                            if (t <= blendEnd) {
                                const f = (t - k1.time) / blend;
                                const sf = f * f * (3 - 2 * f);
                                const target = new THREE.Vector3(
                                    k1.camTarget[0] + (k2.camTarget[0] - k1.camTarget[0]) * sf,
                                    k1.camTarget[1] + (k2.camTarget[1] - k1.camTarget[1]) * sf,
                                    k1.camTarget[2] + (k2.camTarget[2] - k1.camTarget[2]) * sf,
                                );
                                const spherical = {
                                    r: k1.camSpherical.r + (k2.camSpherical.r - k1.camSpherical.r) * sf,
                                    theta: k1.camSpherical.theta + (k2.camSpherical.theta - k1.camSpherical.theta) *
                                        sf,
                                    phi: k1.camSpherical.phi + (k2.camSpherical.phi - k1.camSpherical.phi) * sf,
                                };
                                return { target, spherical, blendTime: blend };
                            } else {
                                return { target: new THREE.Vector3(...k2.camTarget), spherical: { ...k2.camSpherical },
                                    blendTime: 0 };
                            }
                        }
                    }
                }
                return null;
            }

            // ─── Joystick Sphere ───
            function initJoystickCanvas() {
                const c = joyCanvas;
                const wrap = joySphereWrap;
                c.width = wrap.clientWidth || 140;
                c.height = wrap.clientHeight || 140;
                const ctx = c.getContext('2d');
                const cx = c.width / 2,
                    cy = c.height / 2,
                    R = c.width / 2 - 6;

                function draw(angle, radiusPct) {
                    ctx.clearRect(0, 0, c.width, c.height);
                    // Background sphere
                    const grad = ctx.createRadialGradient(cx - R * 0.3, cy - R * 0.3, 0, cx, cy, R);
                    grad.addColorStop(0, 'rgba(139,92,246,0.35)');
                    grad.addColorStop(0.6, 'rgba(6,182,212,0.15)');
                    grad.addColorStop(1, 'rgba(0,0,0,0.3)');
                    ctx.beginPath();
                    ctx.arc(cx, cy, R, 0, Math.PI * 2);
                    ctx.fillStyle = grad;
                    ctx.fill();
                    ctx.strokeStyle = 'rgba(255,255,255,0.25)';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    // Crosshair
                    ctx.beginPath();
                    ctx.moveTo(cx - R * 0.7, cy);
                    ctx.lineTo(cx + R * 0.7, cy);
                    ctx.moveTo(cx, cy - R * 0.7);
                    ctx.lineTo(cx, cy + R * 0.7);
                    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
                    ctx.lineWidth = 1;
                    ctx.stroke();
                    // Joystick point
                    const jx = cx + Math.cos(angle) * radiusPct * R * 0.85;
                    const jy = cy + Math.sin(angle) * radiusPct * R * 0.85;
                    ctx.beginPath();
                    ctx.arc(jx, jy, 12, 0, Math.PI * 2);
                    const jg = ctx.createRadialGradient(jx - 3, jy - 3, 0, jx, jy, 12);
                    jg.addColorStop(0, '#fff');
                    jg.addColorStop(0.5, '#8b5cf6');
                    jg.addColorStop(1, '#06b6d4');
                    ctx.fillStyle = jg;
                    ctx.fill();
                    ctx.strokeStyle = 'rgba(255,255,255,0.6)';

                    ctx.stroke();

                    ctx.beginPath();

                function updateValue(angle, radius) {
                    const paramRanges = {
                        size: [0.2, 8, 0.1],
                        density: [1, 25, 1],
                        depth: [0, 40, 0.5],
                        shimmer: [0, 1, 0.01],
                        flow: [0, 5, 0.1],
                        turbulence: [0, 5, 0.1],
                        audio: [0.1, 5, 0.1],
                    };
                    const pr = paramRanges[currentJoyParam] || [0, 10, 0.1];
                    const range = pr[1] - pr[0];
                    const norm = radius * 2;
                    let val = pr[0] + norm * range;
                    val = Math.round(val / pr[2]) * pr[2];
                    val = Math.max(pr[0], Math.min(pr[1], val));
                    const angleNorm = (angle + Math.PI) / (Math.PI * 2);
                    val = pr[0] + ((angleNorm + radius) % 1) * range;
                    val = Math.round(val / pr[2]) * pr[2];
                    val = Math.max(pr[0], Math.min(pr[1], val));
                    return val;
                }

                function updateParamDisplay() {
                    const names = { size: 'Size', density: 'Density', depth: 'Depth', shimmer: 'Shimmer', flow: 'Flow',
                        turbulence: 'Turbulence', audio: 'Audio Sens' };
                    joyParamName.textContent = names[currentJoyParam] || currentJoyParam;
                    const valMap = { size: particleSize, density: particleDensity, depth: depthSpread,
                        shimmer: shimmerIntensity, flow: flowSpeed, turbulence: turbulence, audio: audioSensitivity };
                    const v = valMap[currentJoyParam] ?? 0;
                    joyParamVal.textContent = typeof v === 'number' ? v.toFixed(2) : v;
                }

                function setParamFromJoystick() {
                    const paramRanges = {
                        size: [0.2, 8, 0.1],
                        density: [1, 25, 1],
                        depth: [0, 40, 0.5],
                        shimmer: [0, 1, 0.01],
                        flow: [0, 5, 0.1],
                        turbulence: [0, 5, 0.1],
                        audio: [0.1, 5, 0.1],
                    };
                    const pr = paramRanges[currentJoyParam];
                    if (!pr) return;
                    const range = pr[1] - pr[0];
                    const norm = joyRadius * 2;
                    let val = pr[0] + norm * range;
                    val = Math.round(val / pr[2]) * pr[2];
                    val = Math.max(pr[0], Math.min(pr[1], val));
                    const angleNorm = (joyAngle + Math.PI) / (Math.PI * 2);
                    val = pr[0] + ((angleNorm * 0.5 + norm * 0.5) % 1) * range;
                    val = Math.round(val / pr[2]) * pr[2];
                    val = Math.max(pr[0], Math.min(pr[1], val));
                    switch (currentJoyParam) {
                        case 'size':
                            particleSize = val;
                            break;
                        case 'density':
                            particleDensity = val;
                            break;
                        case 'depth':
                            depthSpread = val;
                            break;
                        case 'shimmer':
                            shimmerIntensity = val;
                            break;
                        case 'flow':
                            flowSpeed = val;
                            break;
                        case 'turbulence':
                            turbulence = val;
                            break;
                        case 'audio':
                            audioSensitivity = val;
                            break;
                    }
                    updateParamDisplay();
                }

                function onPointerDown(e) {
                    dragging = true;
                    const rect = c.getBoundingClientRect();
                    const px = (e.clientX ?? e.touches[0].clientX) - rect.left;
                    const py = (e.clientY ?? e.touches[0].clientY) - rect.top;
                    const dx = px - cx,
                        dy = py - cy;
                    joyAngle = Math.atan2(dy, dx);
                    joyRadius = Math.min(0.5, Math.sqrt(dx * dx + dy * dy) / R);
                    setParamFromJoystick();
                    draw(joyAngle, joyRadius);
                }

                function onPointerMove(e) {
                    if (!dragging) return;
                    const rect = c.getBoundingClientRect();
                    const px = (e.clientX ?? e.touches[0].clientX) - rect.left;
                    const py = (e.clientY ?? e.touches[0].clientY) - rect.top;
                    const dx = px - cx,
                        dy = py - cy;
                    joyAngle = Math.atan2(dy, dx);
                    joyRadius = Math.min(0.5, Math.sqrt(dx * dx + dy * dy) / R);
                    setParamFromJoystick();
                    draw(joyAngle, joyRadius);
                }

                function onPointerUp() {
                    dragging = false;
                    draw(joyAngle, joyRadius);
                }

                c.addEventListener('touchstart', e => { e.preventDefault();
                    onPointerDown(e); }, { passive: false });
                c.addEventListener('touchmove', e => { e.preventDefault();
                    onPointerMove(e); }, { passive: false });
                c.addEventListener('touchend', onPointerUp, { passive: true });
                c.addEventListener('mousedown', onPointerDown);
                window.addEventListener('mousemove', onPointerMove);
                window.addEventListener('mouseup', onPointerUp);
                c.addEventListener('wheel', e => {
                    e.preventDefault();
                    const delta = e.deltaY > 0 ? -0.02 : 0.02;
                    joyRadius = Math.max(0.05, Math.min(0.5, joyRadius + delta));
                    setParamFromJoystick();
                    draw(joyAngle, joyRadius);
                }, { passive: false });

                // Initial draw
                draw(joyAngle, joyRadius);
                updateParamDisplay();

                // Resize
                const ro = new ResizeObserver(() => {
                    c.width = wrap.clientWidth || 140;
                    c.height = wrap.clientHeight || 140;
                    draw(joyAngle, joyRadius);
                });
                ro.observe(wrap);

                });

                    turbulence: 'Turbulence', audio: 'Audio Sens' };
                joyParamName.textContent = names[param] || param;
                const valMap = { size: particleSize, density: particleDensity, depth: depthSpread, shimmer: shimmerIntensity,
                    flow: flowSpeed, turbulence: turbulence, audio: audioSensitivity };
                const v = valMap[param] ?? 0;
                joyParamVal.textContent = typeof v === 'number' ? v.toFixed(2) : v;
            }

            // ─── Audio System ───
            function initAudio() {
                if (!audioContext) {
                    audioContext = new(window.AudioContext || window.webkitAudioContext)();
                    audioAnalyser = audioContext.createAnalyser();
                    audioAnalyser.fftSize = 128;
                    audioAnalyser.smoothingTimeConstant = 0.6;
                    audioDataArray = new Uint8Array(audioAnalyser.frequencyBinCount);
                }
            }

            function startMic() {
                initAudio();
                navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
                    if (audioSource) audioSource.disconnect();
                    audioSource = audioContext.createMediaStreamSource(stream);
                    audioSource.connect(audioAnalyser);
                    audioActive = true;
                    showToast('🎤', 'Mic active');
                }).catch(() => showToast('⚠️', 'Mic denied'));
            }

            function loadAudioFile(file) {
                initAudio();
                if (audioContext.state === 'suspended') audioContext.resume();
                const url = URL.createObjectURL(file);
                const audio = new Audio(url);
                audio.loop = true;
                const src = audioContext.createMediaElementSource(audio);
                src.connect(audioAnalyser);
                audioAnalyser.connect(audioContext.destination);
                audio.play().catch(() => showToast('⚠️', 'Play failed'));
                audioSource = src;
                audioActive = true;
                showToast('🎵', file.name.slice(0, 20));

            function getAudioLevel() {
                if (!audioActive || !audioAnalyser) return 0;
                audioAnalyser.getByteFrequencyData(audioDataArray);
                let sum = 0;
                for (let i = 0; i < audioDataArray.length; i++) sum += audioDataArray[i];
                return (sum / audioDataArray.length) / 255;
            }

            function getAudioBands() {
                if (!audioActive || !audioAnalyser) return [];
                audioAnalyser.getByteFrequencyData(audioDataArray);
                const bands = [];
                const n = 12;
                const per = Math.floor(audioDataArray.length / n);
                for (let i = 0; i < n; i++) {
                    let s = 0;
                    for (let j = i * per; j < (i + 1) * per; j++) s += audioDataArray[j];
                    bands.push(s / per / 255);
                }
                return bands;

                    const k1 = keyframes[i],
                        k2 = keyframes[i + 1];
                    if (t >= k1.time && t <= k2.time) {
                        const f = (t - k1.time) / (k2.time - k1.time);
                        const sf = f * f * (3 - 2 * f);
                        const res = {};
                        for (const id of Object.keys(k1.pose)) {
                            const p1 = k1.pose[id],
                                p2 = k2.pose[id];
                            res[id] = [p1[0] + (p2[0] - p1[0]) * sf, p1[1] + (p2[1] - p1[1]) * sf, p1[2] + (p2[2] -
                                p1[2]) * sf];
                        }
                        return res;
                    }
                }
                return keyframes[keyframes.length - 1].pose;
            }

            // ─── Camera ───
            function updateCameraFromSpherical() {
                const sp = camSpherical,
                    si = Math.sin(sp.phi);
                camera.position.set(camTarget.x + sp.r * si * Math.sin(sp.theta), camTarget.y + sp.r * Math.cos(sp.phi),
                    camTarget.z + sp.r * si * Math.cos(sp.theta));
                camera.lookAt(camTarget);
            }

            function handleTouchStart(e) {
                e.preventDefault();
                const touches = e.touches;
                dragState.touches = Array.from(touches).map(t => ({ x: t.clientX, y: t.clientY, id: t.identifier }));
                if (touches.length === 1) {
                    if (mode === 'pose') {
                        const jid = getJointAtScreen(touches[0].clientX, touches[0].clientY);
                        if (jid) {
                            dragState.mode = 'dragJoint';
                            dragState.jointId = jid;
                            selectedJoint = jid;
                            dragState.plane = getDragPlane(joints[jid].worldPos);
                            highlightJoint(jid, true);
                            return;
                        }
                    }
                    dragState.mode = 'rotate';
                    dragState.spherical = { ...camSpherical };
                    dragState.touches = [{ x: touches[0].clientX, y: touches[0].clientY }];
                } else if (touches.length === 2) {
                    dragState.mode = 'pinch';
                    const dx = touches[0].clientX - touches[1].clientX;
                    const dy = touches[0].clientY - touches[1].clientY;
                    dragState.startDist = Math.sqrt(dx * dx + dy * dy);
                    dragState.spherical = { ...camSpherical };
                }
            }

            function handleTouchMove(e) {
                e.preventDefault();
                const touches = e.touches;
                if (dragState.mode === 'rotate' && touches.length === 1) {
                    const dx = touches[0].clientX - dragState.touches[0].x;
                    const dy = touches[0].clientY - dragState.touches[0].y;
                    dragState.touches = [{ x: touches[0].clientX, y: touches[0].clientY }];
                    camSpherical.theta -= dx * 0.006;
                    camSpherical.phi = Math.max(0.15, Math.min(Math.PI - 0.15, dragState.spherical.phi + dy * 0.006));
                    updateCameraFromSpherical();
                } else if (dragState.mode === 'pinch' && touches.length === 2) {
                    const dx = touches[0].clientX - touches[1].clientX;
                    const dy = touches[0].clientY - touches[1].clientY;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    const scale = dragState.startDist / dist;
                    camSpherical.r = Math.max(3, Math.min(50, dragState.spherical.r * scale));
                    updateCameraFromSpherical();
                } else if (dragState.mode === 'dragJoint' && touches.length === 1) {
                    const wp = getPointOnPlane(touches[0].clientX, touches[0].clientY, dragState.plane);
                    if (wp) { moveJointToWorld(dragState.jointId, wp); if (mode === 'animate') { /* auto key */ } }
                }
            }

            function handleTouchEnd() {
                if (dragState.mode === 'dragJoint') { highlightJoint(dragState.jointId, false);
                    dragState.jointId = null;
                    dragState.plane = null; }
                dragState.mode = 'none';
                dragState.touches = [];
            }

            function highlightJoint(id, on) {
                const mesh = jointMeshes[id];
                if (!mesh) return;
                if (on) {
                    mesh.scale.set(1.6, 1.6, 1.6);
                    mesh.material.emissiveIntensity = 2.5;
                    const sp = joints[id].worldPos.clone().project(camera);
                    jointHighlight.style.display = 'block';
                    jointHighlight.style.left = ((sp.x * 0.5 + 0.5) * container.clientWidth) + 'px';
                    jointHighlight.style.top = ((-sp.y * 0.5 + 0.5) * container.clientHeight) + 'px';
                } else {
                    mesh.scale.set(1, 1, 1);
                    mesh.material.emissiveIntensity = 0.6;
                    jointHighlight.style.display = 'none';
                }
            }

            function handleMouseDown(e) {
                if (e.button !== 0) return;
                if (mode === 'pose') {
                    const jid = getJointAtScreen(e.clientX, e.clientY);
                    if (jid) {
                        dragState.mode = 'dragJoint';
                        dragState.jointId = jid;
                        selectedJoint = jid;
                        dragState.plane = getDragPlane(joints[jid].worldPos);
                        highlightJoint(jid, true);
                        return;
                    }
                }
                dragState.mode = 'rotate';
                dragState.spherical = { ...camSpherical };
                dragState.touches = [{ x: e.clientX, y: e.clientY }];
            }

            function handleMouseMove(e) {
                if (dragState.mode === 'rotate') {
                    const dx = e.clientX - dragState.touches[0].x;
                    const dy = e.clientY - dragState.touches[0].y;
                    dragState.touches = [{ x: e.clientX, y: e.clientY }];
                    camSpherical.theta -= dx * 0.006;
                    camSpherical.phi = Math.max(0.15, Math.min(Math.PI - 0.15, dragState.spherical.phi + dy * 0.006));
                    updateCameraFromSpherical();
                } else if (dragState.mode === 'dragJoint') {
                    const wp = getPointOnPlane(e.clientX, e.clientY, dragState.plane);
                    if (wp) moveJointToWorld(dragState.jointId, wp);
                }
            }

            function handleMouseUp() {
                if (dragState.mode === 'dragJoint') { highlightJoint(dragState.jointId, false);
                    dragState.jointId = null; }
                dragState.mode = 'none';
            }

            function handleWheel(e) {
                e.preventDefault();
                camSpherical.r = Math.max(3, Math.min(50, camSpherical.r * (e.deltaY > 0 ? 1.1 : 0.9)));
                updateCameraFromSpherical();
            }

            renderer.domElement.addEventListener('touchstart', handleTouchStart, { passive: false });
            renderer.domElement.addEventListener('touchmove', handleTouchMove, { passive: false });
            renderer.domElement.addEventListener('touchend', handleTouchEnd, { passive: true });
            renderer.domElement.addEventListener('touchcancel', handleTouchEnd, { passive: true });
            renderer.domElement.addEventListener('mousedown', handleMouseDown);
            renderer.domElement.addEventListener('mousemove', handleMouseMove);
            renderer.domElement.addEventListener('mouseup', handleMouseUp);
            renderer.domElement.addEventListener('mouseleave', handleMouseUp);
            renderer.domElement.addEventListener('wheel', handleWheel, { passive: false });

            // ─── Toast ───
            function showToast(icon, text) {
                toastIcon.textContent = icon;
                toastText.textContent = text;
                toast.classList.add('show');
                clearTimeout(toastTimeout);
                toastTimeout = setTimeout(() => toast.classList.remove('show'), 1800);
            }

            // ─── Resize ───
            function handleResize() {
                camera.aspect = container.clientWidth / container.clientHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(container.clientWidth, container.clientHeight);
                updateJointLabels();
            }
            window.addEventListener('resize', handleResize);
            window.addEventListener('orientationchange', () => setTimeout(handleResize, 300));

            // ─── Main Loop ───
            function animate() {
                animationId = requestAnimationFrame(animate);
                const now = Date.now();
                const delta = (now - lastFrameTime) / 1000;
                lastFrameTime = now;
                const time = now * 0.001;

                // Skeleton fade
                skeletonFadeCurrent += (skeletonFadeTarget - skeletonFadeCurrent) * 0.08;
                if (skeletonFadeCurrent < 0.005 && skeletonFadeTarget === 0) jointGroup.visible = false;
                else if (skeletonFadeCurrent > 0.005) jointGroup.visible = true;
                if (jointGroup.visible) {
                    jointGroup.traverse(o => {
                        if (o.material) {
                            if (o.material.transparent === undefined) o.material.transparent = true;
                            o.material.opacity = skeletonFadeCurrent;
                            if (o.material.emissiveIntensity !== undefined) o.material
                        .emissiveIntensity = 0.6 + skeletonFadeCurrent * 0.8;
                        }
                    });
                }
                updateJointLabels();

                // Scene items animation
                scene.traverse(o => {
                    if (o.material && o.material.uniforms && o.material.uniforms.uTime) {
                        o.material.uniforms.uTime.value = time;
                        o.material.uniforms.uShimmer.value = shimmerIntensity;
                        o.material.uniforms.uFlow.value = flowSpeed;
                    }
                });

                // Audio reactive
                if (audioActive) {
                    const level = getAudioLevel();
                    const bands = getAudioBands();
                    const sens = audioSensitivity * bassBoost;
                    const boost = level * sens;
                    pl1.intensity = 2 + boost * 3;
                    pl2.intensity = 1.8 + boost * 2.5;
                    sceneItems.forEach((item, i) => {
                        if (item.points) {
                            const sizes = item.points.geometry.attributes.aSize;
                            for (let j = 0; j < sizes.count; j++) {
                                const s = particleSize * (1 + boost * 0.7 * Math.sin(j * 0.3 + time * 3));
                                sizes.setX(j, s);
                            }
                            sizes.needsUpdate = true;
                        }
                    });
                } else {
                    pl1.intensity = 2.0;
                    pl2.intensity = 1.8;
                }

                // Rainbow mode
                if (rainbowMode) {
                    sceneItems.forEach(item => {
                        if (item.points) {
                            const cols = item.points.geometry.attributes.aColor;
                            for (let j = 0; j < cols.count; j++) {
                                const hue = (j / cols.count + time * 0.05) % 1;
                                const c = new THREE.Color().setHSL(hue, 0.8, 0.6);
                                cols.setXYZ(j, c.r, c.g, c.b);
                            }
                            cols.needsUpdate = true;
                        }
                    });
                }

                // Timeline
                if (isPlaying && (keyframes.length > 0 || camKeyframes.length > 0)) {
                    const maxT = Math.max(
                        keyframes.length ? Math.max(...keyframes.map(k => k.time)) : 0,
                        camKeyframes.length ? Math.max(...camKeyframes.map(k => k.time)) : 0
                    );
                    currentTime += delta;
                    if (currentTime > maxT) currentTime = 0;
                    tlSlider.value = currentTime;
                    tlTime.textContent = currentTime.toFixed(1) + 's';
                    const pose = getPoseAtTime(currentTime);
                    if (pose) applyPose(pose);
                    const camPose = getCameraAtTime(currentTime);
                    if (camPose) {
                        camTarget.copy(camPose.target);
                        camSpherical = { ...camPose.spherical };
                        updateCameraFromSpherical();
                    }
                }

                // Dynamic lights
                pl1.position.x = Math.sin(time * 0.6) * 4.5;
                pl1.position.z = Math.cos(time * 0.4) * 3.5;
                pl2.position.x = Math.cos(time * 0.5) * 4;
                pl2.position.z = Math.sin(time * 0.7) * 3.5;

                renderer.render(scene, camera);
            }

            // ─── Init ───
            function init() {
                buildSkeleton();
                resetPose();
                camTarget.set(0, 1.2, 0);
                camSpherical = { r: 16, theta: 0.4, phi: 1.15 };
                updateCameraFromSpherical();
                setSkeletonVisible(false);
                tlSlider.max = 10;
                tlSlider.value = 0;
                tlTime.textContent = '0.0s';
                lastFrameTime = Date.now();
                animate();
                showToast('✨', 'Stardust Studio Pro');
                setTimeout(() => {
                    if (localStorage.getItem('stardust3d_pro3')) showToast('💾', 'Save found — tap 📂');
                }, 600);
            }

            setTimeout(handleResize, 100);
            init();

            window.__stardust = { addCameraKeyframe, spawnImageParticles, spawnTextParticles, clearAllItems,
                setSkeletonVisible, getCameraAtTime, setJoyParam };
        })();
    </script>
</body>
